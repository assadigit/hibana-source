# Hibana CD — continuous deployment on merge to main.
#
# GATE (S59b): this workflow is triggered by CI COMPLETING on main (workflow_run),
# not by the push itself. The old push trigger raced CI — CD started deploying the
# moment the push landed and reached PROD minutes before CI's verdict, so a red CI
# deployed anyway (the old "Only deploy if CI passed" comment described a check that
# was never implemented). Now: CI green ⇒ CD runs; CI failed/cancelled ⇒ CD is
# skipped (visible as a skipped run); CI re-run ⇒ CD redeploys the same SHA.
# checkout pins the EXACT head_sha CI verified — a racing newer push can never ride
# an older commit's green CI into prod; it gets its own CI→CD chain. Deploys queue
# (concurrency, no cancel) so an in-flight deploy is never killed mid-step.
# STALE-CI GUARD (S59b, observed live): CI runs complete out of push order, so the
# queue can serialize an OLDER verified sha's deploy AFTER a newer one's — the guard
# job steps aside when a newer commit's CI owns the queue (green or in flight), and
# deploys on last-green-wins when the newer CI failed.
# Trade-off, deliberate: if ci.yml itself breaks so CI never completes, CD never
# fires — a broken CI file pausing deploys is the safe direction to fail.
#
# Then this workflow:
# 1. Builds the prod assets (--wire-html)
# 2. Deploys to Cloudflare Workers DEV (hibana.aliassadi.workers.dev)
# 3. Live-probes the dev deployment
# 4. Deploys to PROD (hibana.ir) — only after the dev probe passes
# 5. Restores canonical HTML (--restore-html) so git stays clean
#
# PREREQUISITES (add to GitHub repo secrets — Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permission
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID
#
# To disable: comment out the workflow_run trigger below.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  # S59b stale-CI guard: CI runs complete out of PUSH order (observed live: an older
  # commit's slower CI finished 2s after a newer one's), and the concurrency queue
  # serializes deploys in CI-COMPLETION order — so an older verified sha could deploy
  # AFTER a newer one and become the final prod state. The guard steps aside whenever
  # a NEWER commit's CI already owns the queue (completed green, or still in flight —
  # its chain WILL fire and its CD queues behind ours either way). Deploy only when
  # we're the newest commit on main, or the newer CI failed (last-green wins).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    env:
      TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Should this CI→CD chain still deploy?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TIP=$(git ls-remote origin main | cut -f1)
          if [ "$TIP" = "$TRIGGER_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "triggering sha IS main's tip — deploy"
            exit 0
          fi
          # the tip is newer — does its CI own the queue? (CI is the only push-event workflow)
          STATE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=push&head_sha=$TIP&per_page=1" --jq '.workflow_runs[0].status // "none"')
          CONCL=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=push&head_sha=$TIP&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')
          echo "tip=$TIP tip-ci: state=$STATE conclusion=$CONCL (trigger=$TRIGGER_SHA)"
          if [ "$STATE" = "completed" ] && [ "$CONCL" = "success" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::a newer green commit owns the deploy — this chain steps aside"
          elif [ "$STATE" = "none" ] || [ "$STATE" = "completed" ]; then
            # no CI for the tip, or the tip's CI failed/cancelled — deploy this verified sha
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "tip CI $STATE/$CONCL — last-green wins, deploy"
          else
            # tip CI queued/in_progress — its chain will fire and queue behind us; ours is redundant
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tip CI is $STATE — the newer chain owns the deploy, stepping aside"
          fi

  deploy:
    needs: guard
    # Only deploy when the CI run that triggered us SUCCEEDED and the guard says this
    # chain still owns the queue. pull_request CI runs never reach here (workflow_run's
    # branches filter matches their head branch, not main).
    if: github.event.workflow_run.conclusion == 'success' && needs.guard.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy EXACTLY what CI verified — never the moving tip of main.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build prod assets (wire HTML)
        run: node scripts/build.mjs --prod --wire-html

      - name: Deploy to DEV
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Live-probe DEV
        run: |
          sleep 3
          HEALTH=$(curl -s https://hibana.aliassadi.workers.dev/api/health || echo '{}')
          echo "DEV health: $HEALTH"
          echo "$HEALTH" | grep -q '"ok":true' || (echo "FAIL: dev health probe failed"; exit 1)

      - name: Deploy to PROD
        run: npx wrangler deploy --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Live-probe PROD
        run: |
          sleep 3
          HEALTH=$(curl -s https://hibana.ir/api/health || echo '{}')
          echo "PROD health: $HEALTH"
          echo "$HEALTH" | grep -q '"ok":true' || (echo "FAIL: prod health probe failed"; exit 1)

      - name: Restore canonical HTML
        run: node scripts/build.mjs --restore-html

      - name: Verify git tree clean
        run: |
          git diff --exit-code -- public/ || (echo "WARN: canonical HTML not restored"; git diff --stat -- public/)
