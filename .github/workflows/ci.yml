# Hibana CI — typecheck + unit tests + smoke on every push and pull request.
# H4 fix (2026-09-10): all quality gates were manual; a regression could ship without
# anyone running them. This workflow catches type errors, test failures, and broken
# smoke scenarios before they reach a deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # 20 since S181's release round: the full ladder (563 unit + 322 e2e + Lighthouse)
    # measured 15.0–15.3 min — the old 15 cap cancelled TWO docs-only runs at the
    # final Lighthouse step (all quality gates already green; the cap, not the code,
    # was the failure). 20 keeps ~5 min of runner-jitter headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        # S199 (HLTH-12): no bun-version override — setup-bun honors the
        # packageManager pin (bun@1.3.14) so CI and local run the SAME bun.
        # bun.lock is the ONE lockfile (package-lock.json retired this round).

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Security: npm audit gate (fails on any vulnerability).
      # S199 (HLTH-12): package-lock.json retired — bun.lock is the one lockfile.
      # The audit reads a lock npm generates on the fly from package.json (same
      # manifest bun resolves; --ignore-scripts keeps it side-effect-free).
      - name: npm audit (lock generated on the fly)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=high

      # Code quality: eslint (catches unused vars, prefer-const, no-undef, etc.)
      # S199 (HLTH-3): --max-warnings 0 — the 162-warning baseline died this round;
      # warning drift is now structurally impossible (tsconfig noUnusedLocals/
      # noUnusedParameters mirror the same discipline at type level).
      - name: ESLint (0 warnings ratchet)
        run: npx eslint src/ --max-warnings 0

      # Security: XSS escape-lint (S199, SEC-1) — every innerHTML/insertAdjacentHTML
      # template in public/js must interpolate only esc()-wrapped or structurally-safe
      # expressions. The single highest-value security line from the S198 audit.
      - name: Escape-lint (XSS gate)
        run: node scripts/check-escape-lint.mjs

      - name: Build assets
        run: bun run build

      # Bundle-size tracking: fails if /dist/ grows >15% total or >25% per file.
      - name: Bundle-size check
        run: node scripts/check-bundle-size.mjs

      - name: Typecheck
        run: bun run typecheck

      - name: Cache-bust check
        run: node scripts/check-cache-bust.mjs

      - name: i18n parity check
        run: node scripts/check-i18n-parity.mjs

      - name: Unit tests
        run: bun run test

      - name: Smoke test
        run: bun run smoke

      # Dist wiring: validate the DEPLOY artifact shape (wired HTML ↔ manifest
      # consistency). Restore canonical HTML + assert byte-identical.
      - name: Dist wiring check (deploy artifact shape)
        run: |
          node scripts/build.mjs --prod --wire-html
          node scripts/check-dist-wiring.mjs
          node scripts/build.mjs --restore-html
          git diff --exit-code -- public/ || (echo "FAIL: wired build left the canonical HTML modified"; git diff --stat -- public/; exit 1)

      # Workers-runtime smoke test (SWOT W9): runs the Workers entry via wrangler dev
      # (miniflare) + verifies health + login + page render. Catches "works on Node,
      # breaks on Workers" bugs — the PBKDF2 600k bug would have been caught here.
      # Uses LOCAL miniflare D1 (isolated, no remote D1 writes). Needs Cloudflare creds
      # for the wrangler dev runtime (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID).
      - name: Workers-runtime smoke test
        run: npm run test:workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # S199 (UX-10): the portability net is now REAL — required on main pushes,
        # advisory on pull requests (dependabot/fork PR contexts don't receive
        # secrets, so a hard requirement there would be noise, not signal).
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      # E2E + screenshot-diff + a11y (SWOT W5+W6+W7): Playwright against the local
      # Node server. Starts the server on port 3017 with a fresh DB, runs browser
      # tests. Catches "compiles but doesn't work" regressions that unit tests miss.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E + visual regression + a11y tests
        run: npx playwright test
        env:
          CI: true

      # On failure, upload screenshots + traces for debugging.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            e2e/**/*.png
            test-results/
          retention-days: 7

      # Lighthouse CI (SWOT #15): automated performance + a11y + best-practices tracking.
      # Runs Lighthouse against the local Node server (login page — no auth needed).
      # Asserts: a11y ≥ 0.9 (error), performance ≥ 0.8 (warn), best-practices ≥ 0.85 (warn).
      - name: Lighthouse CI
        run: npx @lhci/cli autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
