# Hibana CI — typecheck + unit tests + smoke on every push and pull request.
# H4 fix (2026-09-10): all quality gates were manual; a regression could ship without
# anyone running them. This workflow catches type errors, test failures, and broken
# smoke scenarios before they reach a deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build assets
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Cache-bust check
        run: node scripts/check-cache-bust.mjs

      - name: i18n parity check
        run: node scripts/check-i18n-parity.mjs

      - name: Unit tests
        run: bun run test

      - name: Smoke test
        run: bun run smoke

      # Dist wiring: validate the DEPLOY artifact shape (wired HTML ↔ manifest
      # consistency). Restore canonical HTML + assert byte-identical.
      - name: Dist wiring check (deploy artifact shape)
        run: |
          node scripts/build.mjs --prod --wire-html
          node scripts/check-dist-wiring.mjs
          node scripts/build.mjs --restore-html
          git diff --exit-code -- public/ || (echo "FAIL: wired build left the canonical HTML modified"; git diff --stat -- public/; exit 1)

      # Workers-runtime smoke test (SWOT W9): runs the Workers entry via wrangler dev
      # (miniflare) + verifies health + login + page render. Catches "works on Node,
      # breaks on Workers" bugs — the PBKDF2 600k bug would have been caught here.
      # Uses LOCAL miniflare D1 (isolated, no remote D1 writes). Needs Cloudflare creds
      # for the wrangler dev runtime (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID).
      - name: Workers-runtime smoke test
        run: npm run test:workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true # TODO: make this required once CF secrets are added to GitHub

      # E2E + screenshot-diff + a11y (SWOT W5+W6+W7): Playwright against the local
      # Node server. Starts the server on port 3017 with a fresh DB, runs browser
      # tests. Catches "compiles but doesn't work" regressions that unit tests miss.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E + visual regression + a11y tests
        run: npx playwright test
        env:
          CI: true

      # On failure, upload screenshots + traces for debugging.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            e2e/**/*.png
            test-results/
          retention-days: 7
