# Hibana CI — typecheck + unit tests + smoke on every push and pull request.
# H4 fix (2026-09-10): all quality gates were manual; a regression could ship without
# anyone running them. This workflow catches type errors, test failures, and broken
# smoke scenarios before they reach a deploy.
#
# S200 (PERF-1/UX-8): the e2e suite moved to a PARALLEL 2-shard matrix job — the
# single-job ladder rode the 20-min cap's throat (414 tests at ~15-19 min single-
# worker, +7 tests/release at the Oct cadence; the S181 cap failure mode was
# minutes away). Now: the `ci` job (lint → build → unit → smoke, ~6-8 min) and
# the `e2e` shards (~5-7 min each) run CONCURRENTLY on separate runners; the
# workflow only reports green when every job is green, and CD (workflow_run-gated
# on THIS workflow's completion) still fires only on all-jobs-green.
# S200 (UX-9): docs-only pushes (`*.md`, `scripts/rotate/**`) skip CI entirely —
# they change no shipped asset, and CD is workflow_run-gated so they simply don't
# deploy (the next code push carries the docs live). PRs always run everything.
# S204 (the dependabot round): actions/checkout v4→v7 + actions/upload-artifact
# v4→v7 (dependabot PRs #1/#6 superseded by the in-session bump — the PRs also
# carried retired package-lock.json patches, retired since S199's bun.lock-only
# doctrine). Basic usage only (name/path/retention-days) — the stable API since v4.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'scripts/rotate/**'
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # The fast lane (everything except e2e) measured ~6-8 min post-split; the
    # e2e shards run in parallel, so the workflow's wall time is the slower of
    # the two, not their sum. 20 keeps generous headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # S199 (HLTH-12): no bun-version override — setup-bun honors the
        # packageManager pin (bun@1.3.14) so CI and local run the SAME bun.
        # bun.lock is the ONE lockfile (package-lock.json retired this round).

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Security: npm audit gate (fails on any vulnerability).
      # S199 (HLTH-12): package-lock.json retired — bun.lock is the one lockfile.
      # The audit reads a lock npm generates on the fly from package.json (same
      # manifest bun resolves; --ignore-scripts keeps it side-effect-free).
      - name: npm audit (lock generated on the fly)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=high

      # Autopilot Phase 0 (PLAYBOOK §5): ONE command — `npm run verify` — runs the full
      # local gate ladder (typecheck + eslint 0-warning ratchet + vitest + build +
      # portability check). The steps it replaced (eslint / build / typecheck / unit
      # tests, run as four separate CI steps) are now exactly what verify runs, in the
      # same order, so local and CI can never drift apart. The repo-specific gates that
      # follow (escape-lint, bundle/precache budgets, cache-bust, i18n parity, smoke,
      # dist-wiring, workers smoke, Lighthouse) stay as explicit CI steps.
      - name: Verify (typecheck + lint + unit tests + build + portability)
        run: bun run verify

      # Security: XSS escape-lint (S199, SEC-1) — every innerHTML/insertAdjacentHTML
      # template in public/js must interpolate only esc()-wrapped or structurally-safe
      # expressions. The single highest-value security line from the S198 audit.
      - name: Escape-lint (XSS gate)
        run: node scripts/check-escape-lint.mjs

      # Bundle-size tracking: fails if /dist/ grows >15% total or >25% per file.
      # S200 (PERF-4): per-file compare keyed on LOGICAL manifest names — hashed
      # filenames used to make the guard structurally dead (a re-hash = "new file").
      # (verify already built /dist — the sizes below read that output.)
      - name: Bundle-size check
        run: node scripts/check-bundle-size.mjs

      # S200 (PERF-5): SW precache budget — SHELL + manifest raw bytes vs a hard
      # ceiling (ratchets DOWN on deliberate shrinks, like the eslint warning one).
      - name: Precache-size check
        run: node scripts/check-precache-size.mjs

      - name: Cache-bust check
        run: node scripts/check-cache-bust.mjs

      - name: i18n parity check
        run: node scripts/check-i18n-parity.mjs

      - name: Smoke test
        run: bun run smoke

      # Dist wiring: validate the DEPLOY artifact shape (wired HTML ↔ manifest
      # consistency). Restore canonical HTML + assert byte-identical.
      - name: Dist wiring check (deploy artifact shape)
        run: |
          node scripts/build.mjs --prod --wire-html
          node scripts/check-dist-wiring.mjs
          node scripts/build.mjs --restore-html
          git diff --exit-code -- public/ || (echo "FAIL: wired build left the canonical HTML modified"; git diff --stat -- public/; exit 1)

      # Workers-runtime smoke test (SWOT W9): runs the Workers entry via wrangler dev
      # (miniflare) + verifies health + login + page render. Catches "works on Node,
      # breaks on Workers" bugs — the PBKDF2 600k bug would have been caught here.
      # Uses LOCAL miniflare D1 (isolated, no remote D1 writes). Needs Cloudflare creds
      # for the wrangler dev runtime (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID).
      - name: Workers-runtime smoke test
        run: npm run test:workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # S199 (UX-10): the portability net is now REAL — required on main pushes,
        # advisory on pull requests (dependabot/fork PR contexts don't receive
        # secrets, so a hard requirement there would be noise, not signal).
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      # Lighthouse CI (SWOT #15): automated performance + a11y + best-practices tracking.
      # Runs Lighthouse against its own local Node server (login page — no auth needed).
      # S199: perf + best-practices are ERROR floors at 0.9 (a11y 0.9; seo warn 0.82).
      - name: Lighthouse CI (desktop preset)
        run: npx @lhci/cli autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # S204 (UX-17): the MOBILE lane — the app's real usage is heavily mobile, and the
      # desktop-only preset was the S198 audit's gap. Same pages; formFactor=mobile
      # (Moto G emulation + 4x CPU + slow-4G Lantern simulation), 3 runs for medians.
      # HONEST FLOORS, measured 2026-10-11: cold login 89-90 perf; the dashboard URL
      # redirects to login?next= WITH THE SERVICE WORKER ACTIVE (the real returning-
      # user state) and Lantern simulates SW-served responses pessimistically → 46-49.
      # The 0.45 perf floor binds on that SW-active variant — it exists to catch mobile
      # COLLAPSE, not to claim returning users see 49 (they get instant cache hits).
      # a11y 100 / bp 96 / seo 82 measured on both variants; floors 0.9/0.9/warn-0.8.
      - name: Lighthouse CI (mobile preset, UX-17)
        run: npx @lhci/cli autorun --config=lighthouserc.mobile.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # S200 (PERF-1): the e2e lane — 2 shards on separate runners, in PARALLEL with
  # the ci job above (no `needs:` — the whole point is wall time). Each shard
  # boots its OWN webServer (playwright config) against its OWN runner's
  # /tmp/hibana-e2e.db; --shard i/2 splits the suite by test file. The 417-test
  # suite that rode ~15-19 min single-worker now aims ~5-7 min per shard.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # let both shards finish — the other shard's failures are
      # signal too, and a cap/infra flake in one shard shouldn't hide the other's
      # results.
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # S200 (PERF-1): cache the Playwright browser download (~115 MB) keyed on
      # the lockfile (playwright's version lives there) — saves the download on
      # every run; `install` becomes a fast no-op on cache hit (system deps via
      # --with-deps still apt-install, ~30s, they can't be cached).
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            pw-chromium-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E + visual regression + a11y tests (shard ${{ matrix.shard }}/2)
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: true

      # On failure, upload screenshots + traces for debugging (per shard).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            e2e/**/*.png
            test-results/
          retention-days: 7
