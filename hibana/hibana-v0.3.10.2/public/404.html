<!doctype html>
<html lang="en"><!-- P4.12 (F-L25): was lang="fa" dir="rtl" hardcoded; i18n.js sets dir/lang post-load -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صفحه پیدا نشد — Hibana</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <!-- Pre-paint theme restore — the same three lines app.js runs on every other page,
       so this standalone page honors the saved light/dark choice (hibana-theme). -->
  <script>
    try { const t = localStorage.getItem('hibana-theme'); if (t) document.documentElement.dataset.theme = t } catch {}
  </script>
  <link rel="stylesheet" href="/css/variables.css?v=1">
  <link rel="stylesheet" href="/css/base.css?v=1">
  <link rel="stylesheet" href="/css/layout.css?v=1">
  <link rel="stylesheet" href="/css/dashboard.css?v=1">
  <link rel="stylesheet" href="/css/dashboard-todo.css?v=1">
  <link rel="stylesheet" href="/css/components.css?v=1">
  <link rel="stylesheet" href="/css/canvas.css?v=1">
  <link rel="stylesheet" href="/css/quicknotes.css?v=1">
  <link rel="stylesheet" href="/css/to-do-list.css?v=1">
  <link rel="stylesheet" href="/css/polish-ui.css?v=1">
  <link rel="stylesheet" href="/css/calendar.css?v=1">
  <link rel="stylesheet" href="/css/notifications.css?v=1">
  <link rel="stylesheet" href="/css/polish-batch.css?v=1">
  <link rel="stylesheet" href="/css/project-header.css?v=1">
  <link rel="stylesheet" href="/css/devboard.css?v=1">
  <link rel="stylesheet" href="/css/misc.css?v=1">
  <link rel="stylesheet" href="/css/themes.css?v=1">
  <link rel="stylesheet" href="/css/rtl.css?v=1">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
  <script src="/js/i18n-en.js?v=1" defer></script>
  <script src="/js/i18n-fa.js?v=1" defer></script>
  <script src="/js/i18n.js?v=56" defer></script>
</head>
<body class="nf-page">

  <button class="theme-floater" type="button" onclick="window.hibana?.toggleTheme()"
          title="تغییر پوسته (روشن/تیره)" aria-label="تغییر پوسته (روشن/تیره)"
          data-i18n-title="nav.themeHint" data-i18n-aria-label="nav.themeHint">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <main id="main" tabindex="-1" class="nf-card">
    <!-- Wordmark: .brand-logo (existing class) supplies the theme-aware swap
         (content: var(--brand-logo) → logo-light.png / logo-dark.png);
         .nf-logo only sizes it up from the header's 1.4rem. -->
    <img class="brand-logo nf-logo" src="/logo-light.png" alt="Hibana">

    <!-- 404 stage: numeral + pure-CSS embers over a warm spark halo. -->
    <div class="nf-stage">
      <span class="nf-embers" aria-hidden="true"><i class="nf-ember"></i><i class="nf-ember"></i><i class="nf-ember"></i><i class="nf-ember"></i><i class="nf-ember"></i><i class="nf-ember"></i></span>
      <p class="nf-code">4<span class="nf-zero">0</span>4</p>
    </div>

    <!-- aria-live: i18n.js rewrites these nodes once the dictionary resolves, so
         assistive tech re-announces the headline in the user's language. -->
    <div class="nf-copy" aria-live="polite">
      <h1 class="nf-heading" data-i18n="nf.heading">این صفحه پیدا نشد</h1>
      <p class="nf-sub" data-i18n="nf.sub">شاید پیوند قدیمی باشد یا صفحه جابه‌جا شده — ایده‌هایت سالم‌اند.</p>
    </div>

    <div class="nf-actions">
      <a class="nf-cta" href="/app">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"/></svg>
        <span data-i18n="nf.cta">داشبورد</span>
      </a>
      <button class="ghost nf-back" type="button" id="nf-back">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        <span data-i18n="nf.back">بازگشت</span>
      </button>
    </div>
  </main>

  <script>
    // Back button + a standalone theme-floater fallback (login.html keeps no app.js
    // either — this page owns its own minimal runtime).
    ;(function () {
      var back = document.getElementById('nf-back')
      if (back) back.addEventListener('click', function () {
        if (history.length > 1) history.back()   // somewhere to go → back
        else location.href = '/app'              // fresh tab → land on the dashboard
      })
      if (window.hibana) return
      var SUN = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      var MOON = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>'
      var floater = document.querySelector('.theme-floater')
      function current() {
        var saved = null
        try { saved = localStorage.getItem('hibana-theme') } catch (e) {}
        if (saved === 'light') return 'light'
        if (saved === 'dark') return 'dark'
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      function paint() { if (floater) floater.innerHTML = current() === 'dark' ? MOON : SUN }
      window.hibana = {
        toggleTheme: function () {
          var next = current() === 'dark' ? 'light' : 'dark'
          document.documentElement.dataset.theme = next
          try { localStorage.setItem('hibana-theme', next) } catch (e) {}
          paint()
          return next
        }
      }
      paint()
    })()
  </script>
</body>
</html>
