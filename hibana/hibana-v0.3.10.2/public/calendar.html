<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar — Hibana</title>
  <link rel="stylesheet" href="/css/app.css?v=256">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
  <script src="/vendor/htmx.min.js" defer></script>
  <script src="/js/boot.js?v=4"></script>
  <script src="/vendor/alpine.min.js" defer></script>
  <script src="/js/queue.js?v=2" defer></script>
  <script src="/js/app.js?v=168" defer></script>
  <script src="/js/touch-drag.js?v=1" defer></script>
  <script src="/vendor/jalaali.min.js" defer></script>
  <script src="/js/jalali-holidays.js?v=1" defer></script>
  <script src="/js/i18n.js?v=52" defer></script>
  <script src="/js/nav.js?v=1" defer></script>
  <script src="/js/command-palette.js?v=1" defer></script>
  <script src="/js/mobile-nav.js?v=4" defer></script>
  <script src="/js/zen-mode.js?v=1" defer></script>
  <script src="/js/micro-interactions.js?v=1" defer></script>
  <script src="/js/go-to.js?v=1" defer></script>

</head>
<body>
  <a href="#main" class="skip-link" data-i18n="a11y.skipToMain">Skip to main content</a>
  <div data-nav></div>
  <main class="shell" id="main" tabindex="-1">
    <!-- Task 24 #3: the heading IS the displayed month (e.g. «مهر ۱۴۰۵» / “October 2026”) —
         the redundant month label between the arrows is gone. -->
    <div class="row spread cal-head">
      <div class="row cal-title-nav">
        <button class="ghost" id="cal-prev" aria-label="Previous month" data-i18n-aria-label="calendar.prevMonth"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h1 id="cal-title" class="cal-title"></h1>
        <button class="ghost" id="cal-next" aria-label="Next month" data-i18n-aria-label="calendar.nextMonth"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="row cal-controls">
        <!-- Task 24 #4: Jalali ⇄ Gregorian switch (e.g. booking a hotel that runs on the
             international calendar). Persisted per browser; default follows the language. -->
        <div class="cal-sys" role="group" aria-label="Calendar system" data-i18n-aria-label="calendar.sysLabel">
          <button type="button" data-cal-sys="jalali" data-i18n="calendar.jalali">Jalali</button>
          <button type="button" data-cal-sys="gregorian" data-i18n="calendar.gregorian">Gregorian</button>
        </div>
        <button class="ghost" id="cal-today" data-i18n="calendar.today">Today</button>
        <!-- 22-a #7 + Task 24 #1: «هفته بعد»/«ماه بعد» jump to THE EXACT DAY — next week =
             same weekday +7d; next month = the same day number in the next month
             (7 شهریور → 7 مهر, clamped to the month length). The target day is
             highlighted and its detail panel opens, so the jump is always visible. -->
        <button class="ghost" id="cal-next-week" data-i18n="calendar.nextWeek">Next week</button>
        <button class="ghost" id="cal-next-month" data-i18n="calendar.nextMonth">Next month</button>
        <!-- Session 19 (cron round 1): one-way ICS export of everything dated in the next
             6 months. Plain <a download> — same pattern as the Settings export buttons. -->
        <a class="ghost" href="/api/export/calendar.ics" download data-i18n="calendar.exportIcs">Export .ics</a>
      </div>
    </div>

    <div id="cal-grid" class="cal-grid"></div>

    <!-- R9.3 legend — Task 24 #5: the four kind dots are DRAGGABLE. Drop one on any day
         to open that day's panel with the matching creator (a new way to define a
         project / task / to-do / note straight on the date). -->
    <div class="cal-legend muted small">
      <span class="cal-legend-item cal-drag" draggable="true" data-legend-kind="project"><span class="cal-dot cal-dot-project"></span> <span data-i18n="calendar.project">Project</span></span>
      <span class="cal-legend-item cal-drag" draggable="true" data-legend-kind="task"><span class="cal-dot cal-dot-task"></span> <span data-i18n="calendar.task">Task</span></span>
      <span class="cal-legend-item cal-drag" draggable="true" data-legend-kind="sadhana"><span class="cal-dot cal-dot-sadhana"></span> <span data-i18n="calendar.sadhana">To-do</span></span>
      <span class="cal-legend-item cal-drag" draggable="true" data-legend-kind="note"><span class="cal-dot cal-dot-note"></span> <span data-i18n="calendar.legendNote">Note</span></span>
      <span class="cal-legend-item"><span class="cal-weekend-swatch"></span> <span id="cal-weekend-legend" data-i18n="calendar.weekendLegend">Weekend (Fridays)</span></span>
      <span class="cal-legend-item"><span class="cal-holiday-swatch"></span> <span data-i18n="calendar.holiday">Holiday / تعطیل</span></span>
      <span class="cal-legend-hint" data-i18n="calendar.dragHint">Drag a dot onto a day to plan it there</span>
    </div>

    <div id="cal-day-detail" class="cal-day-detail" hidden>
      <h3 id="cal-day-title"></h3>
      <ul id="cal-day-list" class="cal-day-list"></ul>

      <!-- Day creators (user request 2026-08-30): clicking a day offers three ways to plan
           it — a colored sticky note for the date, a task in one of the quadrants (with this
           day as its deadline), or a plain note for the day.
           Task 24 #5 adds two more composers, opened by dropping a legend dot:
           a whole PROJECT due that day, and a client-project TASK due that day. -->
      <div class="row wrap cal-day-actions">
        <button type="button" class="ghost small" id="cal-add-sticky"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5V14l-6 6H5.5A1.5 1.5 0 0 1 4 18.5Z"/><path d="M14 20v-4.5A1.5 1.5 0 0 1 15.5 14H20"/></svg> <span data-i18n="calendar.addSticky">Sticky note</span></button>
        <button type="button" class="ghost small" id="cal-add-task"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> <span data-i18n="calendar.addTaskBtn">Task</span></button>
        <button type="button" class="ghost small" id="cal-add-note"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg> <span data-i18n="calendar.addNote">Note</span></button>
        <span class="grow"></span>
        <button type="button" class="ghost small" id="cal-day-close" data-i18n="calendar.close">Close</button>
      </div>
      <form id="cal-sticky-form" class="cal-composer" hidden>
        <textarea id="cal-sticky-text" rows="2" maxlength="2000" data-i18n-placeholder="calendar.stickyPh" placeholder="Sticky for this day…"></textarea>
        <div class="row spread cal-composer-row">
          <span class="cal-colors row" role="radiogroup" aria-label="Sticky color" data-i18n-aria-label="calendar.stickyColor" id="cal-sticky-colors"></span>
          <button type="submit" class="small" data-i18n="calendar.saveSticky">Add sticky</button>
        </div>
      </form>
      <form id="cal-task-form" class="cal-composer" hidden>
        <input type="text" id="cal-task-title" maxlength="255" data-i18n-placeholder="calendar.taskPh" placeholder="Task title…">
        <div class="row wrap cal-composer-row">
          <select id="cal-task-quad" aria-label="Quadrant" data-i18n-aria-label="calendar.quadrant"></select>
          <button type="submit" class="small" data-i18n="calendar.saveTask">Add task</button>
        </div>
      </form>
      <form id="cal-note-form" class="cal-composer" hidden>
        <textarea id="cal-note-text" rows="3" maxlength="20000" data-i18n-placeholder="calendar.notePh" placeholder="A note for this day…"></textarea>
        <div class="row end cal-composer-row">
          <button type="submit" class="small" data-i18n="calendar.saveNote">Add note</button>
        </div>
      </form>
      <!-- Task 24 #5: legend-drop composers — a project due this day / a client-project
           task due this day. -->
      <form id="cal-project-form" class="cal-composer" hidden>
        <input type="text" id="cal-project-title" maxlength="200" data-i18n-placeholder="calendar.projectPh" placeholder="Project title…">
        <div class="row wrap cal-composer-row">
          <select id="cal-project-status" aria-label="Stage" data-i18n-aria-label="calendar.stage"></select>
          <button type="submit" class="small" data-i18n="calendar.saveProject">Add project</button>
        </div>
      </form>
      <form id="cal-ctask-form" class="cal-composer" hidden>
        <input type="text" id="cal-ctask-title" maxlength="300" data-i18n-placeholder="calendar.taskPh" placeholder="Task title…">
        <div class="row wrap cal-composer-row">
          <select id="cal-ctask-project" aria-label="Project" data-i18n-aria-label="calendar.project"></select>
          <button type="submit" class="small" data-i18n="calendar.saveTask">Add task</button>
        </div>
      </form>
      <p class="error small" id="cal-add-error" role="alert" hidden></p>
    </div>
  </main>

  <script>
    window.__hibanaPage = window.__hibanaPage || ((d) => (window.__hibanaPageQueue = window.__hibanaPageQueue || []).push(d))
    window.__hibanaPage({
      name: 'calendar',
      mount(ctx) {
        const _t = (k, f) => window.hibanaI18n?.t(k) || f

        // ---- Calendar-system selection (B4.5 + Task 24 #4): fa → Jalali (default), en →
        // Gregorian — PLUS a manual شمسی/میلادی switch persisted in localStorage, so a
        // Persian user can flip to the international calendar (hotel bookings etc.).
        // calSys: null = follow language ('auto'), 'jalali', 'gregorian' = pinned.
        // The backend is Gregorian-only (due_date is 'YYYY-MM-DD' Gregorian); the client
        // converts the displayed month to a Gregorian [start, end] range and maps each
        // grid cell's Gregorian date back to the byDay lookup.
        let lang = (window.hibanaI18n?.lang?.() || 'en')
        let calSys = null
        try { const s = localStorage.getItem('hibana.calSys'); if (s === 'jalali' || s === 'gregorian') calSys = s } catch { /* private mode */ }
        const computeJalali = () => (calSys === 'jalali' ? true : calSys === 'gregorian' ? false : lang === 'fa')
        let isJalali = computeJalali()

        // R9 FIX: Inline the Jalali conversion math (pure math, ~60 lines) instead of
        // relying on the vendor jalaali.min.js loading via `defer`. The old code had a
        // race condition — if jalaali hadn't loaded when the calendar initialized, the
        // identity fallback turned August (Gregorian month 8) into Jalali month 8 (Aban)
        // instead of the correct Shahrivar (month 6). Inlining eliminates this entirely.
        // Algorithm: the standard jalaali-js (MIT), same as src/lib/jalali.ts.
        const _BREAKS = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178]
        const _div = (a, b) => ~~(a / b)
        const _mod = (a, b) => a - ~~(a / b) * b
        function _jalCal(jy) {
          const bl = _BREAKS.length
          const gy = jy + 621
          let leapJ = -14, jp = _BREAKS[0], jm = 0, jump = 0
          for (let i = 1; i < bl; i++) { jm = _BREAKS[i]; jump = jm - jp; if (jy < jm) break; leapJ += _div(jump, 33) * 8 + _div(_mod(jump, 33), 4); jp = jm }
          let n = jy - jp
          leapJ += _div(n, 33) * 8 + _div(_mod(n, 33) + 3, 4)
          if (_mod(jump, 33) === 4 && jump - n === 4) leapJ += 1
          const leapG = _div(gy, 4) - _div((_div(gy, 100) + 1) * 3, 4) - 150
          const march = 20 + leapJ - leapG
          if (jump - n < 6) n = n - jump + _div(jump + 4, 33) * 33
          let leap = _mod(_mod(n + 1, 33) - 1, 4)
          if (leap === -1) leap = 4
          return { leap, gy, march }
        }
        function _g2d(gy, gm, gd) {
          let d = _div((gy + _div(gm - 8, 6) + 100100) * 1461, 4) + _div(153 * _mod(gm + 9, 12) + 2, 5) + gd - 34840408
          d = d - _div(_div(gy + 100100 + _div(gm - 8, 6), 100) * 3, 4) + 752
          return d
        }
        function _d2g(jdn) {
          let j = 4 * jdn + 139361631
          j = j + _div(_div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908
          const i = _div(_mod(j, 1461), 4) * 5 + 308
          // 22-a #1 BUG FIX: the gy term used to read `_div(8 - _mod(_div(i, 153), 12) + 1, 6)`
          // (= div(10 − gm, 6)), one step off from the canonical jalaali-js `div(8 - gm, 6)`.
          // Only Gregorian March/April sit on the wrong side of the floor-division boundary,
          // so EVERY Jalali→Gregorian conversion landing in Mar/Apr came back a FULL YEAR
          // LATE (toG(1405,1,1) → 2027-03-21 instead of 2026-03-21). Verified against
          // vendor jalaali over 2024–2031 after the fix (0 mismatches).
          return { gy: _div(j, 1461) - 100100 + _div(7 - _mod(_div(i, 153), 12), 6), gm: _mod(_div(i, 153), 12) + 1, gd: _div(_mod(i, 153), 5) + 1 }
        }
        function _d2j(jdn) {
          let gy = _d2g(jdn).gy, jy = gy - 621
          const r = _jalCal(jy), jdn1f = _g2d(gy, 3, r.march)
          let k = jdn - jdn1f
          if (k >= 0) { if (k <= 185) return { jy, jm: 1 + _div(k, 31), jd: _mod(k, 31) + 1 }; k -= 186 }
          else { jy -= 1; k += 179; if (r.leap === 1) k += 1 }
          return { jy, jm: 7 + _div(k, 30), jd: _mod(k, 30) + 1 }
        }
        function _j2d(jy, jm, jd) { const r = _jalCal(jy); return _g2d(r.gy, 3, r.march) + (jm - 1) * 31 - _div(jm, 7) * (jm - 7) + jd - 1 }
        // Public API — same signature as the vendor lib.
        const toJ = (gy, gm, gd) => _d2j(_g2d(gy, gm, gd))
        const toG = (jy, jm, jd) => _d2g(_j2d(jy, jm, jd))
        const faDig = (s) => String(s).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[Number(d)])
        const pad = (n) => String(n).padStart(2, '0')

        // ISO ↔ local Date helpers (Task 24): selISO is the FOCUSED day — navigation jumps
        // chain from it, day clicks set it, and its cell wears the .selected ring.
        const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
        const fromISO = (s) => new Date(Number(s.slice(0, 4)), Number(s.slice(5, 7)) - 1, Number(s.slice(8, 10)))
        // F10 (session 9): "now" in the PROFILE timezone, not the browser's — the
        // dashboard computes today server-side via todayIn(user.timezone), so a
        // browser-TZ ≠ profile-TZ user saw the dashboard a day ahead of/behind the
        // calendar (audit: ۱۷ شهریور vs ۱۶). hibanaI18n.tz() resolves after /me;
        // before that (and on any bad tz id) we fall back to browser-local, and
        // repaintAfterI18n re-targets once the profile TZ lands.
        const nowInTz = () => {
          const tz = window.hibanaI18n?.tz?.()
          if (tz) {
            try {
              // 'en-CA' + these options formats as YYYY-MM-DD
              const s = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date())
              const [y, m, d] = s.split('-').map(Number)
              if (y > 0 && m > 0 && d > 0) return { y, m, d }
            } catch { /* invalid tz id → browser-local fallback below */ }
          }
          const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() + 1, d: n.getDate() }
        }
        const todayISO = () => { const { y, m, d } = nowInTz(); return `${y}-${pad(m)}-${pad(d)}` }
        let selISO = todayISO()
        const bootTodayISO = selISO // F10: still-on-today detector for the post-i18n re-target

        // ---- Day creators (user request 2026-08-30) ---------------------------------
        // The sticky palette mirrors quicknotes.ts NOTE_COLOR_HEX so calendar chips and
        // notebook cards render the identical pastel for the same stored color name.
        const STICKY_COLORS = { yellow: '#FFF59D', green: '#BBF7D0', pink: '#FBCFE8', blue: '#BFDBFE' }
        // Pin dots use the same hues one step SATURATED (2026-08-29 user request): the
        // pale chip pastels are near-invisible as 14px dots on the near-white calendar.
        const STICKY_DOT_COLORS = { yellow: '#E8C33E', green: '#6EC98B', pink: '#EF9BC8', blue: '#8AB8F0' }
        let stickyColor = 'yellow'
        let curDay = null              // { date, items } — the open day panel
        let lastByDay = {}             // latest month payload, so a create can reopen the day
        let lastFlags = new Map()      // ISO → { name, nameEn } real holidays (no plain Fridays)
        let quadsCache = null          // quadrant picker data in the active language
        let projectsCache = null       // project picker data (client-task composer)

        // Gregorian month names (en) + Jalali month names (fa) — mirrors src/lib/jalali.ts.
        const G_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December']
        const J_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند']
        // Weekday headers. Gregorian: Sun-first (0=Sun..6=Sat). Jalali: Sat-first (Persian week).
        const DOW_G = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
        const DOW_J = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'] // Sat-first
        const WD_FA = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'] // by getDay (0=Sun)
        const WD_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
        const PROJECT_STATUSES = ['spark', 'unreviewed', 'investigating', 'awaiting', 'doing', 'halted', 'operational'] // batch q lifecycle

        // 22-a #1 (display-layer rule): EVERY user-visible date string on this page is
        // formatted through dateLabel — following the ACTIVE calendar system (which the
        // user can now pin via the switch): Jalali month name + Persian digits when
        // Jalali, Gregorian otherwise. Storage and the API stay ISO 'YYYY-MM-DD'
        // (Gregorian) untouched; conversion happens only at the render edge.
        function dateLabel(iso) {
          const gy = Number(iso.slice(0, 4)), gm = Number(iso.slice(5, 7)), gd = Number(iso.slice(8, 10))
          if (isJalali) {
            const j = toJ(gy, gm, gd)
            return `${faDig(j.jd)} ${J_MONTHS[j.jm - 1]} ${faDig(j.jy)}`
          }
          return `${gd} ${G_MONTHS[gm - 1].slice(0, 3)} ${gy}`
        }
        const escAttr = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
        const holLabel = (hol) => (lang === 'fa' ? hol.name : (hol.nameEn || hol.name))

        // Weekend convention follows the calendar SYSTEM (Task 24 #4): Jalali week →
        // جمعه (Friday); Gregorian week → Saturday + Sunday (international).
        const isWeekendDow = (dow) => (isJalali ? dow === 5 : dow === 0 || dow === 6)

        // Real holidays (نوروز، عاشورا، …) come from jalali-holidays.js and stay visible
        // in BOTH modes — a Persian user flipped to Gregorian still has those days off.
        // Built as an ISO-keyed map over the displayed range: walk the range (UTC math —
        // no DST drift), convert each day to Jalali, look it up in that Jalali month's
        // table (cached per month). Plain «جمعه تعطیل» entries are dropped — weekend
        // striping is computed from the weekday per mode instead.
        function flagsMap(startISO, endISO) {
          const out = new Map()
          if (!window.hibanaJalaliHolidays) return out
          const byMonth = new Map()
          for (let t = Date.parse(startISO); t <= Date.parse(endISO); t += 86400000) {
            const D = new Date(t)
            const j = toJ(D.getUTCFullYear(), D.getUTCMonth() + 1, D.getUTCDate())
            const key = `${j.jy}-${j.jm}`
            if (!byMonth.has(key)) byMonth.set(key, window.hibanaJalaliHolidays.getHolidays(j.jy, j.jm))
            const hol = byMonth.get(key).get(j.jd)
            if (hol && !(hol.type === 'holiday' && hol.name === 'جمعه تعطیل')) out.set(D.toISOString().slice(0, 10), hol)
          }
          return out
        }

        // Current "display month" cursor — always (year, month) in the ACTIVE calendar
        // system (Gregorian or Jalali), 1-based month. Derived from the focused day so
        // the switch/mode changes keep the view anchored on the same real date.
        let curYear, curMonth
        function cursorFromDate(iso) {
          const gy = Number(iso.slice(0, 4)), gm = Number(iso.slice(5, 7)), gd = Number(iso.slice(8, 10))
          if (isJalali) { const j = toJ(gy, gm, gd); curYear = j.jy; curMonth = j.jm }
          else { curYear = gy; curMonth = gm }
        }
        cursorFromDate(selISO)

        // Compute the Gregorian [start, end] range for the current display month.
        function monthRange(year, month) {
          let firstG, lastG
          if (isJalali) {
            // First day of the Jalali month → Gregorian.
            firstG = toG(year, month, 1)
            // First day of the NEXT Jalali month → Gregorian; last day = the day before.
            const nj = month === 12 ? { jy: year + 1, jm: 1 } : { jy: year, jm: month + 1 }
            const nextFirstG = toG(nj.jy, nj.jm, 1)
            const lastMs = Date.UTC(nextFirstG.gy, nextFirstG.gm - 1, nextFirstG.gd) - 86400000
            const lastD = new Date(lastMs)
            lastG = { gy: lastD.getUTCFullYear(), gm: lastD.getUTCMonth() + 1, gd: lastD.getUTCDate() }
          } else {
            firstG = { gy: year, gm: month, gd: 1 }
            const lastDay = new Date(year, month, 0).getDate()
            lastG = { gy: year, gm: month, gd: lastDay }
          }
          return {
            start: `${firstG.gy}-${pad(firstG.gm)}-${pad(firstG.gd)}`,
            end: `${lastG.gy}-${pad(lastG.gm)}-${pad(lastG.gd)}`,
            firstG, lastG,
          }
        }

        // Number of days in the current display month + the weekday of day 1 (0=Sun..6=Sat).
        function monthMeta(year, month) {
          if (isJalali) {
            const firstG = toG(year, month, 1)
            const firstDow = new Date(Date.UTC(firstG.gy, firstG.gm - 1, firstG.gd)).getUTCDay()
            // Robust: count days via the Gregorian span.
            const r = monthRange(year, month)
            const days = Math.round((Date.UTC(r.lastG.gy, r.lastG.gm - 1, r.lastG.gd) - Date.UTC(r.firstG.gy, r.firstG.gm - 1, r.firstG.gd)) / 86400000) + 1
            return { firstDow, days }
          }
          const firstDow = new Date(year, month - 1, 1).getDay()
          const days = new Date(year, month, 0).getDate()
          return { firstDow, days }
        }

        // Convert a grid day number (1..days) to its Gregorian 'YYYY-MM-DD' (the byDay key).
        function dayToDate(year, month, day) {
          if (isJalali) {
            const g = toG(year, month, day)
            return `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`
          }
          return `${year}-${pad(month)}-${pad(day)}`
        }

        // Is the given (year, month, day) today, in the active calendar?
        function isToday(year, month, day) {
          const n = nowInTz() // F10: profile TZ — same "now" as todayISO/selISO
          if (isJalali) {
            const j = toJ(n.y, n.m, n.d)
            return j.jy === year && j.jm === month && j.jd === day
          }
          return n.y === year && n.m === month && n.d === day
        }

        // Empty cells before day 1, based on the week start convention.
        // Gregorian: Sun-first → leading = firstDow.
        // Jalali: Sat-first → leading = (firstDow + 1) % 7  (Sat→0, Sun→1, … Fri→6).
        function leadingEmpties(firstDow) {
          return isJalali ? (firstDow + 1) % 7 : firstDow
        }

        // Selected-day ring (Task 24 #1): exactly one .selected cell — the focused day.
        function markSelected() {
          const grid = document.getElementById('cal-grid')
          if (!grid) return
          grid.querySelectorAll('.cal-cell.selected').forEach((c) => c.classList.remove('selected'))
          grid.querySelector(`.cal-cell[data-date="${selISO}"]`)?.classList.add('selected')
        }

        async function loadCurrent() {
          const grid = document.getElementById('cal-grid')
          const title = document.getElementById('cal-title')
          if (!grid) return
          // RTL grid for Jalali (Persian week flows right-to-left: شنبه on the right).
          grid.dir = isJalali ? 'rtl' : 'ltr'
          // Task 24 #3: the page heading IS the month — «مهر ۱۴۰۵» / “October 2026”.
          if (title) {
            title.textContent = isJalali ? `${J_MONTHS[curMonth - 1]} ${faDig(curYear)}` : `${G_MONTHS[curMonth - 1]} ${curYear}`
            title.dir = isJalali ? 'rtl' : 'ltr'
          }
          // Weekend legend follows the active system (Friday vs Sat+Sun).
          const wl = document.getElementById('cal-weekend-legend')
          if (wl) wl.textContent = _t(isJalali ? 'calendar.weekendLegend' : 'calendar.weekendLegendG', isJalali ? 'Weekend (Fridays)' : 'Weekend (Sat & Sun)')
          // Weekday header row (weekend columns muted-red like the جمعه header was).
          const dow = isJalali ? DOW_J : DOW_G
          grid.innerHTML = dow.map((d, i) => {
            const wk = isJalali ? i === 6 : i === 0 || i === 6
            return `<div class="cal-dow${wk ? ' cal-dow-weekend' : ''}">${d}</div>`
          }).join('')
          grid.classList.add('loading')
          try {
            const r = monthRange(curYear, curMonth)
            const res = await fetch(`/api/calendar?start=${r.start}&end=${r.end}`)
            const data = res.ok ? await res.json() : { byDay: {} }
            grid.classList.remove('loading')
            lastByDay = data.byDay || {}
            lastFlags = flagsMap(r.start, r.end)
            renderGrid(lastByDay, lastFlags)
          } catch {
            grid.classList.remove('loading')
            grid.innerHTML += '<div class="cal-empty muted">Failed to load.</div>'
          }
        }

        function renderGrid(byDay, flags) {
          flags = flags || new Map()
          const grid = document.getElementById('cal-grid')
          const meta = monthMeta(curYear, curMonth)
          const lead = leadingEmpties(meta.firstDow)
          const dow = isJalali ? DOW_J : DOW_G
          let html = dow.map((d, i) => {
            const wk = isJalali ? i === 6 : i === 0 || i === 6
            return `<div class="cal-dow${wk ? ' cal-dow-weekend' : ''}">${d}</div>`
          }).join('')
          for (let i = 0; i < lead; i++) html += '<div class="cal-cell empty"></div>'
          for (let day = 1; day <= meta.days; day++) {
            const dateStr = dayToDate(curYear, curMonth, day)
            const items = byDay[dateStr] || []
            const today = isToday(curYear, curMonth, day)
            const hasItems = items.length > 0
            const hol = flags.get(dateStr)
            const dowNum = new Date(Number(dateStr.slice(0, 4)), Number(dateStr.slice(5, 7)) - 1, Number(dateStr.slice(8, 10))).getDay()
            const isWeekend = isWeekendDow(dowNum)
            const isHoliday = !!hol
            // 22-a #9: every pin carries a tooltip — the item's own text plus its kind and
            // its date rendered through dateLabel (Jalali in fa). Text is attribute-escaped.
            const dotTitle = (it) => {
              const kl = it.kind === 'note'
                ? (it.sticky ? _t('calendar.addSticky', 'Sticky note') : _t('calendar.legendNote', 'Note'))
                : it.kind === 'sadhana' ? _t('calendar.sadhana', 'To-do')
                : it.kind === 'task' ? _t('calendar.task', 'Task') : _t('calendar.project', 'Project')
              return ` title="${escAttr(`${kl} · ${dateLabel(it.date)} · ${it.title}`)}"`
            }
            // Task 24 #2: pins rescale so they ALL fit — ≤4 keep the 24px pin look,
            // 5–8 shrink a step (.many), 9+ go tiny (.lots). No more “+N” truncation.
            const sizeCls = items.length >= 9 ? ' lots' : items.length >= 5 ? ' many' : ''
            const dots = items.map((it) => {
              if (it.kind === 'note') {
                // Sticky notes carry their own pastel; plain day notes get the green Note dot.
                return it.sticky
                  ? `<span class="cal-dot cal-dot-sticky"${dotTitle(it)} style="background:${STICKY_DOT_COLORS[it.color] || STICKY_DOT_COLORS.yellow}"></span>`
                  : `<span class="cal-dot cal-dot-note"${dotTitle(it)}></span>`
              }
              const cls = it.kind === 'sadhana' ? 'cal-dot-sadhana' : it.kind === 'task' ? 'cal-dot-task' : 'cal-dot-project'
              const done = it.done ? ' cal-dot-done' : ''
              return `<span class="cal-dot ${cls}${done}"${dotTitle(it)}></span>`
            }).join('')
            const dayLabel = isJalali ? faDig(day) : String(day)
            // R9.1: weekend + holiday cell classes + holiday name badge
            const cellClasses = [
              'cal-cell',
              today ? 'today' : '',
              dateStr === selISO ? 'selected' : '',
              hasItems ? 'has-items' : '',
              isWeekend ? 'cal-weekend' : '',
              isHoliday ? 'cal-holiday' : '',
            ].filter(Boolean).join(' ')
            const holBadge = isHoliday ? `<span class="cal-hol-badge" title="${escAttr(holLabel(hol))}">${escAttr(holLabel(hol))}</span>` : ''
            const holTooltip = hol ? ` data-tooltip="${escAttr(holLabel(hol))}"` : ''
            html += `<div class="${cellClasses}" data-date="${dateStr}" role="button" tabindex="0"${holTooltip}>
              <span class="cal-day-num">${dayLabel}</span>
              ${holBadge}
              ${hasItems ? `<div class="cal-dots${sizeCls}">${dots}</div>` : ''}
            </div>`
          }
          grid.innerHTML = html
          grid.querySelectorAll('[data-date]').forEach((cell) => {
            cell.addEventListener('click', () => {
              selISO = cell.dataset.date
              markSelected()
              showDay(cell.dataset.date, byDay[cell.dataset.date] || [], flags)
            })
            cell.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cell.click() } })
          })
        }

        function showDay(date, items, flags) {
          flags = flags || new Map()
          const panel = document.getElementById('cal-day-detail')
          const title = document.getElementById('cal-day-title')
          const list = document.getElementById('cal-day-list')
          if (!panel) return
          curDay = { date, items }
          selISO = date
          markSelected()
          // Warm the quadrant cache so the Task composer's select is populated the
          // instant it opens (fillQuadSelect still re-checks; this is just a prefetch).
          loadQuads().catch(() => {})
          // Show the date in the user's language + active calendar system.
          const gy = Number(date.slice(0, 4)), gm = Number(date.slice(5, 7)), gd = Number(date.slice(8, 10))
          const wd = new Date(gy, gm - 1, gd).getDay()
          const hol = flags.get(date)
          let holName = ''
          if (lang === 'fa') {
            title.textContent = `${WD_FA[wd]} ${dateLabel(date)}`
            title.dir = 'rtl'
            if (hol) holName = holLabel(hol)
            else if (isWeekendDow(wd)) holName = isJalali ? 'جمعه تعطیل' : 'تعطیل هفتگی (شنبه و یکشنبه)'
          } else {
            title.textContent = `${WD_EN[wd]}, ${dateLabel(date)}`
            title.dir = 'ltr'
            if (hol) holName = holLabel(hol)
            else if (isWeekendDow(wd)) holName = isJalali ? 'Friday (weekend)' : 'Weekend'
          }
          // Holiday badge at the top of the detail panel
          const holBadgeHtml = holName ? `<li class="cal-day-holiday"><span class="cal-hol-badge">${escAttr(holName)}</span></li>` : ''
          const escH = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
          if (!items.length && !holName) {
            list.innerHTML = `<li class="muted">${_t('calendar.nothing', 'Nothing due on this day.')}</li>`
          } else {
            list.innerHTML = holBadgeHtml + items.map((it) => {
              // Day-bound notes (0028): stickies render as colored chips, plain notes as
              // note rows — both deletable right here without leaving the calendar.
              if (it.kind === 'note') {
                if (it.sticky) {
                  return `<li class="cal-day-sticky" style="--sticky-bg:${STICKY_COLORS[it.color] || STICKY_COLORS.yellow}"><span class="cal-day-sticky-text">${escH(it.title)}</span><button type="button" class="cal-note-x" data-note-del="${it.id}" aria-label="${_t('common.delete', 'Delete')}">✕</button></li>`
                }
                return `<li class="cal-day-item cal-day-note"><span class="cal-note-glyph" aria-hidden="true">📝</span><span class="cal-day-note-text">${escH(it.title)}</span><button type="button" class="cal-note-x" data-note-del="${it.id}" aria-label="${_t('common.delete', 'Delete')}">✕</button></li>`
              }
              const kindLabel = it.kind === 'sadhana' ? _t('calendar.sadhana', 'To-do') : it.kind === 'task' ? _t('calendar.task', 'Task') : _t('calendar.project', 'Project')
              const doneMark = it.done ? '✓ ' : ''
              const statusBadge = it.status ? ` <span class="badge badge-${it.status}">${it.status}</span>` : ''
              const t = escH(it.title)
              // 22-a #2: tasks are deletable in place — quadrant tasks (the ones this page
              // adds) soft-delete via /api/sadhana/tasks/:id; client-project tasks hard
              // delete via the user-scoped /api/tasks/:id. Projects stay undeletable from
              // a date view (too destructive for a calendar row).
              const delKind = it.kind === 'sadhana' ? 'sadhana' : it.kind === 'task' ? 'ptask' : ''
              const delBtn = delKind
                ? `<button type="button" class="cal-note-x" data-task-del="${it.id}" data-del-kind="${delKind}" aria-label="${_t('common.delete', 'Delete')}" title="${_t('common.delete', 'Delete')}">✕</button>`
                : ''
              return `<li class="cal-day-item"><a href="${it.href}">${doneMark}${t}</a><span class="cal-kind">${kindLabel}</span>${statusBadge}${delBtn}</li>`
            }).join('')
          }
          // Day creators: reset any open composer + errors when the panel (re)opens.
          closeComposers()
          panel.hidden = false
        }

        // After a navigation jump (Task 24 #1): open the focused day's panel — the title
        // literally shows which day the jump landed on («پنجشنبه ۱۴ شهریور ۱۴۰۵»).
        function openSelPanel() {
          showDay(selISO, lastByDay[selISO] || [], lastFlags)
          document.getElementById('cal-day-detail')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
        }

        // Navigation: prev/next arrows move through the active calendar's months (pure
        // month flips — the focused-day ring follows when it lands inside them).
        function prevMonth() {
          if (curMonth === 1) { curMonth = 12; curYear-- } else curMonth--
          loadCurrent()
        }
        function nextMonth() {
          if (curMonth === 12) { curMonth = 1; curYear++ } else curMonth++
          loadCurrent()
        }
        function goToday() {
          selISO = todayISO()
          cursorFromDate(selISO)
          loadCurrent().then(openSelPanel).catch(() => {})
        }

        document.getElementById('cal-prev')?.addEventListener('click', prevMonth)
        document.getElementById('cal-next')?.addEventListener('click', nextMonth)
        document.getElementById('cal-today')?.addEventListener('click', goToday)

        // Task 24 #1: «هفته بعد»/«ماه بعد» land on THE EXACT DAY, chained from the
        // focused day (today initially, or whatever day was clicked/jumped last):
        //   هفته بعد  → same weekday, +7 days (e.g. ۷ شهریور → ۱۴ شهریور)
        //   ماه بعد   → the SAME DAY NUMBER in the next month of the active calendar
        //               (۷ شهریور → ۷ مهر; ۳۱ مهر → ۳۰ آبان clamped to month length)
        // The target day gets the .selected ring and its detail panel opens.
        function jumpWeek(n) {
          const d = fromISO(selISO)
          d.setDate(d.getDate() + n)
          selISO = isoOf(d)
          cursorFromDate(selISO)
          loadCurrent().then(openSelPanel).catch(() => {})
        }
        function jumpMonth(n) {
          if (isJalali) {
            const d = fromISO(selISO)
            const j = toJ(d.getFullYear(), d.getMonth() + 1, d.getDate())
            let jy = j.jy, jm = j.jm + n
            while (jm > 12) { jm -= 12; jy++ }
            while (jm < 1) { jm += 12; jy-- }
            const len = monthMeta(jy, jm).days
            const g = toG(jy, jm, Math.min(j.jd, len))
            selISO = `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`
          } else {
            const d = fromISO(selISO)
            const first = new Date(d.getFullYear(), d.getMonth() + n, 1)
            const len = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate()
            selISO = isoOf(new Date(first.getFullYear(), first.getMonth(), Math.min(d.getDate(), len)))
          }
          cursorFromDate(selISO)
          loadCurrent().then(openSelPanel).catch(() => {})
        }
        document.getElementById('cal-next-week')?.addEventListener('click', () => jumpWeek(7))
        document.getElementById('cal-next-month')?.addEventListener('click', () => jumpMonth(1))

        // ---- Calendar-system switch (Task 24 #4) ------------------------------------
        function syncSysButtons() {
          document.querySelectorAll('[data-cal-sys]').forEach((b) => {
            b.classList.toggle('on', (b.dataset.calSys === 'jalali') === isJalali)
            b.setAttribute('aria-pressed', String((b.dataset.calSys === 'jalali') === isJalali))
          })
        }
        syncSysButtons()
        document.querySelectorAll('[data-cal-sys]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const sys = btn.dataset.calSys
            calSys = sys
            try { localStorage.setItem('hibana.calSys', sys) } catch { /* private mode */ }
            isJalali = sys === 'jalali'
            syncSysButtons()
            cursorFromDate(selISO) // keep the view anchored on the same real date
            loadCurrent()
          })
        })

        // ---- Legend drag-to-day (Task 24 #5) ----------------------------------------
        // The four kind dots are draggable (native HTML5 DnD + touch-drag.js long-press
        // on mobile). Dropping one on a day opens that day's panel with the matching
        // creator: project → new project due that day · task → client-project task due
        // that day · sadhana → the quadrant to-do composer · note → the day-note composer.
        let legendDrag = null
        let dropOver = null
        const clearDropOver = () => { if (dropOver) { dropOver.classList.remove('cal-drop'); dropOver = null } }
        ctx.on('dragstart', (e) => {
          const it = e.target.closest ? e.target.closest('[data-legend-kind]') : null
          if (!it) return
          legendDrag = it.dataset.legendKind
          try { e.dataTransfer.effectAllowed = 'copy'; e.dataTransfer.setData('text/plain', legendDrag) } catch { /* synthetic events carry their own dt */ }
          it.classList.add('dragging')
        })
        ctx.on('dragend', (e) => {
          legendDrag = null
          clearDropOver()
          document.querySelectorAll('.cal-legend-item.dragging').forEach((el) => el.classList.remove('dragging'))
        })
        const calGrid = document.getElementById('cal-grid')
        calGrid?.addEventListener('dragover', (e) => {
          if (!legendDrag) return
          const cell = e.target.closest ? e.target.closest('.cal-cell[data-date]') : null
          if (!cell) return
          e.preventDefault()
          try { e.dataTransfer.dropEffect = 'copy' } catch { /* synthetic */ }
          if (dropOver !== cell) { clearDropOver(); dropOver = cell; cell.classList.add('cal-drop') }
        })
        calGrid?.addEventListener('dragleave', (e) => {
          const cell = e.target.closest ? e.target.closest('.cal-cell[data-date]') : null
          if (cell && cell === dropOver && !cell.contains(e.relatedTarget)) clearDropOver()
        })
        calGrid?.addEventListener('drop', (e) => {
          if (!legendDrag) return
          const cell = e.target.closest ? e.target.closest('.cal-cell[data-date]') : null
          if (!cell) return
          e.preventDefault()
          const kind = legendDrag
          const date = cell.dataset.date
          legendDrag = null
          clearDropOver()
          document.querySelectorAll('.cal-legend-item.dragging').forEach((el) => el.classList.remove('dragging'))
          showDay(date, lastByDay[date] || [], lastFlags)
          if (kind === 'note') toggleComposer('cal-note-form', 'cal-add-note')
          else if (kind === 'sadhana') toggleComposer('cal-task-form', 'cal-add-task', fillQuadSelect)
          else if (kind === 'task') toggleComposer('cal-ctask-form', null, fillProjectSelect)
          else if (kind === 'project') toggleComposer('cal-project-form', null, fillProjectStatusSelect)
          document.getElementById('cal-day-detail')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
        })

        document.getElementById('cal-day-close')?.addEventListener('click', () => {
          document.getElementById('cal-day-detail').hidden = true
          closeComposers()
        })

        // ---- Right-click day menu (22-a #6) ---------------------------------------
        // contextmenu on any calendar day opens the three day-creators for that date,
        // reusing the exact add-flows the day panel already has (showDay sets the target
        // day, toggleComposer opens the matching form). Closes on outside click / Esc.
        let calMenu = null
        function closeCalMenu() {
          if (calMenu) { calMenu.remove(); calMenu = null }
        }
        function openCalMenu(date, x, y) {
          closeCalMenu()
          showDay(date, lastByDay[date] || [], lastFlags) // target day + panel
          calMenu = document.createElement('div')
          calMenu.className = 'cal-ctx-menu'
          calMenu.setAttribute('role', 'menu')
          calMenu.innerHTML = `
            <div class="cal-ctx-date">${escAttr(dateLabel(date))}</div>
            <button type="button" role="menuitem" data-act="note">${_t('calendar.newNote', 'New note')}</button>
            <button type="button" role="menuitem" data-act="task">${_t('calendar.newTask', 'New task')}</button>
            <button type="button" role="menuitem" data-act="sticky">${_t('calendar.newSticky', 'New sticky note')}</button>`
          calMenu.addEventListener('click', (e) => {
            const b = e.target.closest('[data-act]')
            if (!b) return
            const act = b.dataset.act
            closeCalMenu()
            if (act === 'note') toggleComposer('cal-note-form', 'cal-add-note')
            else if (act === 'task') toggleComposer('cal-task-form', 'cal-add-task', fillQuadSelect)
            else if (act === 'sticky') toggleComposer('cal-sticky-form', 'cal-add-sticky', renderStickyColors)
            document.getElementById('cal-day-detail')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
          })
          document.body.appendChild(calMenu)
          // Clamp inside the viewport (clientX/Y are viewport coords — direction-agnostic,
          // so RTL needs no special casing). Fixed positioning keeps it under the cursor.
          const r = calMenu.getBoundingClientRect()
          calMenu.style.left = `${Math.max(8, Math.min(x, window.innerWidth - r.width - 8))}px`
          calMenu.style.top = `${Math.max(8, Math.min(y, window.innerHeight - r.height - 8))}px`
          calMenu.querySelector('button')?.focus()
        }
        document.getElementById('cal-grid')?.addEventListener('contextmenu', (e) => {
          const cell = e.target.closest('[data-date]')
          if (!cell) return
          e.preventDefault()
          openCalMenu(cell.dataset.date, e.clientX, e.clientY)
        })
        // ctx.on (document-level) so soft navigation auto-removes these listeners.
        ctx.on('click', (e) => { if (calMenu && !calMenu.contains(e.target)) closeCalMenu() }, true)
        ctx.on('keydown', (e) => { if (e.key === 'Escape') closeCalMenu() })
        window.addEventListener('resize', closeCalMenu)
        ctx.on('scroll', closeCalMenu, true)

        // ---- Day creators: sticky note / quadrant task / plain note / project / client task ----
        const COMPOSERS = ['cal-sticky-form', 'cal-task-form', 'cal-note-form', 'cal-project-form', 'cal-ctask-form']
        function closeComposers() {
          for (const id of COMPOSERS) {
            const f = document.getElementById(id)
            if (f) { f.hidden = true; f.reset() }
          }
          const err = document.getElementById('cal-add-error')
          if (err) { err.hidden = true; err.textContent = '' }
          for (const id of ['cal-add-sticky', 'cal-add-task', 'cal-add-note']) {
            document.getElementById(id)?.setAttribute('aria-expanded', 'false')
          }
        }
        function toggleComposer(formId, btnId, prep) {
          const form = document.getElementById(formId)
          const wasHidden = !form || form.hidden
          closeComposers()
          if (!wasHidden) return
          if (prep) prep()
          form.hidden = false
          if (btnId) document.getElementById(btnId)?.setAttribute('aria-expanded', 'true')
          const first = form.querySelector('textarea, input, select')
          if (first) first.focus()
        }
        const calErr = (msg) => {
          const el = document.getElementById('cal-add-error')
          if (el) { el.textContent = msg; el.hidden = false }
        }
        async function dayRefresh() {
          // Re-fetch the month (new dots) and repaint the open day panel with fresh items.
          await loadCurrent()
          if (curDay) showDay(curDay.date, lastByDay[curDay.date] || [], lastFlags)
        }

        // Sticky color dots (same palette + names as the notebook hover picker).
        function renderStickyColors() {
          const wrap = document.getElementById('cal-sticky-colors')
          if (!wrap) return
          wrap.innerHTML = Object.entries(STICKY_COLORS).map(([name, hex]) => {
            const label = _t(`calendar.color_${name}`, name)
            return `<button type="button" class="cal-color-dot${stickyColor === name ? ' active' : ''}" data-color="${name}" style="background:${hex}" role="radio" aria-checked="${stickyColor === name}" aria-label="${label}" title="${label}"></button>`
          }).join('')
        }
        document.getElementById('cal-sticky-colors')?.addEventListener('click', (e) => {
          const b = e.target.closest('[data-color]')
          if (!b) return
          stickyColor = b.dataset.color
          renderStickyColors()
        })

        // Quadrant picker: names come from the board (custom names respected), localized
        // for the active language; the defaults mirror sadhana.ts if the fetch fails.
        async function loadQuads() {
          if (quadsCache) return quadsCache
          try {
            const res = await fetch('/api/sadhana')
            const data = res.ok ? await res.json() : null
            if (data && Array.isArray(data.quads) && data.quads.length) {
              quadsCache = data.quads.map((q) => ({ id: q.id, icon: q.icon, name: lang === 'fa' ? q.name_fa : q.name_en }))
              return quadsCache
            }
          } catch { /* offline → defaults below */ }
          quadsCache = [
            { id: 1, icon: '⚙️', name: lang === 'fa' ? 'امروز' : 'Today' },
            { id: 3, icon: '🚨', name: lang === 'fa' ? 'فوری و باارزش' : 'Urgent & High Value' },
            { id: 2, icon: '🏔️', name: lang === 'fa' ? 'استراتژیک' : 'Strategic' },
            { id: 4, icon: '🍃', name: lang === 'fa' ? 'شخصی و احساسی' : 'Personal & Sentimental' },
          ]
          return quadsCache
        }
        async function fillQuadSelect() {
          const sel = document.getElementById('cal-task-quad')
          if (!sel) return
          const quads = await loadQuads()
          // Only repaint when the options actually changed (a repaint mid-selection
          // would reset the user's pick; loadQuads caches per language so this is cheap).
          const want = quads.map((q) => `${q.id}:${q.name}`).join('|')
          const have = [...sel.options].map((o) => `${o.value}:${o.textContent.replace(/^\S+\s/, '')}`).join('|')
          if (want !== have) sel.innerHTML = quads.map((q) => `<option value="${q.id}">${q.icon} ${q.name}</option>`).join('')
        }

        // Project picker (Task 24 #5, client-task composer): the user's projects.
        async function loadProjects() {
          if (projectsCache) return projectsCache
          try {
            const res = await fetch('/api/projects')
            const data = res.ok ? await res.json() : null
            if (data && Array.isArray(data.projects)) projectsCache = data.projects
          } catch { /* offline → empty */ }
          return projectsCache || []
        }
        async function fillProjectSelect() {
          const sel = document.getElementById('cal-ctask-project')
          if (!sel) return
          const projects = await loadProjects()
          if (!projects.length) {
            sel.innerHTML = `<option value="">${_t('calendar.noProjects', 'No projects yet — create one first')}</option>`
            return
          }
          sel.innerHTML = projects.map((p) => `<option value="${p.id}">${escAttr(p.title)}</option>`).join('')
        }
        function fillProjectStatusSelect() {
          const sel = document.getElementById('cal-project-status')
          if (!sel) return
          sel.innerHTML = PROJECT_STATUSES.map((s) => `<option value="${s}">${_t('status.' + s, s)}</option>`).join('')
        }

        document.getElementById('cal-add-sticky')?.addEventListener('click', () => {
          toggleComposer('cal-sticky-form', 'cal-add-sticky', renderStickyColors)
        })
        document.getElementById('cal-add-task')?.addEventListener('click', () => {
          toggleComposer('cal-task-form', 'cal-add-task', fillQuadSelect)
        })
        document.getElementById('cal-add-note')?.addEventListener('click', () => {
          toggleComposer('cal-note-form', 'cal-add-note')
        })

        document.getElementById('cal-sticky-form')?.addEventListener('submit', async (e) => {
          e.preventDefault()
          const text = document.getElementById('cal-sticky-text').value.trim()
          if (!text || !curDay) return
          try {
            const res = await fetch('/api/notes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ kind: 'note', content: text, color: stickyColor, note_date: curDay.date, sticky: true }),
            })
            if (!res.ok) throw new Error(String(res.status))
            window.hibana?.toast(_t('calendar.stickyAdded', 'Sticky note added'), 'info')
            await dayRefresh()
          } catch { calErr(_t('calendar.addFailed', "Couldn't save — try again.")) }
        })

        document.getElementById('cal-task-form')?.addEventListener('submit', async (e) => {
          e.preventDefault()
          const title = document.getElementById('cal-task-title').value.trim()
          if (!title || !curDay) return
          try {
            const quad = Number(document.getElementById('cal-task-quad').value || 1)
            const res = await fetch('/api/sadhana/tasks', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ quadrant: quad, title, due_date: curDay.date }),
            })
            if (!res.ok) throw new Error(String(res.status))
            window.hibana?.toast(_t('calendar.taskAdded', 'Task added'), 'info')
            await dayRefresh()
          } catch { calErr(_t('calendar.addFailed', "Couldn't save — try again.")) }
        })

        document.getElementById('cal-note-form')?.addEventListener('submit', async (e) => {
          e.preventDefault()
          const text = document.getElementById('cal-note-text').value.trim()
          if (!text || !curDay) return
          try {
            const res = await fetch('/api/notes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ kind: 'note', content: text, note_date: curDay.date, sticky: false }),
            })
            if (!res.ok) throw new Error(String(res.status))
            window.hibana?.toast(_t('calendar.noteAdded', 'Note added'), 'info')
            await dayRefresh()
          } catch { calErr(_t('calendar.addFailed', "Couldn't save — try again.")) }
        })

        // Task 24 #5: legend-drop composers — a whole project due this day (creates it
        // with that due date + chosen stage) and a client-project task due this day.
        document.getElementById('cal-project-form')?.addEventListener('submit', async (e) => {
          e.preventDefault()
          const title = document.getElementById('cal-project-title').value.trim()
          if (!title || !curDay) return
          const status = document.getElementById('cal-project-status').value || 'spark'
          try {
            const res = await fetch('/api/projects', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title, status, due_date: curDay.date }),
            })
            if (!res.ok) throw new Error(String(res.status))
            window.hibana?.toast(_t('calendar.projectAdded', 'Project added'), 'info')
            await dayRefresh()
          } catch { calErr(_t('calendar.addFailed', "Couldn't save — try again.")) }
        })

        document.getElementById('cal-ctask-form')?.addEventListener('submit', async (e) => {
          e.preventDefault()
          const title = document.getElementById('cal-ctask-title').value.trim()
          const projectId = document.getElementById('cal-ctask-project').value
          if (!title || !projectId || !curDay) return
          try {
            const res = await fetch(`/api/projects/${projectId}/tasks`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title, due_date: curDay.date }),
            })
            if (!res.ok) throw new Error(String(res.status))
            window.hibana?.toast(_t('calendar.taskAdded', 'Task added'), 'info')
            await dayRefresh()
          } catch { calErr(_t('calendar.addFailed', "Couldn't save — try again.")) }
        })

        // Delete a day note / sticky straight from the day panel (soft delete, same as the notebook).
        document.getElementById('cal-day-list')?.addEventListener('click', async (e) => {
          const noteBtn = e.target.closest('[data-note-del]')
          if (noteBtn) {
            try {
              const res = await fetch(`/api/notes/${noteBtn.dataset.noteDel}`, { method: 'DELETE' })
              if (!res.ok) throw new Error(String(res.status))
              window.hibana?.toast(_t('calendar.deleted', 'Deleted'), 'info')
              await dayRefresh()
            } catch { calErr(_t('calendar.addFailed', "Couldn't save — try again.")) }
            return
          }
          // Delete a task from the day panel (22-a #2): quadrant tasks → sadhana soft
          // delete; client-project tasks → /api/tasks/:id. Same «حذف شد» toast as notes.
          const taskBtn = e.target.closest('[data-task-del]')
          if (taskBtn) {
            const delUrl = taskBtn.dataset.delKind === 'ptask'
              ? `/api/tasks/${taskBtn.dataset.taskDel}`
              : `/api/sadhana/tasks/${taskBtn.dataset.taskDel}`
            try {
              const res = await fetch(delUrl, { method: 'DELETE' })
              if (!res.ok) throw new Error(String(res.status))
              window.hibana?.toast(_t('calendar.deleted', 'Deleted'), 'info')
              await dayRefresh()
            } catch { calErr(_t('calendar.addFailed', "Couldn't save — try again.")) }
          }
        })

        // RTL the grid when Jalali (the weekday row + cells flow the same, but the page
        // direction is handled by the html[lang="fa"] rule in app.css for the whole tree).
        loadCurrent()

        // Language-race fix (same class as the Alpine label races fixed 2026-08-29):
        // the calendar system default follows the user's language, which resolves from an
        // async /api/auth/me fetch — AFTER this mount ran. On a hard load, boot.js mounts
        // page defs on alpine:init and Alpine loads BEFORE i18n.js, so window.hibanaI18n
        // doesn't even exist yet here — reach it via the 'hibana:i18n' DOM event instead
        // (fired at the end of every apply()). Handler is idempotent: language labels
        // refresh, and the system only switches when the user hasn't pinned one.
        const repaintAfterI18n = () => {
          const newLang = (window.hibanaI18n?.lang?.() || 'en')
          const langChanged = newLang !== lang
          lang = newLang
          syncSysButtons()
          // F10 (session 9): the profile timezone just resolved (hibanaI18n.tz()).
          // If the focused day is still the boot-day guess and the profile TZ moved
          // "today" (browser UTC 23:30 → Tehran is already tomorrow), re-target the
          // focus + the month cursor; the .today ring follows nowInTz() on its own.
          const tzToday = todayISO()
          if (selISO === bootTodayISO && tzToday !== bootTodayISO) {
            selISO = tzToday
            cursorFromDate(selISO)
          }
          if (!calSys) {
            const nj = lang === 'fa'
            if (nj !== isJalali) {
              isJalali = nj
              if (langChanged) quadsCache = null // quadrant labels re-localize on the next open
              const sel = document.getElementById('cal-task-quad')
              if (sel) sel.innerHTML = ''
              cursorFromDate(selISO)
            }
          }
          loadCurrent()
        }
        if (window.hibanaI18n?.ready) {
          window.hibanaI18n.ready.then(repaintAfterI18n).catch(() => {})
        }
        // ctx.on (not addEventListener) so soft navigation auto-removes this listener.
        ctx.on('hibana:i18n', repaintAfterI18n)

        // Soft-nav cleanup (nav.js calls this when another page mounts): drop the window
        // resize listener ctx.on can't own (resize fires on window, not document) and
        // dismiss any open right-click menu / drop highlight.
        return () => {
          window.removeEventListener('resize', closeCalMenu)
          closeCalMenu()
          clearDropOver()
          legendDrag = null
        }
      },
    })
  </script>
</body>
</html>
