<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas — Hibana</title>
  <link rel="stylesheet" href="/css/app.css?v=259">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
  <link rel="stylesheet" href="/vendor/bebas-note/font-face.css">
  <script src="/vendor/htmx.min.js" defer></script>
  <script src="/vendor/alpine.min.js" defer></script>
  <script src="/vendor/fabric.min.js" defer></script>
  <script src="/js/queue.js?v=2" defer></script>
  <script src="/js/app.js?v=171" defer></script>
  <script src="/js/touch-drag.js?v=1" defer></script>
  <script src="/js/command-palette.js?v=1" defer></script>
  <script src="/js/mobile-nav.js?v=4" defer></script>
  <script src="/js/zen-mode.js?v=1" defer></script>
  <script src="/js/micro-interactions.js?v=1" defer></script>
  <script src="/js/go-to.js?v=1" defer></script>
  <script src="/js/install-prompt.js?v=1" defer></script>
  <script src="/js/i18n.js?v=54" defer></script>
  <script src="/js/canvas.js?v=18" defer></script>
</head>
<body class="canvas-page">
  <div data-nav></div>
  <h1 class="sr-only" data-i18n="nav.canvas">Canvas</h1>

  <!-- Toolbar: functional clusters with dividers —
       [tools] · [text props] · [stroke width] · [color] · [history] · [object actions] · [more] -->
  <div class="canvas-toolbar" id="canvas-toolbar">
    <div class="tb-group">
      <button data-tool="select" class="active" title="Select / move / pan (space or middle-drag)" data-i18n-title="canvas.select"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 3.5l13.5 7.6-6 1.6a1 1 0 0 0-.7.7L10.7 19z"/></svg></button>
      <button data-tool="pen" class="pen-only" title="Draw freehand (desktop)" data-i18n-title="canvas.pen"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.5-1L19.5 8a2 2 0 0 0-2.8-2.8L6.5 15.5 4 20Z"/><path d="M13.5 6.5l3.5 3.5"/></svg></button>
      <button data-tool="note" title="Add a sticky note" data-i18n-title="canvas.note"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5V14l-6 6H5.5A1.5 1.5 0 0 1 4 18.5Z"/><path d="M14 20v-4.5A1.5 1.5 0 0 1 15.5 14H20"/></svg></button>
      <button data-tool="text" title="Text — drag a box, or click to type" data-i18n-title="canvas.text"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6V4h16v2M12 4v16M9 20h6"/></svg></button>
      <button data-tool="eraser" title="Eraser" data-i18n-title="canvas.eraser"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l7-7 9 9-7 7-3-3M4 9l6 6M20 21H10"/></svg></button>
      <button data-tool="arrow" class="pen-only" title="Arrow — drag from start to end" data-i18n-title="canvas.arrow"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13.5 6l6 6-6 6"/></svg></button>
      <button data-tool="frame" title="Frame — drag to draw one; its content moves with it" data-i18n-title="canvas.frame"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H4.5A1.5 1.5 0 0 0 3 4.5V7M17 3h2.5A1.5 1.5 0 0 1 21 4.5V7M7 21H4.5A1.5 1.5 0 0 1 3 19.5V17M17 21h2.5a1.5 1.5 0 0 0 1.5-1.5V17M3 12h18"/></svg></button>
      <!-- squig batch (2026-08-31), (s) merge: clean shape primitives — rect / oval.
           Drag draws; Shift constrains (rect→square, oval→perfect circle); a plain
           click drops a default size. Legacy saved circles keep rendering as circles. -->
      <button data-tool="rect" title="Rectangle — drag to draw (Shift = square)" data-i18n-title="canvas.rect"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="14" height="10" rx="1.5"/></svg></button>
      <button data-tool="oval" title="Oval — drag to draw (hold Shift for a perfect circle)" data-i18n-title="canvas.oval"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="5.5"/></svg></button>
      <!-- Comment pins (Figma-style): click the canvas to pin a note where you stand. -->
      <button data-tool="comment" title="Comment — click the canvas to pin a note" data-i18n-title="canvas.comment"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v6a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4h-1A2.5 2.5 0 0 1 4 12.5z"/></svg></button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group tb-text-props">
      <select data-font-size aria-label="Text size" data-i18n-title="canvas.fontSize" class="tb-select">
        <option value="12">12</option>
        <option value="14">14</option>
        <option value="16" selected>16</option>
        <option value="20">20</option>
        <option value="24">24</option>
        <option value="32">32</option>
        <option value="48">48</option>
      </select>
      <label class="small muted" for="canvas-font" data-i18n="canvas.fontLabel">Font</label>
      <select id="canvas-font" data-font-pick class="tb-select">
        <option value="bebas" data-i18n="font.bebas">Bebas</option>
        <option value="classic" data-i18n="font.classic">Classic</option>
      </select>
    </div>
    <span class="tb-sep tb-text-props"></span>
    <div class="tb-group width-pick pen-only" id="pen-widths">
      <button data-width="2" title="Thin pen" data-i18n-title="canvas.width2" style="--dot-size:5px"><span class="dot"></span></button>
      <button data-width="4" class="active" title="Medium pen" data-i18n-title="canvas.width4" style="--dot-size:8px"><span class="dot"></span></button>
      <button data-width="7" title="Thick pen" data-i18n-title="canvas.width7" style="--dot-size:12px"><span class="dot"></span></button>
      <button data-width="12" title="Very thick pen" data-i18n-title="canvas.width12" style="--dot-size:16px"><span class="dot"></span></button>
    </div>
    <span class="tb-sep pen-only"></span>
    <div class="tb-group palette" id="palette">
      <button style="background:#1c1c1a" data-color="#1c1c1a" class="swatch-black" title="Black pen" data-i18n-title="canvas.colorBlack" aria-label="Black"></button>
      <button style="background:#fef08a" data-color="#fef08a" aria-label="Yellow"></button>
      <button style="background:#fbcfe8" data-color="#fbcfe8" aria-label="Pink"></button>
      <button style="background:#bbf7d0" data-color="#bbf7d0" aria-label="Green"></button>
      <button style="background:#bfdbfe" data-color="#bfdbfe" aria-label="Blue"></button>
      <button style="background:#fed7aa" data-color="#fed7aa" aria-label="Orange"></button>
      <button style="background:#e9d5ff" data-color="#e9d5ff" aria-label="Purple"></button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group">
      <button data-action="undo" title="Undo" data-i18n-title="canvas.undo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-4"/></svg></button>
      <button data-action="redo" title="Redo" data-i18n-title="canvas.redo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h4"/></svg></button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group">
      <button data-action="lock" title="Lock / unlock selection" data-i18n-title="canvas.lock"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      <button data-action="promote" title="Promote selected note to an Idea (keep the note)" data-i18n-title="canvas.promote"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0l-5 5m5-5l5 5"/></svg> <span data-i18n="canvas.promoteBtn">Promote</span></button>
      <!-- Phase 7 item 9: sibling of «تبدیل به ایده» — the selected sticky note lands in the
           Quick Notebook on the dashboard (sticky stays on the board, promote-style). -->
      <button data-action="quicknote" title="Convert selected sticky note to a Quick Note (the sticky stays)" data-i18n-title="canvas.toNote"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h9l5 5v9a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 19V6.5A1.5 1.5 0 0 1 5.5 5Z"/><path d="M8 12h8M8 15.5h5"/></svg> <span data-i18n="canvas.toNoteBtn">To Quick Note</span></button>
      <button data-action="delete" class="danger" title="Delete selected" data-i18n-title="canvas.deleteSel"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg> <span data-i18n="common.delete">Delete</span></button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group">
      <!-- squig batch (2026-08-31): wireframe blocks / paper appearance / PNG export.
           Each opens an anchored popover inside #canvas-wrap (canvas.js wires them).
           (k) 2026-09-06: image-from-link promoted here from the ⋯ overflow — it was
           invisible AND dead (CSP img-src blocked every external picture; fixed in
           app.ts/_headers this batch). Opens the image popover (URL input + Add). -->
      <button data-action="addimage" title="Add an image from a link (URL)" data-i18n-title="canvas.addImage"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M5 19l5-6 3 3 4-4 3 3"/></svg></button>
      <button data-action="blocks" title="Wireframe blocks — place lo-fi UI building blocks" data-i18n-title="canvas.blocks"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
      <button data-action="paper" title="Paper &amp; grid" data-i18n-title="canvas.paper"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg></button>
      <button data-action="export" title="Export as PNG" data-i18n-title="canvas.exportPng"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0-4-4m4 4 4-4"/><path d="M4 17v1.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg></button>
    </div>
    <span class="tb-sep"></span>
    <details class="tb-more">
      <summary title="More tools" data-i18n-title="canvas.more" aria-label="More tools"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></summary>
      <div class="tb-more-pop">
        <button data-action="zoomin" data-i18n="canvas.zoomIn">Zoom in</button>
        <button data-action="zoomout" data-i18n="canvas.zoomOut">Zoom out</button>
        <button data-action="fit" data-i18n="canvas.fit">Reset view</button>
      </div>
    </details>
  </div>


  <div id="canvas-wrap">
    <!-- Dot grid (Figma/Miro pattern): the radial-gradient tile is painted on the
         FABRIC LOWER CANVAS itself (app.css #canvas-wrap .lower-canvas) — the exact
         surface under every element — and canvas.js keeps its size/offset in sync
         with the zoom/pan transform so the dots scale and travel with the content.
         Paper variants (squig batch 2026-08-31): #canvas-wrap gets .paper-white /
         .paper-checkered / .paper-shaded (default plain) + .dots-off; canvas.js
         composes the multi-layer background-position sync. -->
    <canvas id="board" width="1200" height="800"></canvas>
    <!-- Session 19: empty-canvas affordance — a faint hint that disappears as soon as the
         user draws. canvas.js toggles .has-content on #canvas-wrap to hide this. -->
    <div class="canvas-empty-hint" id="canvas-empty-hint" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg>
      <span data-i18n="canvas.emptyHint">Click a tool above, then drag here to begin</span>
    </div>
    <!-- Floating note-color palette — canvas.js shows it under a selected sticky -->
    <div class="sticky-palette" data-sticky-palette hidden></div>
    <!-- squig batch popovers (2026-08-31) — canvas.js positions/anchors each one -->
    <div class="board-popover blocks-pop" data-blocks-pop hidden></div>
    <div class="board-popover paper-pop" data-paper-pop hidden>
      <div class="pop-title" data-i18n="canvas.paper">Paper</div>
      <div class="paper-grid">
        <button data-paper="plain"><span class="paper-pv paper-pv-plain"></span><span data-i18n="canvas.paperPlain">Default</span></button>
        <button data-paper="white"><span class="paper-pv paper-pv-white"></span><span data-i18n="canvas.paperWhite">White</span></button>
        <button data-paper="checkered"><span class="paper-pv paper-pv-checkered"></span><span data-i18n="canvas.paperCheckered">Checkered</span></button>
        <button data-paper="shaded"><span class="paper-pv paper-pv-shaded"></span><span data-i18n="canvas.paperShaded">Shaded</span></button>
      </div>
      <label class="pop-toggle"><input type="checkbox" data-dots-toggle checked><span data-i18n="canvas.paperDots">Dot grid</span></label>
      <label class="pop-toggle"><input type="checkbox" data-snap-toggle checked><span data-i18n="canvas.snap">Snap to 10px grid</span></label>
    </div>
    <div class="board-popover export-pop" data-export-pop hidden>
      <div class="pop-title" data-i18n="canvas.exportPng">Export as PNG</div>
      <div class="pop-hint" data-i18n="canvas.exportHint">2× resolution · paper background</div>
      <div data-export-rows></div>
    </div>
    <!-- (k) 2026-09-06: image-from-link popover — a direct picture URL lands on the
         board at the viewport center (rounded, contain-fit, draggable). The input is
         dir=ltr so URLs read correctly on the RTL canvas too. -->
    <div class="board-popover image-pop" data-image-pop hidden>
      <div class="pop-title" data-i18n="canvas.addImage">Add an image from a link</div>
      <div class="pop-hint" data-i18n="canvas.imageHint">Paste a direct picture link (https://…)</div>
      <!-- novalidate: the app's own bilingual error (canvas.imageBadUrl) replaces the
           browser's locale-dependent native bubble — invalid input must reach the
           submit handler, not be swallowed by HTML5 constraint validation. -->
      <form class="image-form" data-image-form novalidate>
        <input type="url" data-image-url dir="ltr" inputmode="url" autocomplete="off" spellcheck="false" required placeholder="https://…" aria-label="Image URL" data-i18n-label="canvas.imagePrompt">
        <button type="submit" data-image-add data-i18n="canvas.imageAdd">Add</button>
      </form>
      <p class="image-error" data-image-error hidden></p>
    </div>
    <div class="board-popover comment-pop" data-comment-pop hidden>
      <div class="comment-pop-head">
        <span data-i18n="canvas.commentTitle">Comment</span>
        <button type="button" data-comment-close aria-label="Close">×</button>
      </div>
      <textarea data-comment-text rows="3" maxlength="2000" data-i18n-placeholder="canvas.commentPh" placeholder="Write a comment…"></textarea>
      <div class="comment-pop-actions">
        <button type="button" class="danger" data-comment-delete data-i18n="common.delete">Delete</button>
        <button type="button" data-comment-save data-i18n="canvas.commentSave">Save</button>
      </div>
    </div>
    <div class="board-loading" data-board-loading><span class="hibana-spinner" aria-hidden="true"></span><span data-i18n="canvas.loading">Loading canvas…</span></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => window.dispatchEvent(new Event('hibana-canvas-init')))
  </script>
</body>
</html>
