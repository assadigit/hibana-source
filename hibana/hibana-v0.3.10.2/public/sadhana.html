<!doctype html>
<!-- Sadhana board — the quadrant to-do app, fully integrated into the Hibana shell
     (2026-08-29): unified topbar via [data-nav] + mobile bottom bar, no separate Sadhana
     header (user request) — language/theme/account live in the Hibana chrome. The board
     keeps its own scoped styles (.sadhana-wrap) and defines the app-wide design system:
     Hibana's app.css tokens follow this palette (warm sand, teal accent, 16px radii). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list — Hibana</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#EDE8DF">
  <link rel="stylesheet" href="/css/app.css?v=257">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
  <link rel="stylesheet" href="/vendor/vazir/font-face.css">
  <script>
  /* Pre-paint the saved theme (Hibana's app-wide key) before first render. */
  try{const t=localStorage.getItem('hibana-theme');if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}
  </script>
  <!-- Hibana shell chrome: offline queue, global app (nav partial fetch, theme, SW,
       auth guard), i18n (topbar + title translation), soft-nav, command palette,
       mobile bottom bar, PWA install prompt. No Alpine/htmx — the board is plain JS. -->
  <script src="/js/queue.js?v=2" defer></script>
  <!-- Phase 6 item 2: the full emoji library + the shared picker dialog -->
  <!-- M7: emoji-data.js lazy-loaded by emoji-picker.js on first open (saves 49KB on every page load) -->
  <script src="/js/emoji-picker.js?v=2" defer></script>
  <script src="/js/app.js?v=168" defer></script>
  <script src="/js/touch-drag.js?v=1" defer></script>
  <script src="/js/i18n.js?v=53" defer></script>
  <script src="/js/nav.js?v=1" defer></script>
  <script src="/js/command-palette.js?v=1" defer></script>
  <script src="/js/mobile-nav.js?v=4" defer></script>
  <script src="/js/go-to.js?v=1" defer></script>
  <script src="/js/install-prompt.js?v=1" defer></script>
  <style>
/* ══ Design-system unification (2026-08-29) ════════════════════════════════════
   The board no longer ships its own copies of the shared tokens: app.css now carries
   the SAME Sadhana palette app-wide (--bg warm sand, --card cream, --accent teal,
   --radius 16px, soft warm shadows). Here we only keep the board-specific names
   (–-surface/-surface2/-border/-border2/-text-muted/-text-dim/-q1..4/-tw…) mapped
   onto the unified tokens, so the board re-skins together with the whole app.
   Everything is scoped under .sadhana-wrap — app.css chrome (topbar, bottom bar,
   command palette, toasts) can never be caught by the board's compact selectors. */
.sadhana-wrap {
  --surface: var(--card);
  --surface2: var(--bg-soft);
  --border: var(--line);
  --border2: var(--line-strong);
  --text-muted: var(--muted);
  /* F3 (session 9): the light/dark values were SWAPPED — the dark blocks redeclared
     the LIGHT value (#524A40, 1.9:1 on the dark surface) and the light default was the
     mid #A09890 (2.8:1 on white — fails AA for the 9.5–13px meta text it styles).
     Now: light gets #524A40 (8.3–8.7:1), dark gets #A09890 (5.7–6.1:1). */
  --text-dim: #524A40;                       /* warm dim — light value; dark variant below */
  --shadow-lg: 0 8px 36px rgb(30 20 10 / 0.12);
  --accent-l: rgb(74 159 163 / 0.13);        /* teal tint (theme-agnostic rgba) */
  /* quadrant edge (2026-09 user request: "edges not visible / cropped") — a stronger
     hairline than --border2 so all four borders read crisply on every quadrant,
     light + dark, without bringing back shadows or per-quadrant color. */
  --q-edge: rgba(50,35,15,.26);
  /* quadrant identity — THE canonical four (Q1 teal · Q2 amber · Q3 rose · Q4 lavender) */
  --q1:#4A9FA3; --q1-l:rgba(74,159,163,.14);
  --q2:#C4893A; --q2-l:rgba(196,137,58,.14);
  --q3:#B85A54; --q3-l:rgba(184,90,84,.14);
  --q4:#8A7CAA; --q4-l:rgba(138,124,170,.14);
  /* tag colors — harmonized with the pastel palette */
  --tw:#4A9FA3;--tw-l:rgba(74,159,163,.11);   /* work: teal        */
  --tp:#8A7CAA;--tp-l:rgba(138,124,170,.11);  /* personal: lavender*/
  --tsg:#C4893A;--tsg-l:rgba(196,137,58,.11); /* growth: amber     */
  --tso:#B85A54;--tso-l:rgba(184,90,84,.11);  /* social: rose      */
  --th:#5A9E80;--th-l:rgba(90,158,128,.11);   /* health: mint-sage */
}
@media (prefers-color-scheme: dark) {
  .sadhana-wrap { --text-dim:#B0A79C; --shadow-lg:0 8px 40px rgb(0 0 0 / 0.65); --q-edge:rgba(126,116,98,0.45); }
}
html[data-theme='light'] .sadhana-wrap { --text-dim:#524A40; --shadow-lg:0 8px 36px rgb(30 20 10 / 0.12); --q-edge:rgba(50,35,15,.26); }
html[data-theme='dark'] .sadhana-wrap { --text-dim:#B0A79C; --shadow-lg:0 8px 40px rgb(0 0 0 / 0.65); --q-edge:rgba(126,116,98,0.45); }

/* Board-scoped reset + base type. The global * reset used to live on the document —
   now it must not touch the injected Hibana chrome (topbar / bottom bar / cmdk). */
.sadhana-wrap,.sadhana-wrap *{box-sizing:border-box;margin:0;padding:0}
.sadhana-wrap{font-family:'Manrope','Vazir',sans-serif;color:var(--text);transition:background .3s,color .3s}
body.rtl .sadhana-wrap{direction:rtl;font-family:'Vazir','Manrope',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}

/* ─── Shell layout: Hibana topbar above, board fills the rest ──
   body.sadhana-body is a flex column ([data-nav] topbar + .sadhana-wrap); on phones
   the topbar is hidden (app.css ≤720px) and body.has-mobile-nav pads the bottom bar. */
html,body{height:100%}
body.sadhana-body{overflow:hidden;display:flex;flex-direction:column}
.sadhana-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.sadhana-wrap .page-shell{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}

/* ─── Board toolbar buttons (subbar) ────────────
   The old Sadhana header (brand + user menu + lang/theme toggles) is gone — the
   unified Hibana topbar / mobile More sheet carries all of that now. What remains
   of the header's vocabulary: the .btn pair (Telegram / Archive / modal actions)
   and the date pill, which moved into the subbar. */
.sadhana-wrap .btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);transition:all .2s;font-family:inherit;background:var(--surface2);color:var(--text-muted)}
.sadhana-wrap .btn:hover{background:var(--surface);color:var(--text)}
.sadhana-wrap .btn-primary{background:var(--accent);color:#fff;border-color:transparent}.btn-primary:hover{background:var(--accent-hover)}
/* Batch s (2026-09): the Archive subbar button drops its grey pill — transparent
   background + border, muted text that just brightens on hover. Scoped to
   #archiveBtn ONLY (the shared .btn base keeps its fill for modal action buttons);
   the transparent 1px border keeps the exact .btn height/alignment. */
.sadhana-wrap #archiveBtn{background:transparent;border-color:transparent;color:var(--text-muted)}
.sadhana-wrap #archiveBtn:hover{background:transparent;border-color:transparent;color:var(--text)}

/* ─── Header date pill (now in the subbar) ───────
   Batch s (2026-09): MINIMAL — no background, no border, no pill radius. Just the
   muted date text; the separators keep their .hdr-date-sep styling. */
.sadhana-wrap .hdr-date{
  display:inline-flex;align-items:center;padding:2px 4px 2px 0;
  border-radius:0;background:transparent;border:none;
  font-size:12px;font-weight:500;color:var(--text-muted);white-space:nowrap;
  letter-spacing:.01em;margin-left:8px;
}
body.rtl .hdr-date{margin-left:0;margin-right:8px}
.sadhana-wrap .hdr-date-sep{color:var(--border2);margin:0 7px;font-size:9px;font-weight:300}

/* ─── Subbar ───────────────────────────────────── */
.sadhana-wrap .subbar-wrap{background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
/* subbar-inner defined below */
/* subbar: filter tags only, calendar is in user menu */
.sadhana-wrap .subbar-inner{display:flex;align-items:center;gap:6px;padding:6px 22px;max-width:1440px;margin:0 auto;flex-wrap:wrap}
.sadhana-wrap .filter-tags{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.sadhana-wrap .ftag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid transparent;transition:all .2s;user-select:none;font-family:inherit;background:none}
/* Batch s (2026-09): "All tasks" chip is background-free — recognized by weight +
   color, no teal fill (the tag chips below keep their quiet tint rules). */
.sadhana-wrap .ftag.all{background:transparent;border-color:transparent;color:var(--text-muted)}
.sadhana-wrap .ftag.all:hover{background:transparent;border-color:transparent;color:var(--text)}
.sadhana-wrap .ftag.all.active{background:transparent;border-color:transparent;color:var(--text);font-weight:600}
/* (2026-08-29 quadrant-focus chip removed in session 9 — the swipeable carousel
   replaced the mobile focus view; see the SWIPEABLE QUADRANT CAROUSEL blocks.) */
/* filter tags — monochrome, emoji kept, no color coding.
   2026-09-02 user request: no background fills — quiet text pills; only the active
   filter carries a tint so the current filter stays recognizable. */
.sadhana-wrap .ftag-w, .sadhana-wrap .ftag-p, .sadhana-wrap .ftag-sg, .sadhana-wrap .ftag-so, .sadhana-wrap .ftag-h{
  background:transparent;color:var(--text-muted);
}
.sadhana-wrap .ftag-w.active, .sadhana-wrap .ftag-w:hover
.sadhana-wrap .ftag-p.active, .sadhana-wrap .ftag-p:hover
.sadhana-wrap .ftag-sg.active, .sadhana-wrap .ftag-sg:hover
.sadhana-wrap .ftag-so.active, .sadhana-wrap .ftag-so:hover
.sadhana-wrap .ftag-h.active, .sadhana-wrap .ftag-h:hover{
  background:transparent;color:var(--text);border-color:var(--border2);
}

/* ─── Matrix ───────────────────────────────────── */
/* Session-9 extra: section breathing room — the subbar and the quadrant matrix
   sat 10px apart with 10px quadrant gaps; +6px/+2px reads as clear white space
   between the board's sections without wasting phone height (see ≤740 block).
   Session-10 (user report: "sections of to-do-list still cramped"): doubled down —
   quadrant gap 12→20px, mat-outer block padding 16/14 → 22/18 so the subbar and the
   matrix read as distinct sections with real white space between them. */
.sadhana-wrap .mat-outer{flex:1;overflow:hidden;padding:22px 22px 18px;max-width:1440px;margin:0 auto;width:100%;display:flex;flex-direction:column}
.sadhana-wrap .mat-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:20px;flex:1;overflow:hidden}

/* ─── Quadrant ─────────────────────────────────── */
/* 2026-08-29 (user request): quadrants are MINIMAL — no per-quadrant color coding
   anywhere (borders, badges, checkboxes, add buttons all neutral). Progress-state
   coloring moved onto the TASK CARDS (see the status tokens below). */
.sadhana-wrap .quadrant{border-radius:var(--radius);border:1px solid var(--q-edge);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;transition:border-color .2s;min-height:0}
.sadhana-wrap .quadrant.drag-over{box-shadow:0 0 0 2px var(--text-dim)!important}
/* 2026-09-02 user request: minimal hero — no fill, no divider; the quadrant title block
   floats on the quadrant surface. */
.sadhana-wrap .q-hero{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:transparent;border-bottom:none;gap:10px;flex-shrink:0}
.sadhana-wrap .q-big{font-size:19px;line-height:1;user-select:none;flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--surface);border:1px solid var(--border);transition:all .2s}
.sadhana-wrap .quadrant:hover .q-big{background:var(--surface2);border-color:var(--border2)}
/* RTL grid flips columns so Q1/Q3 swap sides naturally */
body.rtl .mat-grid{direction:rtl}
.sadhana-wrap .q-hero-txt{flex:1;min-width:0}
.sadhana-wrap .q-title-row{display:flex;align-items:center;gap:5px;min-width:0}
.sadhana-wrap .q-title{font-size:12.5px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* Rename pen (2026-09-02): hidden until the header is hovered, then a soft pencil
   appears next to the quadrant name — click to rename + change the symbol. */
.sadhana-wrap .q-pen{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--text-dim);opacity:0;transition:opacity .15s,background .15s,color .15s,border-color .15s;flex-shrink:0;padding:0}
.sadhana-wrap .q-title-row:hover .q-pen,.sadhana-wrap .q-hero:focus-within .q-pen,.sadhana-wrap .q-pen:focus-visible{opacity:1}
.sadhana-wrap .q-pen:hover{background:var(--surface);border-color:var(--border2);color:var(--text)}
.sadhana-wrap .q-pen-svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* custom SVG quadrant symbols (glyph ids chosen on the dashboard render as strokes) */
.sadhana-wrap .q-big-svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (pointer:coarse){.sadhana-wrap .q-pen{opacity:.75}} /* touch: no hover — keep it visible */
/* Rename + symbol popover (2026-09-02) */
.sadhana-wrap .qe-ov{position:fixed;inset:0;z-index:550;display:none}
.sadhana-wrap .qe-ov.open{display:block}
.sadhana-wrap .qe-pop{position:fixed;z-index:551;display:none;flex-direction:column;gap:9px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:12px;width:280px;max-width:calc(100vw - 20px)}
.sadhana-wrap .qe-pop.open{display:flex}
.sadhana-wrap .qe-row{display:flex;gap:8px;align-items:center}
/* F5 (session 9, sibling): same bug class as .dash-style-emoji — the global button{}
   paints emoji glyphs --btn-text (white); on the surface2 tile that's 1.1:1. --text
   makes the glyph visible; color-emoji fonts ignore it. */
.sadhana-wrap .qe-emo{width:40px;height:40px;font-size:20px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:inherit}
.sadhana-wrap .qe-emo:hover{border-color:var(--accent)}
.sadhana-wrap .qe-name{flex:1;min-width:0;font-family:inherit;font-size:13px;padding:9px 11px;border-radius:10px;border:1.5px solid var(--border2);background:var(--surface);color:var(--text);outline:none}
.sadhana-wrap .qe-name:focus{border-color:var(--accent)}
.sadhana-wrap .qe-acts{display:flex;gap:8px;justify-content:flex-end}
.sadhana-wrap .q-sub{font-size:10px;color:var(--text-muted);margin-top:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sadhana-wrap .q-hero-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
/* count reads as quiet plain text (minimal, 2026-09-02) — no pill fill */
.sadhana-wrap .q-cnt{font-size:10.5px;font-weight:700;color:var(--text-muted);white-space:nowrap;letter-spacing:.01em}
.sadhana-wrap .zen-btn{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border2);background:transparent;font-size:12px;color:var(--text-dim);transition:all .15s}
.sadhana-wrap .zen-btn:hover{background:var(--surface);color:var(--text)}

/* ─── Task body + scroll indicator ────────────── */
.sadhana-wrap .q-body-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.sadhana-wrap .q-body{padding:7px 9px;flex:1;display:flex;flex-direction:column;gap:5px;overflow-y:auto;min-height:0}
.sadhana-wrap .more-indicator{
  display:none;position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,var(--surface) 60%);
  padding:18px 12px 6px;pointer-events:none;
  align-items:center;justify-content:center;
}
.sadhana-wrap .more-indicator.show{display:flex}
.sadhana-wrap .more-badge{
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:20px;padding:3px 10px;font-size:10.5px;
  color:var(--text-muted);font-weight:600;pointer-events:all;
  cursor:pointer;transition:all .15s;
}
.sadhana-wrap .more-badge:hover{background:var(--surface);color:var(--text)}

/* ─── Task card ────────────────────────────────── */
.sadhana-wrap .task-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;display:flex;align-items:flex-start;gap:8px;cursor:grab;transition:all .2s;animation:sIn .2s ease}
/* 2026-09-02 user request: no hover lift/shadow on task cards — a quiet border shift only */
.sadhana-wrap .task-card:hover{border-color:var(--border2)}
.sadhana-wrap .task-card.dragging{opacity:.3;cursor:grabbing}
.sadhana-wrap .task-card.done .task-txt{text-decoration:line-through;opacity:.45}
.sadhana-wrap .task-card.removing{animation:cOut .35s ease forwards;pointer-events:none}
@keyframes sIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes cOut{0%{opacity:1;max-height:120px;padding:8px 10px}60%{opacity:0}100%{opacity:0;max-height:0;padding:0;border-width:0}}
.sadhana-wrap .t-emoji{font-size:18px;line-height:1;flex-shrink:0;cursor:pointer;transition:transform .15s;user-select:none;margin-top:1px}
.sadhana-wrap .t-emoji:hover{transform:scale(1.25)}
.sadhana-wrap .t-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;cursor:pointer;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:10px;color:#fff;margin-top:2px}
.sadhana-wrap .t-check.chk{background:var(--text-dim);border-color:var(--text-dim)}
/* ─── Task progress-state coloring (2026-08-29 user request) ─────────────
   Quadrants are neutral now; the CARD carries its progression level:
   untouched = muted grey · in progress = pastel orange · on hold = soft violet
   (2026-09-09 (x): the pastel yellow #E9C46A read too close to the orange —
   Ali: "orange and yellow are not different enough" — معلق moves to a cool
   violet #A78BFA so the two active-ish states never read as one). */
.sadhana-wrap{--st-none:#9CA3AF;--st-none-bg:rgba(156,163,175,.10);--st-none-bd:rgba(156,163,175,.38);--st-inprog:#F59A4E;--st-inprog-bg:rgba(245,154,78,.14);--st-inprog-bd:rgba(245,154,78,.55);--st-hold:#A78BFA;--st-hold-bg:rgba(167,139,250,.14);--st-hold-bd:rgba(167,139,250,.5)}
.sadhana-wrap .task-card.st-untouched{background:var(--st-none-bg);border-color:var(--st-none-bd)}
.sadhana-wrap .task-card.st-inprog{background:var(--st-inprog-bg);border-color:var(--st-inprog-bd);border-inline-start:3px solid var(--st-inprog)}
.sadhana-wrap .task-card.st-hold{background:var(--st-hold-bg);border-color:var(--st-hold-bd);border-inline-start:3px solid var(--st-hold)}
.sadhana-wrap .t-content{flex:1;min-width:0}
.sadhana-wrap .task-txt{font-size:12.5px;line-height:1.45;word-break:break-word;display:inline;color:var(--text-muted)}
/* Title + icon tags on same line */
.sadhana-wrap .task-title-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0;line-height:1.45}
.sadhana-wrap .task-tags{display:inline-flex;gap:2px;align-items:center;flex-shrink:0;margin-left:1px}
body.rtl .task-tags{margin-left:0;margin-right:1px}
.sadhana-wrap .task-tag{font-size:12px;line-height:1;opacity:.45;transition:opacity .15s;cursor:default;user-select:none}
.sadhana-wrap .task-tag:hover{opacity:.8}
.sadhana-wrap .t-meta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.sadhana-wrap .tdl{font-size:10.5px;color:var(--text-muted);display:flex;align-items:center;gap:2px}
.sadhana-wrap .tdl.overdue{color:var(--q3);font-weight:600}.tdl.fuzzy{color:var(--accent)}
.sadhana-wrap .t-actions{display:flex;flex-direction:column;gap:3px;opacity:0;transition:opacity .15s;flex-shrink:0}
.sadhana-wrap .task-card:hover .t-actions{opacity:1}
.sadhana-wrap .t-act{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;font-size:12px;color:var(--text-muted);transition:all .15s}
.sadhana-wrap .t-act.del:hover{background:var(--q3-l);color:var(--q3)}.t-act.edt:hover{background:var(--accent-l);color:var(--accent)}.t-act.undo:hover{background:var(--accent-l);color:var(--accent)}

/* ─── Overdue task visual treatment ───────────── */
@keyframes overdueShake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-4px)}
  30%{transform:translateX(4px)}
  45%{transform:translateX(-3px)}
  60%{transform:translateX(3px)}
  80%{transform:translateX(-1px)}
}
.sadhana-wrap .task-card.overdue-dl{
  border-left:3px solid var(--q3)!important;
  background:linear-gradient(to right,rgba(229,57,53,.08),var(--surface2))!important;
  animation:sIn .2s ease,overdueShake .5s ease .2s;
}

/* ─── Inline update/notes panel ────────────────── */
.sadhana-wrap .upd-toggle{
  display:inline-flex;align-items:center;gap:3px;
  margin-top:5px;padding:2px 7px 2px 5px;
  border-radius:20px;border:1px solid var(--border2);
  background:var(--surface);font-size:10px;font-weight:600;
  color:var(--text-dim);cursor:pointer;transition:all .18s;
  font-family:inherit;
}
.sadhana-wrap .upd-toggle:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.sadhana-wrap .upd-toggle.has-notes{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.sadhana-wrap .upd-toggle .upd-ico{font-size:11px}
.sadhana-wrap .upd-panel{
  display:none;flex-direction:column;gap:0;
  margin-top:6px;border-radius:var(--radius-sm);
  border:1px solid var(--border2);background:var(--surface2);
  overflow:hidden;animation:sIn .15s ease;
}
.sadhana-wrap .upd-panel.open{display:flex}
.sadhana-wrap .upd-list{display:flex;flex-direction:column;}
.sadhana-wrap .upd-row{
  display:flex;align-items:flex-start;gap:8px;
  padding:7px 10px;border-bottom:1px solid var(--border);
  font-size:11px;line-height:1.45;
}
.sadhana-wrap .upd-row:last-child{border-bottom:none}
.sadhana-wrap .upd-ts{color:var(--text-dim);font-size:9.5px;white-space:nowrap;margin-top:1px;flex-shrink:0}
.sadhana-wrap .upd-text{flex:1;color:var(--text);word-break:break-word}
/* note EDIT (2026-09-02): ✎ swaps the row into an inline input — notes are now
   addable, deletable AND editable in place. */
.sadhana-wrap .upd-edit{
  width:16px;height:16px;border-radius:3px;border:none;background:transparent;
  color:var(--text-dim);cursor:pointer;font-size:10px;line-height:1;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  padding:0;transition:all .15s;margin-inline-end:1px;
}
.sadhana-wrap .upd-edit:hover{color:var(--accent);background:var(--accent-l)}
.sadhana-wrap .upd-save{color:var(--accent)}
.sadhana-wrap .upd-edit-inp{
  flex:1;min-width:0;font-family:inherit;font-size:11px;color:var(--text);
  padding:3px 8px;border-radius:6px;outline:none;
  border:1.5px solid var(--accent);background:var(--surface);
}
.sadhana-wrap .upd-del{
  width:16px;height:16px;border-radius:3px;border:none;background:transparent;
  color:var(--text-dim);cursor:pointer;font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  padding:0;transition:all .15s;
}
.sadhana-wrap .upd-del:hover{color:var(--q3);background:var(--q3-l)}
.sadhana-wrap .upd-empty{padding:8px 10px;font-size:10.5px;color:var(--text-dim);font-style:italic;text-align:center}
.sadhana-wrap .upd-add-row{
  display:flex;gap:0;border-top:1px solid var(--border);
}
.sadhana-wrap .upd-inp{
  flex:1;background:transparent;border:none;outline:none;
  padding:8px 10px;font-size:11.5px;font-family:inherit;color:var(--text);
}
.sadhana-wrap .upd-inp::placeholder{color:var(--text-dim)}
.sadhana-wrap .upd-add-btn{
  padding:0 12px;border:none;background:var(--accent);color:#fff;
  font-size:13px;font-weight:700;cursor:pointer;border-radius:0;
  transition:opacity .15s;
}
.sadhana-wrap .upd-add-btn:hover{opacity:.85}
.sadhana-wrap .upd-add-btn:disabled{opacity:.55;cursor:wait}


.sadhana-wrap .task-edit-form{display:none;flex-direction:column;gap:6px;padding:8px 10px;background:var(--surface2);border:1.5px solid var(--accent);border-radius:var(--radius-sm);animation:sIn .15s ease}
.sadhana-wrap .task-edit-form.vis{display:flex}
.sadhana-wrap .edit-input{background:var(--surface);border:1px solid var(--border2);border-radius:7px;padding:7px 10px;color:var(--text);font-size:12.5px;font-family:inherit;outline:none;width:100%;resize:none}
.sadhana-wrap .edit-input:focus{border-color:var(--accent)}
.sadhana-wrap .edit-acts{display:flex;gap:5px;justify-content:flex-end}

/* ─── Done section ─────────────────────────────── */
.sadhana-wrap .done-div{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-dim);font-weight:500;padding:3px 2px;cursor:pointer;user-select:none}
.sadhana-wrap .done-div:hover{color:var(--text-muted)}
.sadhana-wrap .done-line{flex:1;height:1px;background:var(--border)}
.sadhana-wrap .done-arrow{transition:transform .25s;display:inline-block}.done-arrow.open{transform:rotate(90deg)}

/* ─── Add form ─────────────────────────────────── */
/* (l) 2026-09-06: the full-width add button is GONE — a circular + FAB now sits in
   the quadrant's bottom corner (inset-inline-end: LEFT edge in RTL / RIGHT in LTR —
   the same logical-property convention as the dashboard quick-add FAB). The strip
   keeps a fixed min-height so the FAB never covers task cards or the more-badge;
   opening the reveal form hides the FAB and expands the strip.
   (m) 2026-09-06 restyle — "smaller, no shadow, no green fill, border only + ＋":
   44px→36px, transparent ground, thin neutral ring, zero box-shadow; hover lights
   the ring accent instead of lifting a shadow. */
.sadhana-wrap .q-foot{padding:8px 10px;flex-shrink:0;border-top:1px solid var(--border);position:relative;min-height:53px;display:flex;align-items:center}
.sadhana-wrap .q-fab{
  position:absolute;bottom:8px;inset-inline-end:8px;z-index:20;
  display:inline-grid;place-items:center;
  width:36px;height:36px;padding:0;border:1.5px solid var(--border2);border-radius:50%;
  background:transparent;color:var(--text-dim);font-size:17px;line-height:1;font-family:inherit;
  cursor:pointer;
  transition:transform .12s ease, border-color .15s ease, color .15s ease;
}
.sadhana-wrap .q-fab:hover{border-color:var(--accent);color:var(--accent)}
.sadhana-wrap .q-fab:active{transform:scale(.94)}
.sadhana-wrap .q-fab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sadhana-wrap .q-foot .add-form{width:100%}
/* zen overlay + legacy: the old full-width add button still styles (zen footer) */
.sadhana-wrap .add-btn{
  width:100%;
  border-radius:11px;
  padding:9px 14px;
  font-size:12px;font-weight:500;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:all .22s;font-family:inherit;
  /* default: visible square with faint stroke + lift shadow */
  background:var(--surface);
  border:1px solid var(--border2);
  color:var(--text-dim);
  box-shadow:0 1px 4px rgba(30,20,10,.06), 0 0 0 0 transparent;
  opacity:1;
}
/* One neutral hover for every quadrant's add button (was four per-quadrant tints) */
.sadhana-wrap .add-btn:hover, .sadhana-wrap .add-btn:focus{
  transform:translateY(-1px);
  color:var(--text);border-color:var(--text-dim);background:var(--surface);
  box-shadow:0 4px 14px rgba(30,20,10,.11), 0 1px 3px rgba(30,20,10,.07);
}
/* Plus icon — slightly larger */
.sadhana-wrap .add-btn-lbl{font-size:12px;font-weight:500}
.sadhana-wrap .add-form{display:none;flex-direction:column;gap:6px;animation:sIn .15s ease}
.sadhana-wrap .add-form.vis{display:flex}
.sadhana-wrap .ai{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:7px 10px;color:var(--text);font-size:12.5px;font-family:inherit;outline:none;transition:border-color .2s;width:100%;resize:none}
.sadhana-wrap .ai:focus{border-color:var(--text-dim)}
.sadhana-wrap .emo-row{display:flex;align-items:center;gap:8px}
.sadhana-wrap .ch-emo{font-size:22px;cursor:pointer;transition:transform .2s;user-select:none;line-height:1}.ch-emo:hover{transform:scale(1.2)}
.sadhana-wrap .emo-hint{font-size:10.5px;color:var(--text-dim)}
.sadhana-wrap .form-acts{display:flex;gap:5px;justify-content:flex-end}
.sadhana-wrap .form-lbl{font-size:10.5px;font-weight:600;color:var(--text-muted);margin-bottom:3px;display:block;text-transform:uppercase;letter-spacing:.05em}
.sadhana-wrap .tag-picker{display:flex;flex-wrap:wrap;gap:4px}
/* Phase 6 item 13: the quick form's label row — same chips as the modal picker */
.sadhana-wrap .ftp-row{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0}
.sadhana-wrap .tp-tag{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid transparent;transition:all .18s;user-select:none;font-family:inherit;background:none}
.sadhana-wrap .tp-tag.w{background:var(--tw-l);color:var(--tw)}.tp-tag.p{background:var(--tp-l);color:var(--tp)}.tp-tag.sg{background:var(--tsg-l);color:var(--tsg)}.tp-tag.so{background:var(--tso-l);color:var(--tso)}.tp-tag.h{background:var(--th-l);color:var(--th)}
.sadhana-wrap .tp-tag.w.sel{border-color:var(--tw)}.tp-tag.p.sel{border-color:var(--tp)}.tp-tag.sg.sel{border-color:var(--tsg)}.tp-tag.so.sel{border-color:var(--tso)}.tp-tag.h.sel{border-color:var(--th)}

/* ─── Deadline button (trigger) ────────────────── */
.sadhana-wrap .dl-trigger{
  display:flex;align-items:center;gap:6px;padding:6px 10px;
  border-radius:var(--radius-sm);border:1.5px solid var(--border2);
  background:var(--surface);cursor:pointer;font-size:11.5px;
  color:var(--text-muted);font-family:inherit;transition:all .15s;width:100%;
}
.sadhana-wrap .dl-trigger:hover{border-color:var(--accent);color:var(--link)}
/* F14 (session 9): has-val text was --accent (2.7:1 on the tint chip) — --link is the
   text-safe teal (≈4.8:1 on the same chip); the ✕ clear glyph inherits it too. */
.sadhana-wrap .dl-trigger.has-val{color:var(--link);border-color:var(--accent);background:var(--accent-l)}
.sadhana-wrap .dl-trigger-ico{font-size:14px}
.sadhana-wrap .dl-trigger-clr{margin-left:auto;font-size:13px;cursor:pointer;opacity:.6;transition:opacity .15s}
.sadhana-wrap .dl-trigger-clr:hover{opacity:1}
body.rtl .dl-trigger-clr{margin-left:0;margin-right:auto}

/* ─── Deadline popup (fixed, never clipped) ────── */
.sadhana-wrap .dl-popup{
  position:fixed;z-index:600;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;box-shadow:var(--shadow-lg);
  width:320px;display:none;flex-direction:column;overflow:hidden;
  animation:mIn .15s ease;
}
.sadhana-wrap .dl-popup.open{display:flex}
.sadhana-wrap .dl-popup-tabs{display:flex;border-bottom:1px solid var(--border)}
.sadhana-wrap .dl-ptab{flex:1;padding:9px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-muted);font-family:inherit;transition:all .15s;text-align:center}
.sadhana-wrap .dl-ptab.active{background:var(--surface2);color:var(--text);font-weight:700}

/* Fuzzy options inside popup */
.sadhana-wrap .dl-fuzzy-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:10px}
.sadhana-wrap .fuz-opt{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-radius:var(--radius-sm);cursor:pointer;font-size:11.5px;
  border:1.5px solid var(--border);background:transparent;
  color:var(--text);font-family:inherit;transition:all .15s;text-align:left;
}
body.rtl .fuz-opt{text-align:right}
.sadhana-wrap .fuz-opt:hover{border-color:var(--border2);background:var(--surface2)}
.sadhana-wrap .fuz-opt.sel{border-color:var(--accent);background:var(--accent-l);color:var(--accent)}
.sadhana-wrap .fuz-ico{font-size:14px;flex-shrink:0}

/* Step-by-step date picker */
.sadhana-wrap .step-picker{padding:10px}
.sadhana-wrap .step-nav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.sadhana-wrap .step-pill{padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:600;background:var(--surface2);border:1px solid var(--border2);color:var(--text-dim);cursor:pointer;transition:all .15s}
.sadhana-wrap .step-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sadhana-wrap .step-pill.done{background:var(--accent-l);border-color:var(--accent);color:var(--accent)}
.sadhana-wrap .step-arrow{color:var(--text-dim);font-size:11px}
.sadhana-wrap .step-content{}
.sadhana-wrap .year-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sadhana-wrap .month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.sadhana-wrap .day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.sadhana-wrap .pick-btn{
  padding:8px 6px;border-radius:8px;font-size:12px;font-weight:500;
  cursor:pointer;border:1.5px solid var(--border);background:transparent;
  color:var(--text);font-family:inherit;transition:all .15s;text-align:center;
}
.sadhana-wrap .pick-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.sadhana-wrap .pick-btn.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.sadhana-wrap .pick-btn.disabled{opacity:.25;cursor:not-allowed}
.sadhana-wrap .pick-btn.today-marker{border-color:var(--q3);color:var(--q3)}
.sadhana-wrap .day-header{font-size:9.5px;color:var(--text-dim);text-align:center;padding:3px 0;font-weight:600}
.sadhana-wrap .step-selected-display{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:7px;text-align:center}
.sadhana-wrap .dl-popup-foot{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border);justify-content:flex-end}

/* ─── Emoji picker ─────────────────────────────── */
.sadhana-wrap .ep-ov{display:none;position:fixed;inset:0;z-index:500}.ep-ov.open{display:block}

/* ─── Zen mode ─────────────────────────────────── */
.sadhana-wrap .zen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);z-index:400}
.sadhana-wrap .zen-overlay.open{display:block}
.sadhana-wrap .zen-card{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:401;width:min(680px,96vw);height:min(82vh,680px);background:var(--surface);border-radius:20px;border:1px solid var(--border2);box-shadow:var(--shadow-lg);flex-direction:column;overflow:hidden;animation:mIn .25s ease}
.sadhana-wrap .zen-card.open{display:flex}
.sadhana-wrap .zen-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;background:var(--surface2);border-bottom:1px solid var(--border);gap:12px;flex-shrink:0}
.sadhana-wrap .zen-big{font-size:50px;line-height:1;flex-shrink:0}
.sadhana-wrap .zen-title-block{flex:1}
.sadhana-wrap .zen-title{font-size:17px;font-weight:700}
.sadhana-wrap .zen-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.sadhana-wrap .zen-close{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border2);background:transparent;font-size:16px;color:var(--text-muted);transition:all .15s}
.sadhana-wrap .zen-close:hover{background:var(--q3-l);color:var(--q3)}
.sadhana-wrap .zen-body{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.sadhana-wrap .zen-footer{padding:8px 16px 14px;flex-shrink:0;border-top:1px solid var(--border)}

/* ─── Quick add modal ──────────────────────────── */
.sadhana-wrap .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);z-index:300;align-items:center;justify-content:center}.modal-bg.open{display:flex}
.sadhana-wrap .modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:22px;width:480px;max-width:calc(100vw - 32px);box-shadow:var(--shadow-lg);animation:mIn .2s ease;max-height:90vh;overflow-y:auto}
@keyframes mIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.sadhana-wrap .mtitle{font-size:16px;font-weight:700;margin-bottom:3px}.msub{font-size:12px;color:var(--text-muted);margin-bottom:14px}
.sadhana-wrap .mlbl{font-size:10.5px;color:var(--text-muted);margin-bottom:5px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sadhana-wrap .mfield{margin-bottom:12px}
.sadhana-wrap .sel-in{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:12.5px;font-family:inherit;outline:none;width:100%;cursor:pointer}
.sadhana-wrap .m-acts{display:flex;gap:7px;justify-content:flex-end;margin-top:5px}
.sadhana-wrap .mep-btn{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--surface2);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all .2s;flex-shrink:0}.mep-btn:hover{border-color:var(--text-dim);transform:scale(1.05)}
.sadhana-wrap .mrow{display:flex;gap:8px;align-items:flex-start}
.sadhana-wrap .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:8px;opacity:.78}
.sadhana-wrap .ei{font-size:22px;color:var(--accent);opacity:.9}.et{font-size:12px;color:var(--muted);line-height:1.5;text-align:center}.et-hint{font-size:10.5px;color:var(--text-dim);opacity:.9}

/* ─── Undo toast ───────────────────────────────── */
.sadhana-wrap .undo-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--surface);
  padding:10px 18px;border-radius:30px;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:10px;z-index:700;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  transition:transform .3s cubic-bezier(.16,1,.3,1);pointer-events:none;
}
.sadhana-wrap .undo-toast.show{transform:translateX(-50%) translateY(0);pointer-events:all}
.sadhana-wrap .undo-btn{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}

/* ─── Pin button ────────────────────────────────────── */
.sadhana-wrap .t-act.pin{color:var(--text-dim);font-size:13px}
.sadhana-wrap .t-act.pin.pinned{color:#f59e0b}
.sadhana-wrap .task-card.is-pinned{border-left:3px solid #f59e0b!important}
.sadhana-wrap .pin-badge{font-size:10px;color:#f59e0b;margin-left:3px;vertical-align:middle}

/* ─── Within-quadrant drag-over-card indicator ──────── */
.sadhana-wrap .task-card.drag-target-above{border-top:2.5px solid var(--accent)!important;margin-top:-2px}
.sadhana-wrap .task-card.drag-target-below{border-bottom:2.5px solid var(--accent)!important}

/* ─── Progress track — 3 always-visible state dots ─ */
.sadhana-wrap .prog-track{
  display:inline-flex;align-items:center;gap:3px;margin-top:5px;
  padding:3px 6px 3px 5px;border-radius:20px;
  border:1px solid var(--border);background:var(--surface);
  cursor:default;
}
.sadhana-wrap .prog-dot{
  width:10px;height:10px;border-radius:50%;
  border:1.5px solid var(--border2);background:transparent;
  cursor:pointer;transition:all .18s;flex-shrink:0;position:relative;
}
.sadhana-wrap .prog-dot:hover{transform:scale(1.35);border-color:var(--text-dim)}
/* State: untouched — muted grey */
.sadhana-wrap .prog-dot.p-untouched.p-active{background:var(--st-none);border-color:var(--st-none)}
/* State: in_progress — pastel orange + soft pulse */
.sadhana-wrap .prog-dot.p-inprog.p-active{
  background:var(--st-inprog);border-color:var(--st-inprog);
  animation:dotPulse 1.8s ease-in-out infinite;
}
/* State: on_hold — pastel yellow, no animation (halted = static) */
.sadhana-wrap .prog-dot.p-hold.p-active{background:var(--st-hold);border-color:var(--st-hold)}
/* Label */
.sadhana-wrap .prog-lbl{
  font-size:9px;font-weight:700;letter-spacing:.03em;
  color:var(--text-dim);margin-inline-start:3px;transition:color .18s;
  white-space:nowrap;
}
.sadhana-wrap .prog-track:has(.p-inprog.p-active) .prog-lbl{color:var(--st-inprog)}
.sadhana-wrap .prog-track:has(.p-hold.p-active) .prog-lbl{color:var(--st-hold)}
@keyframes dotPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(245,154,78,.45)}
  50%{box-shadow:0 0 0 4px rgba(245,154,78,0)}
}

/* ─── Note preview ─────────────────────────────── */
.sadhana-wrap .task-note-preview{font-size:10.5px;color:var(--text-dim);font-style:italic;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;transition:color .15s;}
.sadhana-wrap .task-note-preview:hover{color:var(--text-muted)}

/* ─── Recurring badge on card ──────────────────── */
.sadhana-wrap .recur-badge{display:inline-flex;align-items:center;gap:2px;font-size:9.5px;color:var(--accent);background:var(--accent-l);border-radius:4px;padding:1px 5px;font-weight:600;margin-top:2px}

/* ─── Recurring configurator ────────────────────── */
.sadhana-wrap .recur-toggle-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.sadhana-wrap .recur-switch{position:relative;width:36px;height:20px;flex-shrink:0}
.sadhana-wrap .recur-switch input{opacity:0;width:0;height:0;position:absolute}
.sadhana-wrap .recur-slider{position:absolute;inset:0;border-radius:20px;background:var(--border2);cursor:pointer;transition:background .2s}
.sadhana-wrap .recur-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sadhana-wrap .recur-switch input:checked+.recur-slider{background:var(--accent)}
.sadhana-wrap .recur-switch input:checked+.recur-slider::before{transform:translateX(16px)}
.sadhana-wrap .recur-toggle-lbl{font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;user-select:none}
.sadhana-wrap .recur-toggle-sub{font-size:10.5px;color:var(--text-dim)}

.sadhana-wrap .recur-config{margin-top:8px;display:flex;flex-direction:column;gap:8px;animation:sIn .15s ease}
.sadhana-wrap .recur-type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.sadhana-wrap .recur-type-btn{padding:6px 4px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);background:transparent;color:var(--text-muted);font-family:inherit;transition:all .15s;text-align:center}
.sadhana-wrap .recur-type-btn.sel{border-color:var(--accent);background:var(--accent-l);color:var(--accent)}
.sadhana-wrap .recur-type-btn:hover:not(.sel){border-color:var(--border2);background:var(--surface2)}

.sadhana-wrap .recur-sub{display:flex;flex-direction:column;gap:6px}
.sadhana-wrap .recur-day-grid{display:flex;gap:4px;flex-wrap:wrap}
.sadhana-wrap .recur-day-btn{width:32px;height:32px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border2);background:transparent;color:var(--text-muted);font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center}
.sadhana-wrap .recur-day-btn.sel{border-color:var(--accent);background:var(--accent);color:#fff}
.sadhana-wrap .recur-day-btn:hover:not(.sel){border-color:var(--border2);background:var(--surface2);color:var(--text)}

.sadhana-wrap .recur-n-row{display:flex;align-items:center;gap:8px}
.sadhana-wrap .recur-n-input{width:60px;padding:6px 8px;background:var(--surface);border:1.5px solid var(--border2);border-radius:8px;color:var(--text);font-size:13px;font-weight:600;font-family:inherit;outline:none;text-align:center}
.sadhana-wrap .recur-n-input:focus{border-color:var(--accent)}
.sadhana-wrap .recur-n-lbl{font-size:11.5px;color:var(--text-muted)}
/* m-adv-toggle removed — all modal fields always visible */
/* slideUp animation for mobile modal sheets — must be outside @media to parse correctly */
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* Desktop (>740px): carousel guidance chrome is mobile-only — hidden by this BASE
   rule, re-enabled by the ≤740px blocks BELOW. (Must precede them in source —
   same specificity, later wins; declaring it after the media blocks kept the
   dots/hint hidden at every width. Caught by computed-style measurement.) */
@media(min-width:741px){
  .sadhana-wrap .quad-dots,.sadhana-wrap .swipe-hint{display:none}
}
/* ═══════════════════════════════════════════════════
   MOBILE RESPONSIVE — 740px and below
   ═══════════════════════════════════════════════════ */
@media(max-width:740px){
  /* Session-9 (swipeable board): the full-page natural-scroll unlock is GONE — the
     carousel needs the fixed desktop shell (body flex column, page-shell overflow
     hidden, mat-outer flex:1) so each slide is exactly the viewport area and task
     lists scroll INSIDE their quadrant, exactly like the desktop 2×2 board. */

  /* ── Toolbar (old header gone; unified chrome rules) ── */
  .sadhana-wrap .hdr-date{display:none}   /* hide date pill on mobile */
  .sadhana-wrap .btn{padding:5px 10px;font-size:11.5px;min-height:34px}
  .sadhana-wrap .btn-primary{padding:6px 12px}

  /* ── Sub-bar horizontal scroll ────────────────── */
  /* Sticky at the viewport top: the Hibana topbar is display:none ≤1024px (app.css
     header-less chrome cut), so nothing sits above the subbar at any phone or
     tablet-portrait width — it pins cleanly to the top edge. */
  .sadhana-wrap .subbar-wrap{position:sticky;top:0;z-index:190}
  .sadhana-wrap .subbar-inner{overflow-x:auto;flex-wrap:nowrap;padding:5px 12px;gap:5px;-webkit-overflow-scrolling:touch}
  .sadhana-wrap .subbar-inner::-webkit-scrollbar{display:none}
  .sadhana-wrap .filter-tags{flex-wrap:nowrap;gap:4px}
  .sadhana-wrap .ftag{white-space:nowrap;padding:4px 9px}
  /* F13 (session 9): ≥40px chip targets on touch — chips sit ADJACENT (4px gaps),
     so a padded pseudo-element would overlap the neighbors; a real min-height
     keeps every zone honest. The subbar row grows ~10px — the carousel layout
     absorbs it. */
  .sadhana-wrap .ftag{min-block-size:40px;padding-block:9px}
}

/* The rest of the ≤740px block — kept as its own query so the subbar pinning rules
   above stay readable. Everything here is board layout on phones. */
@media(max-width:740px){
  /* ══ SWIPEABLE QUADRANT CAROUSEL (session 9, user request) ══
     The old phone layout showed two half-width quadrants per row (2026-08-29 focus
     view) — cramped cards, cramped headers, UI problems. Now the matrix is a
     horizontal scroll-snap carousel: ONE full-width quadrant per slide, thumb-swipe
     to move, scroll-snap-stop:always so a flick lands exactly one quadrant over.
     Task lists keep the desktop behavior (scroll INSIDE the quadrant + the “↓ more”
     indicator) because each slide is the full viewport area. Desktop (>740px) keeps
     the 2×2 grid; the zen overlay is outside .mat-grid and is never affected. */
  .sadhana-wrap .mat-outer{position:relative;padding:14px 10px 10px!important;max-width:100%!important}
  .sadhana-wrap .mat-grid{
    display:flex!important;
    grid-template-columns:none!important;grid-template-rows:none!important;
    overflow-x:auto!important;overflow-y:hidden!important;
    scroll-snap-type:x mandatory!important;
    gap:12px!important;
    flex:1!important;min-height:0!important;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .sadhana-wrap .mat-grid::-webkit-scrollbar{display:none}
  .sadhana-wrap .mat-grid .quadrant{
    flex:0 0 100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    min-width:0;
  }
  .sadhana-wrap .mat-grid .sadhana-loading{flex:none}

  /* ── Dot indicators (visual guidance #1): 4 tappable dots under the carousel —
     active dot = visible quadrant; tap a dot to jump. The 26px button + -7px inset
     pseudo-element gives a ≥40px hit target (WCAG 2.5.8) while the dot stays 7px. */
  .sadhana-wrap .quad-dots{
    flex:none;display:flex;justify-content:center;align-items:center;
    gap:14px;padding:6px 0 2px;
  }
  .sadhana-wrap .quad-dot{
    position:relative;width:26px;height:26px;padding:0;
    background:transparent!important;border:0;border-radius:50%;
    cursor:pointer;min-width:0;min-height:0;font-size:0;line-height:0;
  }
  .sadhana-wrap .quad-dot::after{
    content:"";position:absolute;inset:-7px;border-radius:50%;
  }
  .sadhana-wrap .quad-dot::before{
    content:"";position:absolute;inset-inline-start:50%;inset-block-start:50%;
    width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;
    background:var(--border2);transition:transform .18s ease,background .18s ease;
  }
  .sadhana-wrap .quad-dot.active::before{background:var(--accent);transform:scale(1.7)}
  .sadhana-wrap .quad-dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ── Swipe hint (visual guidance #2): a one-time pill at the inline-end edge that
     pulses toward the next quadrant; removed on the first swipe or after 4s. */
  .sadhana-wrap .swipe-hint{
    position:absolute;inset-block-start:38%;inset-inline-end:10px;z-index:5;
    display:flex;align-items:center;gap:5px;
    background:var(--surface);border:1px solid var(--border2);border-radius:999px;
    box-shadow:var(--shadow-lg);color:var(--text-muted);
    font-size:10.5px;font-weight:600;padding:5px 10px;
    pointer-events:none;
    animation:hintNudge 1.6s ease-in-out infinite;
  }
  body.rtl .sadhana-wrap .swipe-hint{animation-name:hintNudgeRtl}
  @keyframes hintNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
  @keyframes hintNudgeRtl{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
  .sadhana-wrap .swipe-hint.hide{display:none}

  /* ── Quadrant header ──────────────────────────── */
  .sadhana-wrap .q-big{font-size:19px}
  .sadhana-wrap .q-hero{padding:10px 14px}
  .sadhana-wrap .q-title{font-size:12px}
  .sadhana-wrap .q-sub{font-size:9.5px}

  /* ── Task cards — bigger touch targets ────────── */
  .sadhana-wrap .task-card{padding:10px 12px;gap:10px;border-radius:10px}
  .sadhana-wrap .t-check{width:20px;height:20px;border-radius:5px;margin-top:1px;flex-shrink:0}
  .sadhana-wrap .t-emoji{font-size:20px}
  .sadhana-wrap .task-txt{font-size:13px;line-height:1.5;color:var(--text-muted)}

  /* Always show action buttons on mobile (no hover state) */
  .sadhana-wrap .t-actions{opacity:1!important}
  .sadhana-wrap .t-act{width:28px;height:28px;font-size:13px;border-radius:6px}

  /* ── Progress dots — slightly larger touch target  */
  .sadhana-wrap .prog-dot{width:13px;height:13px;border-width:2px}
  .sadhana-wrap .prog-track{padding:4px 7px 4px 6px;gap:4px}

  /* ── Inline add form ──────────────────────────── */
  .sadhana-wrap .q-foot{padding:6px 10px 10px;min-height:56px}
  .sadhana-wrap .add-btn{padding:9px 14px;font-size:12px;min-height:38px;opacity:1!important;border:1.5px dashed var(--border2)!important}
  .sadhana-wrap .add-btn .add-btn-lbl{max-width:150px!important;opacity:1!important;margin-left:5px!important}
  .sadhana-wrap .ai{padding:9px 12px;font-size:13px}
  .sadhana-wrap .emo-row{gap:10px}
  .sadhana-wrap .ch-emo{font-size:26px}
  .sadhana-wrap .form-acts{gap:6px}

  /* ── Edit form ────────────────────────────────── */
  .sadhana-wrap .task-edit-form{border-radius:10px}
  .sadhana-wrap .edit-input{padding:9px 12px;font-size:13px}

  /* ── Modals: slide up from bottom ─────────────── */
  .sadhana-wrap .modal-bg{align-items:flex-end!important;padding:0!important}
  .sadhana-wrap .modal{
    width:100%!important;max-width:100%!important;
    border-radius:20px 20px 0 0!important;
    padding:20px 18px 28px!important;
    max-height:92dvh!important;
    animation:slideUp .25s cubic-bezier(.16,1,.3,1)!important;
  }

  /* ── Deadline popup ───────────────────────────── */
  .sadhana-wrap .dl-popup{
    position:fixed!important;
    width:calc(100vw - 20px)!important;
    left:10px!important;right:10px!important;
    bottom:12px!important;top:auto!important;
    border-radius:16px!important;
  }

  /* ── Zen card: full screen ────────────────────── */
  .sadhana-wrap .zen-card{
    width:100vw!important;height:100dvh!important;
    border-radius:0!important;top:0!important;left:0!important;
    transform:none!important;
  }

  /* ── Undo toast ───────────────────────────────── */
  .sadhana-wrap .undo-toast{
    bottom:16px;left:12px;right:12px;
    transform:translateX(0) translateY(80px)!important;
    width:auto;border-radius:14px;
  }
  .sadhana-wrap .undo-toast.show{transform:translateX(0) translateY(0)!important}

  /* ── Recurring day grid: bigger taps ─────────── */
  .sadhana-wrap .recur-day-btn{width:36px;height:36px;font-size:12px}
  .sadhana-wrap .recur-type-btn{padding:8px 4px;font-size:11.5px}

}

/* Tablets 741-1024px */
@media(min-width:741px) and (max-width:1024px){
  .sadhana-wrap .q-title{font-size:11.5px}
  .sadhana-wrap .task-txt{font-size:12px}
}


/* ─── Hibana additions ─────────────────────────────────────── */
/* Focus visibility for keyboard users (Hibana a11y audit standard) */
.sadhana-wrap .task-card:focus-visible, .sadhana-wrap .quadrant:focus-visible, .sadhana-wrap button:focus-visible, .sadhana-wrap input:focus-visible, .sadhana-wrap textarea:focus-visible, .sadhana-wrap select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .sadhana-wrap .task-card.overdue-dl{animation:none!important}
}
/* Archive overlay (in-page view — Hibana's "even better" over the original's separate page) */
.sadhana-wrap .arch-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);z-index:350;overflow-y:auto;padding:28px 16px}
.sadhana-wrap .arch-ov.open{display:block}
.sadhana-wrap .arch-modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;max-width:760px;margin:0 auto;box-shadow:var(--shadow-lg);animation:mIn .2s ease;overflow:hidden}
.sadhana-wrap .arch-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--surface2);border-bottom:1px solid var(--border)}
.sadhana-wrap .arch-title{font-size:16px;font-weight:700}
.sadhana-wrap .arch-body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.sadhana-wrap .arch-stats{display:flex;gap:6px;flex-wrap:wrap}
.sadhana-wrap .arch-stat{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--border2);font-size:11.5px;font-weight:600;color:var(--text-muted)}
.sadhana-wrap .arch-stat b{color:var(--text)}
.sadhana-wrap .arch-group h4{font-size:12.5px;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.sadhana-wrap .arch-task{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);font-size:12px;margin-bottom:5px;color:var(--text-muted)}
.sadhana-wrap .arch-task b{color:var(--text);font-weight:500}
.sadhana-wrap .arch-task .at-tags{display:inline-flex;gap:3px}
.sadhana-wrap .arch-task .arch-restore{margin-inline-start:auto;flex:none;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:600;transition:background .15s,color .15s}
.sadhana-wrap .arch-task .arch-restore:hover{background:var(--accent);color:#fff}
.sadhana-wrap .arch-task .arch-restore:disabled{opacity:.5;cursor:default}
/* Batch s: permanent delete from the Archive — a quiet ghost danger button
   (transparent bg; muted rose = the app's --accent-3 rose, no danger token on the
   page — #B85A54 fallback; hover darkens). First click asks for confirmation. */
.sadhana-wrap .arch-task .arch-delete,.sadhana-wrap .arch-ritem .arch-delete{flex:none;margin-inline-start:auto;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--accent-3,#B85A54);border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600;font-family:inherit;line-height:1;transition:color .15s,opacity .15s}
.sadhana-wrap .arch-task .arch-delete:hover,.sadhana-wrap .arch-ritem .arch-delete:hover{background:transparent;color:#91423D}
.sadhana-wrap .arch-task .arch-delete:disabled,.sadhana-wrap .arch-ritem .arch-delete:disabled{opacity:.5;cursor:default}
.sadhana-wrap .arch-empty{padding:22px;text-align:center;color:var(--text-dim);font-size:12px;font-style:italic}
.sadhana-wrap .arch-recur h4{font-size:12.5px;font-weight:700;margin:8px 0 7px;display:flex;align-items:center;gap:6px}
.sadhana-wrap .arch-ritem{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);font-size:12px;margin-bottom:5px}
.sadhana-wrap .arch-rdates{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.sadhana-wrap .arch-rdate{font-size:10px;padding:2px 7px;border-radius:12px;background:var(--surface);border:1px solid var(--border2);color:var(--text-dim)}
/* Loading placeholder while the board data arrives.
   NOTE: deliberately NOT .board-loading — app.css ships a global .board-loading pill
   (absolute, var(--text) background) for the canvas/notebook pages; the collision
   used to paint a full-height BLACK STRIP over the board while it loaded (2026-08-29
   user report). This class is board-private and spans the whole grid. */
.sadhana-wrap .sadhana-loading{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--text-dim);font-size:13px;gap:8px}

  </style>
</head>
<body class="sadhana-body">
<!-- Unified Hibana chrome: the topbar partial (brand, nav links incl. To-do list,
     user menu, language, theme) injects here via app.js; ≤720px it is hidden and
     mobile-nav.js builds the bottom tab bar instead. -->
<div data-nav></div>

<div class="sadhana-wrap">
<div class="page-shell">

<div class="subbar-wrap">
  <div class="subbar-inner">
    <!-- Date pill (was in the old header; hidden on phones) -->
    <div id="hdrDate" class="hdr-date"></div>
    <!-- Calendar system (2026-08-29 user request): NO manual toggle — the board follows
         the locale automatically (fa → Jalali/shamsi, en → Gregorian). setLang re-derives. -->
    <!-- Telegram linking lives in Hibana Settings → Telegram (user request 2026-08-29). -->
    <!-- Archive (was in the old user menu) -->
    <button class="btn" id="archiveBtn" onclick="openArchive()">
      <span class="umenu-ico">🗄️</span><span id="archiveLbl">Archive</span>
    </button>
    <!-- Filter tags -->
    <div class="filter-tags" id="filterTags"></div>
    <span style="font-size:10.5px;color:var(--text-dim);white-space:nowrap;align-self:center;margin-left:8px" id="filterCount"></span>
    <!-- Primary action (was in the old header) -->
    <button class="btn btn-primary" id="addTaskBtn" onclick="openQA()">＋ Add Task</button>
  </div>
</div>

<div class="mat-outer">
  <div class="mat-grid" id="matGrid"><div class="sadhana-loading" id="boardLoading">Loading…</div></div>
  <!-- Carousel guidance (≤740px only, hidden on desktop): dots + one-time swipe hint.
       Built by buildQuadDots() after the grid renders; siblings of #matGrid so they
       survive every re-render. -->
  <div class="quad-dots" id="quadDots" role="tablist" aria-label="Quadrants"></div>
  <div class="swipe-hint" id="swipeHint" aria-hidden="true"><span id="swipeHintTxt">Swipe</span><span aria-hidden="true">›</span></div>
</div>

</div><!-- page-shell -->

<!-- Undo toast -->
<div class="undo-toast" id="undoToast" role="status">
  <span id="undoMsg">Task deleted</span>
  <button class="undo-btn" id="undoBtn" onclick="undoDelete()">↩ Undo</button>
</div>

<!-- Zen overlay -->
<div class="zen-overlay" id="zenOv" onclick="closeZen()"></div>
<div class="zen-card" id="zenCard" role="dialog" aria-modal="true" aria-label="Focus">
  <div class="zen-header" id="zenHeader"></div>
  <div class="zen-body" id="zenBody"></div>
  <div class="zen-footer" id="zenFooter"></div>
</div>

<!-- Quick Add Modal -->
<div class="modal-bg" id="qaModal" onclick="if(event.target===this)this.classList.remove('open')" role="dialog" aria-modal="true" aria-label="Quick add task">
  <div class="modal">
    <div class="mtitle" id="mTitle">Quick Add Task</div>
    <div class="mfield">
      <label class="mlbl" id="mLblTask" for="mInp">Task</label>
      <div class="mrow">
        <div class="mep-btn" id="mep" onclick="openEP('modal',0)" role="button" tabindex="0">📌</div>
        <textarea class="ai" id="mInp" rows="2" style="flex:1" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.ctrlKey){event.preventDefault();addFromModal();}"></textarea>
      </div>
    </div>
    <div class="mfield">
      <label class="mlbl" id="mLblQ" for="mQ">Quadrant</label>
      <select class="sel-in" id="mQ"></select>
    </div>
    <div class="mfield">
      <textarea class="ai" id="mNote" rows="2" placeholder="Note (optional)…" style="font-size:12px;color:var(--text-muted)"></textarea>
    </div>
    <!-- Tags + Deadline + Recurring — always visible in modal -->
    <div id="mAdvanced">
      <div class="mfield">
        <label class="mlbl" id="mLblTags">Tags</label>
        <div class="tag-picker" id="mTags"></div>
      </div>
      <div class="mfield">
        <label class="mlbl" id="mLblDL">Deadline</label>
        <button class="dl-trigger" id="mDLTrigger" onclick="openDLP('m',this)">
          <span class="dl-trigger-ico">📅</span>
          <span id="mDLLabel">—</span>
        </button>
      </div>
      <div class="mfield">
        <label class="mlbl" id="mLblRecur">Recurring</label>
        <div id="mRecurUI"></div>
      </div>
    </div>
    <div class="m-acts">
      <button class="btn" onclick="document.getElementById('qaModal').classList.remove('open')" id="mCancel">Cancel</button>
      <button class="btn btn-primary" onclick="addFromModal()" id="mSubmit">Add Task</button>
    </div>
  </div>
</div>

<!-- Archive overlay (in-page view) -->
<div class="arch-ov" id="archOv" onclick="if(event.target===this)closeArchive()" role="dialog" aria-modal="true" aria-label="Archive">
  <div class="arch-modal">
    <div class="arch-head">
      <div class="arch-title" id="archTitle">🗄️ Archive</div>
      <button class="btn" onclick="closeArchive()" id="archClose">✕ Close</button>
    </div>
    <div class="arch-body" id="archBody"><div class="arch-empty">Loading…</div></div>
  </div>
</div>

<!-- Deadline Popup (single shared, repositioned on open) -->
<div class="ep-ov" id="dlpOv" onclick="closeDLP()" style="z-index:590"></div>
<div class="dl-popup" id="dlPopup" role="dialog" aria-label="Deadline picker">
  <div class="dl-popup-tabs">
    <button class="dl-ptab active" id="dlTabFuz" onclick="dlpTab('fuz')">Fuzzy</button>

/* ══ JALALI CONVERSION ═════════════════════════ */
function g2j(gy,gm,gd){
  /* Exact port of calendar_utils.py g2j — must subtract 1600 first */
  gy-=1600;gm-=1;gd-=1;
  var g=365*gy+~~((gy+3)/4)-~~((gy+99)/100)+~~((gy+399)/400);
  var gdays=[31,28,31,30,31,30,31,31,30,31,30,31];
  for(var i=0;i<gm;i++)g+=gdays[i];
  if(gm>1&&((gy%4===0&&gy%100!==0)||gy%400===0))g++;
  g+=gd;
  var j=g-79;
  var cycles=~~(j/12053);j%=12053;
  var jy=979+33*cycles+4*~~(j/1461);
  j%=1461;
  if(j>=366){jy+=~~((j-1)/365);j=(j-1)%365;}
  var jm_days=[31,31,31,31,31,31,30,30,30,30,30,29];
  var jm=0;
  while(jm<11&&j>=jm_days[jm]){j-=jm_days[jm];jm++;}
  return[jy,jm+1,j+1];
}
function j2g(jy,jm,jd){
  var jy2=jy-979,jm2=jm-1,jd2=jd-1;
  var j_day_no=365*jy2+~~(jy2/33)*8+~~((jy2%33+3)/4);
  var jm_days=[31,31,31,31,31,31,30,30,30,30,30,29];
  for(var i=0;i<jm2;i++)j_day_no+=jm_days[i];
  j_day_no+=jd2;
  var g_day_no=j_day_no+79;
  var gy=1600+400*~~(g_day_no/146097);g_day_no%=146097;
  var leap=true;
  if(g_day_no>=36525){g_day_no--;gy+=100*~~(g_day_no/36524);g_day_no%=36524;if(g_day_no>=365)g_day_no++;else leap=false;}
  gy+=4*~~(g_day_no/1461);g_day_no%=1461;
  if(g_day_no>=366){leap=false;g_day_no--;gy+=~~(g_day_no/365);g_day_no%=365;}
  var gm_days=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  var gm=0;
  for(;gm<12&&g_day_no>=gm_days[gm];gm++)g_day_no-=gm_days[gm];
  return[gy,gm+1,g_day_no+1];
}
function jalaliLeap(jy){return[1,5,9,13,17,22,26,30].includes(jy%33);}
/* Esfand: 30 days on leap years, 29 on others — all other months fixed */
function jMonthDays2(jy,jm){
  if(jm<=6)return 31;
  if(jm<=11)return 30;
  return jalaliLeap(jy)?30:29;
}
function nowJalali(){
  var n=new Date();
  return g2j(n.getFullYear(),n.getMonth()+1,n.getDate());
}
function jalaliWeekNum(jy,jm,jd){
  /* day of year */
  var jm_days=[31,31,31,31,31,31,30,30,30,30,30,29];
  var doy=0;
  for(var i=0;i<jm-1;i++)doy+=jm_days[i];
  doy+=jd;
  return Math.ceil(doy/7);
}

/* ══ DEADLINE POPUP ════════════════════════════ */
function openDLP(slot,triggerEl){
  dlpSlot=slot;
  /* Position popup near trigger */
  const popup=document.getElementById('dlPopup');
  const ov=document.getElementById('dlpOv');
  const rect=triggerEl.getBoundingClientRect();
  let top=rect.bottom+6;
  let left=rect.left;
  if(top+420>window.innerHeight)top=rect.top-430;
  if(left+320>window.innerWidth)left=window.innerWidth-330;
  popup.style.top=Math.max(8,top)+'px';
  popup.style.left=Math.max(8,left)+'px';
  /* Translate tabs */
  document.getElementById('dlTabFuz').textContent=tr('fuzzyTab');
  document.getElementById('dlTabStep').textContent=tr('stepTab');
  document.getElementById('dlClearBtn').textContent=tr('clearDL');
  /* Show fuzzy tab by default */
  spTime='';
  dlpTab('fuz');
  popup.classList.add('open');
  ov.classList.add('open');
}
function closeDLP(){
  document.getElementById('dlPopup').classList.remove('open');
  document.getElementById('dlpOv').classList.remove('open');
  dlpSlot=null;
}
function clearDL(){
  if(dlpSlot===null)return;
  dlState[dlpSlot]={type:'none',val:''};
  updateDLTrigger(dlpSlot);
  closeDLP();
}
function dlpTab(which){
  document.getElementById('dlTabFuz').classList.toggle('active',which==='fuz');
  document.getElementById('dlTabStep').classList.toggle('active',which==='step');
  document.getElementById('dlpFuzContent').style.display=which==='fuz'?'':'none';
  document.getElementById('dlpStepContent').style.display=which==='step'?'':'none';
  if(which==='fuz')buildFuzGrid();
  else{spStep=1;spYear=null;spMonth=null;spDay=null;buildStepPicker();}
}
function buildFuzGrid(){
  const cur=dlpSlot&&dlState[dlpSlot]?dlState[dlpSlot]:{};
  document.getElementById('dlpFuzGrid').innerHTML=FUZZY.map(f=>`
    <button class="fuz-opt${cur.type==='fuzzy'&&cur.val===f.k?' sel':''}" onclick="pickFuzzy('${f.k}')">
      <span class="fuz-ico">${f.ico}</span>${lang==='fa'?f.fa:f.en}
    </button>`).join('');
}
function pickFuzzy(k){
  if(dlpSlot===null)return;
  dlState[dlpSlot]={type:'fuzzy',val:k};
  updateDLTrigger(dlpSlot);
  buildFuzGrid();
  setTimeout(closeDLP,300);
}
function updateDLTrigger(slot){
  const s=dlState[slot];
  /* find trigger elements */
  const labelId=slot==='m'?'mDLLabel':`dltl-${slot}`;
  const btnId=slot==='m'?'mDLTrigger':`dlt-${slot}`;
  const lbl=document.getElementById(labelId);
  const btn=document.getElementById(btnId);
  if(!lbl)return;
  if(s.type==='none'){lbl.textContent=tr('noDeadline');btn&&btn.classList.remove('has-val');}
  else if(s.type==='fuzzy'){
    const f=FUZZY.find(x=>x.k===s.val);
    lbl.textContent=f?(lang==='fa'?f.fa:f.en):s.val;
    btn&&btn.classList.add('has-val');
  }
  else if(s.type==='exact'){
    let display=formatStoredDate(s.val);
    if(s.time)display+=' 🕐 '+s.time;
    lbl.textContent=display;
    btn&&btn.classList.add('has-val');
  }
}

  else if(spStep===3){

          else{isToday=d===nowG.getDate()&&spMonth===nowG.getMonth()+1&&spYear===nowG.getFullYear();}

        }).join('')}
      </div>`;
  }

  /* ── Step 4: Time picker ── */
  if(spStep===4){
    const isFA=lang==='fa';
    const dateLabel=dlState[dlpSlot]?formatStoredDate(dlState[dlpSlot].val):'';
    navHTML=`<div class="step-nav">
      <div class="step-pill done" onclick="spGoStep(1)">${isShamsi?toFa(spYear):spYear}</div>
      <span class="step-arrow">›</span>

      <span class="step-arrow">›</span>
      <div class="step-pill done" onclick="spGoStep(3)">${isShamsi?toFa(spDay):spDay}</div>
      <span class="step-arrow">›</span>
      <div class="step-pill active">${isFA?'ساعت':'Time'}</div>
    </div>`;
    contentHTML=`
      <div style="padding:14px 4px 6px;text-align:center">
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:10px">${isFA?'ساعت قرار (اختیاری):':'Appointment time (optional):'}</div>
        <input id="spTimeInp" type="time" value="${spTime||''}"
          style="font-size:22px;font-weight:600;color:var(--accent);background:var(--surface2);
                 border:1.5px solid var(--accent);border-radius:10px;padding:8px 16px;
                 outline:none;text-align:center;width:160px;cursor:pointer"
          onchange="spTime=this.value">
        <div style="display:flex;gap:8px;justify-content:center;margin-top:14px">
          <button class="btn" style="font-size:11.5px;padding:5px 14px" onclick="spSkipTime()">
            ${isFA?'بدون ساعت':'No time'}

          <button class="btn btn-primary" style="font-size:11.5px;padding:5px 14px" onclick="spConfirmTime()">
            ${isFA?'تأیید':'Confirm'}
          </button>
        </div>
      </div>`;
  }

  container.innerHTML=navHTML+contentHTML;
}
function spGoStep(s){if(s<=spStep||(s===2&&spYear)||(s===3&&spMonth)){spStep=s;buildStepPicker();}}
function spPickYear(y){spYear=y;spStep=2;buildStepPicker();}
function spPickMonth(m){spMonth=m;spStep=3;buildStepPicker();}
function spPickDay(d){
  spDay=d;
  if(dlpSlot===null)return;
  let gy,gm,gd;
  if(cal==='j'){[gy,gm,gd]=j2g(spYear,spMonth,d);}
  else{gy=spYear;gm=spMonth;gd=d;}
  const val=`${gy}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}`;
  dlState[dlpSlot]={type:'exact',val,time:''};
  updateDLTrigger(dlpSlot);
  spStep=4; /* advance to time picker step */
  buildStepPicker();
}
function spConfirmTime(){
  const inp=document.getElementById('spTimeInp');
  spTime=inp?inp.value:'';

function spSkipTime(){
  spTime='';

}
function formatStoredDate(isoStr){
  if(!isoStr)return'';
  const[gy,gm,gd]=isoStr.split('-').map(Number);
  if(cal==='j'){
    const[jy,jm,jd]=g2j(gy,gm,gd);
    return`${lang==='fa'?J_MONTHS[jm-1]:J_MONTHS_EN[jm-1]} ${lang==='fa'?toFa(jd):jd}، ${lang==='fa'?toFa(jy):jy}`;
  }
  const dt=new Date(gy,gm-1,gd);
  return dt.toLocaleDateString('en-GB',{month:'short',day:'numeric',year:'numeric'});
}

/* ══ SWIPEABLE QUADRANT CAROUSEL (session 9, user request) ══════
   Replaces the 2026-08-29 mobile quadrant-focus view (two half-width columns
   side by side — cramped, caused UI problems). ≤740px: #matGrid is a scroll-snap
   carousel, ONE quadrant per slide; thumb-swipe or dot-tap moves between them.
   Guidance: the dot row (#quadDots, active dot synced to the visible slide) + a
   one-time pulsing swipe hint (#swipeHint) that dies on first swipe or after 4s.
   Desktop is untouched — the CSS gates everything to the phone width. */
const isPhone=()=>window.matchMedia('(max-width:740px)').matches
function buildQuadDots(){
  const wrap=document.getElementById('quadDots');if(!wrap)return;
  wrap.innerHTML=QUADS.map(q=>
    `<button type="button" class="quad-dot" id="qd-${q.id}" role="tab" onclick="goToQuad(${q.id})" aria-label="${esc(q[lang].title)}" title="${esc(q[lang].title)}"></button>`
  ).join('');
  syncQuadDots();
  wireSwipeHint();
}
/* RTL note: modern browsers report NEGATIVE scrollLeft while scrolling an RTL
   container (slide 2+ lives to the LEFT of slide 1 for fa). |scrollLeft| / width
   gives the slide index in both directions; the sign flips only when WE scroll. */
function quadIndex(){
  const g=document.getElementById('matGrid');if(!g)return 0;
  return Math.max(0,Math.min(QUADS.length-1,Math.round(Math.abs(g.scrollLeft)/Math.max(1,g.clientWidth))))
}
function syncQuadDots(){
  const i=quadIndex();
  document.querySelectorAll('.quad-dot').forEach((d,k)=>{
    d.classList.toggle('active',k===i);
    d.setAttribute('aria-selected',k===i?'true':'false');
  });
}
function goToQuad(q){
  const g=document.getElementById('matGrid');if(!g)return;
  /* NOTE: QUADS is ordered [1,3,2,4] (Today, Urgent, Strategic, Personal — the two
     action quadrants first); slide i = QUADS[i], NOT quadrant id i. RTL verified:
     modern Chrome reports NEGATIVE scrollLeft (slide 2+ sits left of slide 1). */
  const i=QUADS.findIndex(x=>x.id===q);if(i<0)return;
  const sign=getComputedStyle(g).direction==='rtl'?-1:1;
  g.scrollTo({left:sign*i*g.clientWidth,behavior:'smooth'});
  hideSwipeHint();
}
/* A task added to a quadrant on another slide would land off-screen — advance the
   carousel so the new card is always visible (replaces the old revealIfHidden). */
function revealIfHidden(q){
  if(!isPhone())return;
  if(quadIndex()!==QUADS.findIndex(x=>x.id===q))goToQuad(q);
}
/* Swipe hint: pulse until the user first swipes (or 4s); one session per load. */
let swipeHintHidden=false
function wireSwipeHint(){
  const h=document.getElementById('swipeHint'),g=document.getElementById('matGrid');
  if(!h||!g)return;
  const txt=document.getElementById('swipeHintTxt');
  if(txt)txt.textContent=lang==='fa'?'برای بخش‌های دیگر بکشید':'Swipe for more';
  h.querySelector('span:last-child').textContent=lang==='fa'?'‹':'›';
  if(swipeHintHidden||!isPhone()){h.classList.add('hide');return}
  h.classList.remove('hide');
  setTimeout(hideSwipeHint,4000);
}
function hideSwipeHint(){
  swipeHintHidden=true;
  document.getElementById('swipeHint')?.classList.add('hide');
}
(function(){
  const g=document.getElementById('matGrid');if(!g)return;
  let raf=0;
  g.addEventListener('scroll',()=>{
    if(!isPhone())return;
    hideSwipeHint();
    if(raf)return;
    raf=requestAnimationFrame(()=>{raf=0;syncQuadDots()})
  },{passive:true});
  g.addEventListener('scrollend',syncQuadDots);
  /* Grid rebuilt (buildGrid replaces children) → re-wire dots + re-measure. */
  const mo=new MutationObserver(()=>{if(isPhone())syncQuadDots()});
  mo.observe(g,{childList:true});
  window.addEventListener('resize',()=>{buildQuadDots()});
})();
function updateFilterCount(){
  const fc=document.getElementById('filterCount');if(!fc)return;
  if(activeFilter==='all'){fc.textContent='';return;}

function renderAll(){[1,2,3,4].forEach(q=>renderQ(q));updateFilterCount();setTimeout(checkAllMore,50);}
function taskVisible(t){return activeFilter==='all'||(t.tags&&t.tags.includes(activeFilter));}

function renderQ(q,targetBody){
  const body=targetBody||document.getElementById(`tb-${q}`);if(!body)return;
  const all=tasks[q].filter(x=>!x.deleted);
  // Sort: pinned first (by pos), then unpinned (by pos)
  const sortFn=(a,b)=>{
    if(a.pinned&&!b.pinned)return -1;
    if(!a.pinned&&b.pinned)return 1;
    return (a.pos||0)-(b.pos||0);
  };
  const active=all.filter(x=>!x.done).sort(sortFn);
  const done=all.filter(x=>x.done);
  const n=active.length;
  const cntEl=document.getElementById(`cnt-${q}`);
  if(cntEl){
    const total=all.length;
    if(lang==='fa') cntEl.textContent=toFa(n)+' / '+toFa(total);
    else cntEl.textContent=n+' / '+total;
  }
  if(!all.length){body.innerHTML=`<div class="empty"><div class="ei" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4.2 12.6c.9.7 1.2 1.6 1.2 2.4h6c0-.8.3-1.7 1.2-2.4A7 7 0 0 0 12 2Z"/></svg></div><div class="et">${tr('noTasks')}<br><span class="et-hint">${lang==='fa'?'یکی را در پایین هر کارت اضافه کن':'Add one below each card'}</span></div></div>`;return;}
  let h=active.map(x=>`<div style="${!taskVisible(x)?'display:none':''}">${tcHTML(x,q)}</div>`).join('');
  if(done.length){
    const sfx=targetBody?'z':'';
    const vd=done.filter(x=>taskVisible(x));
    h+=`<div class="done-div" onclick="togDS(${q},'${sfx}')"><div class="done-line"></div><span class="done-arrow" id="da-${q}${sfx}">›</span><span>${vd.length} ${tr('completed')}</span><div class="done-line"></div></div>
    <div id="ds-${q}${sfx}" style="display:none;flex-direction:column;gap:5px">${done.map(x=>`<div style="${!taskVisible(x)?'display:none':''}">${tcHTML(x,q)}</div>`).join('')}</div>`;
  }
  body.innerHTML=h;
  if(!targetBody)setTimeout(()=>checkMore(q),30);
}

/* ══ CARD TAP → EDIT (mobile focus view) ═══════════ */
/* In the two-column focus view the vertical action column (pin/edit/delete) is
   hidden to keep half-width cards readable (user request 2026-08-29). Tapping a
   card's neutral area opens the edit form instead; interactive children that
   already own their tap behavior (checkbox, emoji, progress dots, updates
   toggle, note preview, buttons/inputs) are excluded so their actions win.
   Board cards only — the zen overlay keeps its own inline action buttons. */
function cardTap(ev,id,q){
  if(!isPhone())return;
  if(!ev.target.closest('#matGrid'))return;
  if(ev.target.closest('.t-check,.t-emoji,.upd-toggle,.upd-panel,.t-act,.task-tag,.prog-dot,.task-note-preview,button,input,textarea,select,a'))return;
  startEdit(id,q);
}
function togDS(q,sfx){
  const s=document.getElementById(`ds-${q}${sfx}`),a=document.getElementById(`da-${q}${sfx}`);
  if(!s)return;const op=s.style.display==='flex';
  s.style.display=op?'none':'flex';a.classList.toggle('open',!op);
}
// L6 fix (2026-09-10): escape single quotes too — matches the server-side esc() in src/lib/http.ts.
// The old version escaped only &<>" (safe for text content + double-quoted attributes, but
// vulnerable inside single-quoted JS strings used in onclick handlers below).
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* ══ EDIT TASK (modal — user request 2026-09) ════════════════════════ */
/* Was inline (ef-${id} form below the card). Now opens a native <dialog> modal with
   the same fields: title, note, deadline, recurrence. Saves via the same PATCH
   endpoint + re-renders the quadrant. The inline form is kept as a data source
   (the modal reads from it) but is never shown inline. */
let sadhanaEditDlg = null
function startEdit(id, q) {
  const task = [1, 2, 3, 4].flatMap(qq => tasks[qq]).find(x => x.id === id)

        '<div class="edit-acts">' +

          '<span style="flex:1"></span>' +
