    <h1 data-i18n="pages.archive">Archive</h1>
    <!-- S35: the archive is now the PARKED shelf (archived_state='offline') — ideas and
         projects you are not building in the foreseeable future, kept safe (never
         purge-deleted like trash), browsable and restorable any time. Halted projects
         (paused mid-work) stay on the projects board with their own revive flow. -->
    <p class="muted" data-i18n="archive.hint">Parked ideas & projects — not trash, not lost. Archive what you won't build soon; restore it whenever the moment is right.</p>
    <div id="archive-list" hx-get="/api/projects?archived=1" hx-trigger="load" hx-swap="innerHTML">
