<body>
  <div data-nav></div>
  <!-- shell-flush (batch p): the board page goes FULL-WIDTH (user request 2026-09-06) —
       the five columns take the whole viewport instead of the 64rem reading measure. -->
  <main class="shell shell-flush" id="main" tabindex="-1">
    <div class="db-toolbar card" id="db-toolbar">
      <a class="btn ghost small" href="/" data-back-link>← <span data-i18n="db.backToProject">Back to project</span></a>
      <h2 id="db-title" class="db-title">…</h2>
      <span class="muted small" id="db-counts"></span>
      <span class="db-flex-gap"></span>
      <a class="btn ghost small" id="db-sprint-link" href="#"><span data-i18n="db.sprints">Sprints</span></a>
    </div>
    <div class="db-loading" id="db-loading" role="status"><span class="hibana-spinner" aria-hidden="true"></span><span data-i18n="db.loading">Loading board…</span></div>
    <div class="db-board" id="db-board" hidden></div>
  </main>
  <script src="/js/board-page.js?v=1" defer></script>
</body>
