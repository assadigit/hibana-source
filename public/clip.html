<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capture to Hibana</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preload" as="font" type="font/woff2" href="/vendor/manrope/Manrope-400.woff2" crossorigin>
  <link rel="stylesheet" href="/css/variables.css?v=5">
  <link rel="stylesheet" href="/css/base.css?v=4">
  <link rel="stylesheet" href="/css/layout.css?v=10">
  <link rel="stylesheet" href="/css/dashboard.css?v=11">
  <link rel="stylesheet" href="/css/dashboard-todo.css?v=5">
  <link rel="stylesheet" href="/css/components.css?v=3">
  <link rel="stylesheet" href="/css/canvas.css?v=6">
  <link rel="stylesheet" href="/css/quicknotes.css?v=12">
  <link rel="stylesheet" href="/css/to-do-list.css?v=3">
  <link rel="stylesheet" href="/css/polish-ui.css?v=5">
  <link rel="stylesheet" href="/css/calendar.css?v=4">
  <link rel="stylesheet" href="/css/notifications.css?v=4">
  <link rel="stylesheet" href="/css/polish-batch.css?v=13">
  <link rel="stylesheet" href="/css/project-header.css?v=25">
  <link rel="stylesheet" href="/css/devboard.css?v=18">
  <link rel="stylesheet" href="/css/misc.css?v=9">
  <link rel="stylesheet" href="/css/themes.css?v=2">
  <link rel="stylesheet" href="/css/rtl.css?v=2">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
    <link rel="stylesheet" href="/css/clip.css?v=1">
</head>
<body>
  <div id="hibana-page-loader" aria-hidden="true"><div class="hibana-page-loader-spinner"></div></div>
  <main class="clip-card" id="clip-card">
    <h1><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4.2 12.6c.9.7 1.2 1.6 1.2 2.4h6c0-.8.3-1.7 1.2-2.4A7 7 0 0 0 12 2Z"/></svg> <span data-i18n="clip.title">Capture to Hibana</span></h1>
    <p class="clip-hint" data-i18n="clip.hint">Save this page as an idea — it lands in your Quick Notebook.</p>
    <div class="clip-source" id="clip-source" hidden></div>
    <form id="clip-form">
      <label>
        <span data-i18n="clip.note">Note (optional)</span>
        <textarea id="clip-text" rows="3" maxlength="2000" dir="auto" placeholder="Add a note (or leave blank to capture just the title + link)"></textarea>
      </label>
      <p class="clip-error" id="clip-error" role="alert" hidden></p>
      <div class="clip-actions">
        <button type="button" class="ghost" id="clip-cancel" data-i18n="common.cancel">Cancel</button>
        <button type="submit" id="clip-save" data-i18n="clip.save">Save idea</button>
      </div>
    </form>
    <div class="clip-success" id="clip-success" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="3"/><path d="M7.4 12.4l3 3 6.2-6.2"/></svg>
      <h2 data-i18n="clip.saved">Saved!</h2>
      <p data-i18n="clip.savedHint">In your Quick Notebook. Closing…</p>
    </div>
  </main>

  <script src="/js/i18n-en.js?v=35" defer></script>
  <script src="/js/i18n.js?v=91" defer></script>
  <script src="/js/clip-page.js?v=1" defer></script>
</body>
</html>
