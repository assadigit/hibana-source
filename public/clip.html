  <main class="clip-card" id="clip-card">

    <div class="clip-source" id="clip-source" hidden></div>
    <form id="clip-form">
      <label>
        <span data-i18n="clip.note">Note (optional)</span>

      </label>
      <p class="clip-error" id="clip-error" role="alert" hidden></p>
      <div class="clip-actions">
        <button type="button" class="ghost" id="clip-cancel" data-i18n="common.cancel">Cancel</button>

    </form>
