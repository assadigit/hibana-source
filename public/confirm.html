<body class="auth-page public-page">
  <button class="theme-floater" onclick="window.hibana?.toggleTheme()" title="Theme: light / dark / system" aria-label="Toggle theme" data-i18n-title="auth.themeHint" data-i18n-aria-label="auth.toggleTheme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <main id="main" tabindex="-1" class="auth-card">
    <h1>Hibana</h1>
    <h3 data-i18n="auth.confirmEmail">Confirm your email</h3>
    <p class="muted small"><span data-i18n="auth.confirmDesc">We sent a 4-digit code to</span> <b id="email-label" data-i18n="auth.yourInbox">your inbox</b>. <span data-i18n="auth.confirmDesc2">It expires in 15 minutes.</span></p>
    <form method="post" action="/api/auth/verify" hx-post="/api/auth/verify" hx-target="#verify-msg" hx-swap="innerHTML" hx-indicator="#verify-spinner">
      <label><span data-i18n="auth.email">Email</span> <input type="email" name="email" id="email-input" required></label>
      <label><span data-i18n="auth.code">4-digit code</span>
        <div class="otp-field" data-otp>
          <input type="text" name="code" id="code-input" required inputmode="numeric" pattern="[0-9۰-۹]{4}" maxlength="4" autocomplete="one-time-code" aria-label="4-digit code" data-i18n-aria-label="auth.code">
          <span class="otp-box" data-otp-box="0"></span>
          <span class="otp-box" data-otp-box="1"></span>
          <span class="otp-box" data-otp-box="2"></span>
          <span class="otp-box" data-otp-box="3"></span>
        </div>
      </label>
      <div class="row">
        <button type="submit" data-i18n="auth.confirm">Confirm</button>
        <span id="verify-spinner" class="spinner htmx-indicator"></span>
      </div>
    </form>
    <p id="verify-msg"></p>
    <p class="small"><button type="button" class="ghost" id="resend-btn" data-i18n="auth.resend">Resend code</button></p>
    <p id="resend-msg" class="muted small"></p>
    <p class="small"><a href="/signup" data-i18n="auth.wrongEmailStartOver">← Wrong email? Start over</a></p>
    <script src="/dist/confirm-page.33af905f.js" defer></script>
  </main>
</body>
</html>
