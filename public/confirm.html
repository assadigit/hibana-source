<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email — Hibana</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/css/app.css?v=186">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
  <script src="/js/app.js?v=158" defer></script>
  <script src="/js/touch-drag.js" defer></script>
  <script src="/vendor/htmx.min.js" defer></script>
</head>
<body class="auth-page public-page">
  <button class="theme-floater" onclick="window.hibana?.toggleTheme()" title="Theme: light / dark / system" aria-label="Toggle theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <main class="auth-card">
    <h1>Hibana</h1>
    <h3>Confirm your email</h3>
    <p class="muted small">We sent a 4-digit code to <b id="email-label">your inbox</b>. It expires in 15 minutes.</p>
    <form method="post" action="/api/auth/verify" hx-post="/api/auth/verify" hx-target="#verify-msg" hx-swap="innerHTML" hx-indicator="#verify-spinner">
      <label>Email <input type="email" name="email" id="email-input" required></label>
      <label>4-digit code
        <input type="text" name="code" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" placeholder="0000">
      </label>
      <div class="row">
        <button type="submit">Confirm</button>
        <span id="verify-spinner" class="spinner htmx-indicator"></span>
      </div>
    </form>
    <p id="verify-msg"></p>
    <p class="small"><button type="button" class="ghost" id="resend-btn">Resend code</button></p>
    <p id="resend-msg" class="muted small"></p>
    <p class="small"><a href="/signup">← Wrong email? Start over</a></p>
    <script>
      const email = new URLSearchParams(location.search).get('email') ?? ''
      document.getElementById('email-input').value = email
      if (email) document.getElementById('email-label').textContent = email
      document.getElementById('resend-btn').addEventListener('click', async () => {
        const e = document.getElementById('email-input').value.trim()
        if (!e) return
        const btn = document.getElementById('resend-btn')
        btn.disabled = true
        const msg = document.getElementById('resend-msg')
        try {
          const res = await fetch('/api/auth/verify/resend', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: e }),
          })
          const json = await res.json().catch(() => ({}))
          msg.textContent = json.error === 'resend_cooldown'
            ? 'Wait a minute between resends.'
            : json.error
              ? 'Could not resend — please try again in a minute.'
              : 'Code sent — check your inbox.'
        } catch {
          msg.textContent = 'Could not reach the server — check your connection.'
        } finally {
          btn.disabled = false
        }
      })
    </script>
  </main>
</body>
</html>
