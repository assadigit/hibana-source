<body>
  <div id="hibana-page-loader" aria-hidden="true"><div class="hibana-page-loader-inner"><div class="hibana-loader-mark" aria-hidden="true"><span class="hibana-loader-glyph">H</span><span class="hibana-loader-orbit"><span class="hibana-loader-spark"></span></span></div><span class="hibana-page-loader-brand">Hibana</span><div class="hibana-loader-track" aria-hidden="true"><span class="hibana-loader-fill"></span></div></div></div>
  <div data-nav></div>
  <main class="shell" id="main" tabindex="-1">
    <!-- S39 (user request: "an archive gallery of pics, similar to wordpress, so the user
         can delete the unneeded files to make up more space"): the MEDIA LIBRARY — every
         uploaded picture across all projects, browsable, filterable, deletable, with a
         space meter. gallery-page.js owns the whole grid (JSON API, no htmx). -->
    <div class="row spread gallery-head">
      <h1 data-i18n="gallery.title">Gallery</h1>
      <div class="gallery-stats" id="gallery-stats" hidden role="status" aria-live="polite"></div>
    </div>
    <p class="muted small" data-i18n="gallery.subtitle">Every picture you have uploaded across projects — browse, see where each is pinned, and delete what you no longer need to free space.</p>
    <div class="row gallery-tools">
      <label class="sr-only" for="gallery-project" data-i18n="gallery.allProjects">All projects</label>
      <select id="gallery-project" class="gallery-project-select"></select>
      <div class="row gallery-states" role="toolbar" aria-label="Filter">
        <button type="button" class="chip gallery-state is-on" data-gs="all" aria-pressed="true" data-i18n="gallery.all">All</button>
        <button type="button" class="chip gallery-state" data-gs="open" aria-pressed="false" data-i18n="gallery.open">Open problems</button>
        <button type="button" class="chip gallery-state" data-gs="fixed" aria-pressed="false" data-i18n="gallery.fixed">Fixed</button>
        <button type="button" class="chip gallery-state" data-gs="pinned" aria-pressed="false" data-i18n="gallery.pinned">Pinned</button>
      </div>
      <!-- S80 — the display order: newest / oldest / LARGEST / smallest. The cleanup
           workflow ("delete the unneeded files to make up more space") starts with
           seeing the biggest offenders first; ?sort= is deep-linkable and a sort change
           never invalidates an in-progress selection (it re-orders, not re-filters). -->
      <label class="sr-only" for="gallery-sort" data-i18n="gallery.sortBy">Sort by</label>
      <select id="gallery-sort" class="gallery-sort-select">
        <option value="new" data-i18n="gallery.sortNew">Newest first</option>
        <option value="old" data-i18n="gallery.sortOld">Oldest first</option>
        <option value="big" data-i18n="gallery.sortBig">Largest first</option>
        <option value="small" data-i18n="gallery.sortSmall">Smallest first</option>
      </select>
      <!-- S79 (b): bulk space management — the owner's original gallery ask was "delete
           the unneeded files to make up more space"; one-by-one confirms made a cleanup
           pass N-confirms deep. This toggle enters Select mode (tap tiles → sticky bar
           → one confirm deletes them all). -->
      <button type="button" class="chip gallery-select" id="gallery-select-btn" aria-pressed="false" data-i18n="gallery.select">Select</button>
      <!-- S115 (owner: free-tier storage can't pile up hundreds/thousands of temporary
           files): the ONE-tap cleanup — deletes EVERY uploaded file after a typed-in
           confirm; Select mode + Delete selected remain for keeping some of them. -->
      <button type="button" class="chip gallery-delete-all" id="gallery-delete-all-btn" disabled data-i18n="gallery.deleteAll">Delete all</button>
    </div>
    <div class="shot-grid gallery-grid" id="gallery-grid" aria-busy="true">
      <div class="skeleton-loading" role="status" aria-label="Loading gallery">
        <div class="skeleton skeleton-box"></div>
        <div class="skeleton skeleton-line w-60"></div>
      </div>
    </div>
  </main>
  <script src="/js/gallery-page.js?v=15" defer></script>
</body>
