<!doctype html>
<!-- S84 (owner: "notes.html still appears pre-emptively and unloaded — elements
     are not looking proper"): this page declares a REVEAL GATE. DOMContentLoaded
     only proves the scripts parsed; on the owner's link the vault data lands
     seconds later, and the full-page loader used to lift at DCL over a skeleton
     page (or, when a script stalled, the 8s safety lifted it over a half-booted
     one). With the gate, app.js keeps the veil until this page's controller
     dispatches hibana:page-ready — its first REAL paint (tree+cards rendered, or
     the honest load-failed Retry panel). app.js still never traps the user
     (12s safety) and base.css carries a pure-CSS 20s escape for the dead-JS
     worst case. -->

  <!-- S83 (owner: "notes.html first load is not fixed — refresh 1-2 times to see
       the normal template"): the S82 retry hardened the API fetches, but the failure
       that survives is the ASSET fetch itself — on a flaky first-visit link (Iran +
       VPN resets) any one of the deferred bundles can fail to arrive, and when the
       page script never runs there is no code left to recover: the skeleton just
       shimmers forever. This watchdog is INLINE on purpose (zero external deps — the
       only code guaranteed to run): if notes-page.js never signals boot via
       <html data-hibana-booted>, we auto-retry the whole page (up to 2 reloads per
       session, the exact "refresh 1-2 times" the owner was doing by hand). A
       script-load error shortens the wait to 3s so the retry feels instant.
       S84 (owner follow-up: "appears pre-emptively and unloaded, elements are not
       looking proper"): (a) a dropped STYLESHEET is now covered too — paint proceeds
       with whatever styles DID arrive, which is exactly the half-styled "not looking
       proper" page, so a css-error reloads even on an otherwise-booted page (the
       2-per-session budget caps loops; a reloading guard collapses error bursts
       into ONE reload); (b) the bootstrap data fetch now STARTS HERE — at
       HTML-parse time, seconds before the deferred scripts run on a slow link —
       stashed on window for notes-page.js to consume once. The veil's total time
       becomes max(scripts, data) instead of scripts + data. -->
  <script>
  (function () {
    // S84: the parse-time bootstrap preload — pure fetch, zero deps, same-origin
    // credentials. notes-page.js consumes it once (loadBootstrapOnce); any
    // failure (401 logged-out, net reset) falls back to its normal api() path.
    try {
      window.__hibanaVaultBoot = fetch('/api/vault/bootstrap', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('boot ' + r.status)) })
    } catch (e) { /* ancient browser — the controller fetches on its own */ }
    try {
      var retries = Number(sessionStorage.getItem('hibana-boot-retries')) || 0
      if (retries >= 2) return
      var booted = function () { return document.documentElement.hasAttribute('data-hibana-booted') }
      var reloading = false
      var retry = function (reason, force) {
        if (reloading || retries >= 2) return
        if (!force && booted()) return
        reloading = true
        retries += 1
        try { sessionStorage.setItem('hibana-boot-retries', String(retries)) } catch (e) {}
        try { sessionStorage.setItem('hibana-boot-retry-reason', reason) } catch (e) {}
        location.reload()
      }
      // Belt: the page never booted within 12s (slow link, stalled script) → retry.
      setTimeout(function () { retry('timeout') }, 12000)
      // Suspenders: a script resource actually ERRORED (net reset / 404) and the
      // page still has not booted 3s later → retry without waiting the full 12s.
      // S84: a LINK stylesheet error is the visual-integrity failure — it reloads
      // even when the page booted (force), after a shorter 1.5s beat so a
      // multi-file reset burst still collapses into one reload.
      window.addEventListener('error', function (e) {
        var t = e && e.target
        if (!t) return
        var tag = t.tagName
        var url = t.src || t.href || ''
        if (tag !== 'SCRIPT' && tag !== 'LINK') return
        if (!/\/dist\/|\/js\/|\/css\//.test(url)) return
        if (tag === 'LINK') setTimeout(function () { retry('css-error: ' + url, true) }, 1500)
        else setTimeout(function () { if (!booted()) retry('script-error: ' + url) }, 3000)
      }, true)
    } catch (e) { /* private mode / storage blocked — the page stays as it was */ }
  })()
  </script>

<body>
  <div id="hibana-page-loader" aria-hidden="true"><div class="hibana-page-loader-inner"><div class="hibana-page-loader-spinner"></div><span class="hibana-page-loader-brand">Hibana</span></div></div>
  <div data-nav></div>
  <!-- S53: Notes Vault — full-bleed 3-pane layout (shell-flush, the board.html pattern).
       The tree pane is <nav> (folder navigation), the list is a <section> of note cards,
       the editor a <section>; each scrolls independently under the sticky topbar. -->
  <main class="shell shell-flush vault-shell" id="main" tabindex="-1">
    <div class="vault">
      <div class="vault-scrim" data-vault-scrim hidden></div>

      <nav class="vault-tree" aria-label="Notes folders" data-vault-tree>
        <div class="vault-tree-inner" data-vault-tree-inner>
          <!-- skeleton while bootstrap loads -->
          <div class="vault-sk" aria-hidden="true">
            <div class="skeleton vault-sk-line" style="inline-size: 62%"></div>
            <div class="skeleton vault-sk-line" style="inline-size: 78%"></div>
            <div class="skeleton vault-sk-line" style="inline-size: 54%"></div>
            <div class="skeleton vault-sk-line" style="inline-size: 70%"></div>
          </div>
          <span class="sr-only" data-i18n="common.loading">Loading…</span>
        </div>
      </nav>

      <section class="vault-list" aria-label="Notes list">
        <div class="vault-list-head">
          <div class="vault-list-title-row">
            <button type="button" class="vault-burger" data-vault-burger aria-label="Browse folders" data-i18n-title="notes.browseFolders" title="Browse folders">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            </button>
            <h1 class="vault-list-title" data-vault-view-title data-i18n="notes.allNotes">All notes</h1>
            <span class="vault-list-count" data-vault-view-count></span>
          </div>
          <div class="vault-search">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" data-vault-search data-i18n-placeholder="notes.searchPlaceholder" placeholder="Search notes…" autocomplete="off" aria-label="Search notes" data-i18n-aria-label="notes.searchPlaceholder">
            <button type="button" class="vault-search-clear" data-vault-search-clear aria-label="Clear search" data-i18n-title="notes.clearSearch" title="Clear search">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <div class="vault-list-tools">
            <label class="sr-only" for="vault-sort" data-i18n="notes.sortLabel">Sort</label>
            <select class="vault-sort" id="vault-sort" data-vault-sort>
              <option value="updated" data-i18n="notes.sortUpdated">Recently edited</option>
              <option value="created" data-i18n="notes.sortCreated">Recently created</option>
              <option value="title" data-i18n="notes.sortTitle">Title A–Z</option>
              <option value="manual" data-i18n="notes.sortManual">Custom order</option>
            </select>
            <button type="button" class="vault-new" data-vault-new>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span data-i18n="notes.newNote">New note</span>
            </button>
          </div>
        </div>
        <div class="vault-cards" data-vault-cards>
          <div class="vault-sk" aria-hidden="true">
            <div class="vault-sk-card"><div class="skeleton vault-sk-line" style="inline-size: 34%"></div><div class="skeleton vault-sk-line"></div><div class="skeleton vault-sk-line" style="inline-size: 72%"></div></div>
            <div class="vault-sk-card"><div class="skeleton vault-sk-line" style="inline-size: 44%"></div><div class="skeleton vault-sk-line"></div><div class="skeleton vault-sk-line" style="inline-size: 64%"></div></div>
            <div class="vault-sk-card"><div class="skeleton vault-sk-line" style="inline-size: 30%"></div><div class="skeleton vault-sk-line"></div><div class="skeleton vault-sk-line" style="inline-size: 80%"></div></div>
            <div class="vault-sk-card"><div class="skeleton vault-sk-line" style="inline-size: 52%"></div><div class="skeleton vault-sk-line"></div><div class="skeleton vault-sk-line" style="inline-size: 58%"></div></div>
          </div>
          <span class="sr-only" data-i18n="common.loading">Loading…</span>
        </div>
      </section>

      <section class="vault-editor" aria-label="Note editor" data-vault-editor>
        <div class="vault-ed-empty">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h9l5 5v9a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 19V6.5A1.5 1.5 0 0 1 5.5 5Z"/><path d="M8 12h8M8 15.5h5"/></svg>
          <b data-i18n="notes.emptyEditorTitle">Nothing open</b>
          <span data-i18n="notes.emptyEditorHint">Pick a note from the list, or create a new one.</span>
        </div>
      </section>
    </div>
  </main>

  <!-- S86: the shared full-library emoji picker (notes + folders icons). M7: its

  <script src="/js/emoji-picker.js?v=3" defer></script>

</body>
