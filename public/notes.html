<!doctype html>
<!-- S84 (owner: "notes.html still appears pre-emptively and unloaded — elements
     are not looking proper"): this page declares a REVEAL GATE. DOMContentLoaded
     only proves the scripts parsed; on the owner's link the vault data lands
     seconds later, and the full-page loader used to lift at DCL over a skeleton
     page (or, when a script stalled, the 8s safety lifted it over a half-booted
     one). With the gate, app.js keeps the veil until this page's controller
     dispatches hibana:page-ready — its first REAL paint (tree+cards rendered, or
     the honest load-failed Retry panel). app.js still never traps the user
     (12s safety) and base.css carries a pure-CSS 20s escape for the dead-JS
     worst case. -->
<html lang="en" data-hibana-reveal="gated">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes — Hibana</title>
  <!-- S105 (owner: “when I open the note page, the first 1–2 times it appears
       unloaded and messed up; only after 1–2 refreshes does the real styling show”).
       ROOT CAUSE (verified with a playwright route.abort on a cold context — no HTTP
       cache, no SW, the exact first-visit shape): the S83/S84 watchdog lived at the
       END of <head>, AFTER the stylesheet links. A reset that lands while the parser
       is blocked on the synchronous boot.js fetch fires the LINK error BEFORE that
       inline script ever runs — the trace showed the error dispatching with the
       watchdog’s listener not yet installed (retries stayed 0). Early-failing
       stylesheets were invisible: no reload, no heal, the half-styled page just sat
       there until the user refreshed by hand — literally the reported symptom.
       THE GUARDIAN (this script) is now the FIRST thing in <head> — before any
       stylesheet/script fetch can fail — and a failed STYLESHEET no longer reloads
       the page at all: it re-fetches itself in place (a cache-busted twin href, up
       to 3 attempts) while the reveal veil is HELD, so the user never sees the
       half-styled state — the loader simply stays up until the CSS lands. Only a
       script failure (page never boots) or an exhausted heal falls back to the old
       location.reload() (budget still 2 per session). -->
  <script>
  (function () {
    // S84 (kept, moved up — it now starts even earlier): the parse-time bootstrap
    // preload. Pure fetch, zero deps, same-origin credentials. notes-page.js
    // consumes it once (loadBootstrapOnce); any failure (401 logged-out, net reset)
    // falls back to its normal api() path.
    try {
      window.__hibanaVaultBoot = fetch('/api/vault/bootstrap', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('boot ' + r.status)) })
    } catch (e) { /* ancient browser — the controller fetches on its own */ }

    // ---- S105: the asset guardian ------------------------------------------
    var MAX_HEAL = 3          // in-place stylesheet re-fetch attempts per link
    var STALL_MS = 5000       // a twin that neither loads nor errors counts as failed
    var HOLD_MAX_MS = 15000   // the veil is never held longer than this, no matter what
    var pending = 0           // heals in flight (veil stays down while > 0)
    var pageReady = false     // hibana:page-ready fired (app.js lifted the veil)
    var holdDeadline = 0

    function veilEl() { return document.getElementById('hibana-page-loader') }

    function holdVeil() {
      if (!holdDeadline) {
        holdDeadline = Date.now() + HOLD_MAX_MS
        setTimeout(function () {
          // Bounded hold: whatever is still pending, the user gets the page back
          // (the reload fallback / the next manual action can still recover it).
          pending = 0
          releaseVeil()
        }, HOLD_MAX_MS)
      }
      var v = veilEl()
      if (!v) return
      v.style.opacity = '1'
      v.style.pointerEvents = 'all'
      v.style.animation = 'none' // defuse base.css’s 20s pure-CSS escape while held
      v.classList.remove('is-hidden')
    }

    function releaseVeil() {
      if (pending > 0 || !pageReady) return // not healing, or the page never became ready
      var v = veilEl()
      if (!v) return
      v.style.opacity = ''
      v.style.pointerEvents = ''
      v.style.animation = ''
      v.classList.add('is-hidden')
    }

    function healLink(el) {
      var tries = Number(el.getAttribute('data-hibana-heal') || '0')
      if (tries >= MAX_HEAL) return false
      var n = tries + 1
      var href = el.getAttribute('href') || ''
      if (!href || el.getAttribute('rel') !== 'stylesheet') return false
      pending++
      holdVeil()
      var twin = document.createElement('link')
      twin.rel = 'stylesheet'
      twin.href = href + (href.indexOf('?') >= 0 ? '&' : '?') + 'hibana-r=' + n
      if (el.media) twin.media = el.media
      twin.setAttribute('data-hibana-heal', String(n))
      twin.setAttribute('data-hibana-heal-of', href)
      var settled = false
      var finish = function (ok) {
        if (settled) return
        settled = true
        pending--
        if (pending <= 0) { pending = 0; releaseVeil() }
        if (!ok) healLink(twin) // the twin itself failed → next attempt from it
      }
      twin.addEventListener('load', function () { finish(true) })
      twin.addEventListener('error', function () { finish(false) })
      // Stall guard: a request that hangs (reset that never resolves to an error
      // event) must not hold the veil forever — count it as a failed attempt.
      setTimeout(function () { finish(false) }, STALL_MS)
      el.replaceWith(twin)
      return true
    }

    // ---- the reload fallback (the S83/S84 watchdog semantics, unchanged) ----
    var retries = 0
    try { retries = Number(sessionStorage.getItem('hibana-boot-retries')) || 0 } catch (e) {}
    var booted = function () { return document.documentElement.hasAttribute('data-hibana-booted') }
    var reloading = false
    var retry = function (reason, force) {
      if (reloading || retries >= 2) return
      if (!force && booted()) return
      reloading = true
      retries += 1
      try { sessionStorage.setItem('hibana-boot-retries', String(retries)) } catch (e) {}
      try { sessionStorage.setItem('hibana-boot-retry-reason', reason) } catch (e) {}
      location.reload()
    }
    if (retries < 2) setTimeout(function () { retry('timeout') }, 12000)

    // THE listener — installed before any link/script fetch can fail (this script
    // is first in <head>). Stylesheets heal in place; scripts fall back to reload.
    window.addEventListener('error', function (e) {
      var t = e && e.target
      if (!t) return
      var tag = t.tagName
      if (tag !== 'SCRIPT' && tag !== 'LINK') return
      var url = t.src || t.href || ''
      if (!/\/dist\/|\/js\/|\/css\//.test(url)) return
      if (tag === 'LINK') {
        // Heal first; only an exhausted heal reloads the whole page.
        if (!healLink(t)) retry('css-error: ' + url, true)
      } else {
        setTimeout(function () { if (!booted()) retry('script-error: ' + url) }, 3000)
      }
    }, true)

    // Veil-hold handshake with the reveal gate: page-ready may fire while a heal is
    // still in flight (JS booted fine — only CSS is missing). app.js’s hideOverlay
    // adds .is-hidden on this same event; this listener (registered earlier) holds
    // the veil via inline styles, which outrank the class, until every heal lands.
    window.addEventListener('hibana:page-ready', function () {
      pageReady = true
      if (pending > 0) holdVeil()
    }, true)
  })()
  </script>

  <!-- S53: Notes Vault — full-bleed 3-pane layout (shell-flush, the board.html pattern).
       The tree pane is <nav> (folder navigation), the list is a <section> of note cards,
       the editor a <section>; each scrolls independently under the sticky topbar. -->
  <main class="shell shell-flush vault-shell" id="main" tabindex="-1">
    <div class="vault">
      <div class="vault-scrim" data-vault-scrim hidden></div>

            <span class="vault-list-count" data-vault-view-count></span>
          </div>
          <div class="vault-search">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" data-vault-search data-i18n-placeholder="notes.searchPlaceholder" placeholder="Search notes…" autocomplete="off" aria-label="Search notes" data-i18n-aria-label="notes.searchPlaceholder">
            <button type="button" class="vault-search-clear" data-vault-search-clear aria-label="Clear search" data-i18n-title="notes.clearSearch" title="Clear search">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <div class="vault-list-tools">
            <label class="sr-only" for="vault-sort" data-i18n="notes.sortLabel">Sort</label>

              <span data-i18n="notes.newNote">New note</span>
            </button>
          </div>
        </div>

          </div>
          <span class="sr-only" data-i18n="common.loading">Loading…</span>
