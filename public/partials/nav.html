<!-- S88 — the app chrome. The horizontal top navbar is REPLACED by a vertical icon
     rail (Material "navigation rail") fixed to the left edge on desktop (≥1025px):
     icons only, equal spacing, the active section wears a filled rounded-square
     indicator, secondary icons (Settings, Help) sit at the bottom behind a thin
     divider, and every icon carries an accessible name (aria-label + title) since
     there is no visible text label. Selecting a primary icon opens the SECONDARY
     PANEL beside the rail (the VS Code Activity-Bar + Side-Bar pattern the owner
     specced): a persistent list panel with collapsible grouped sections that PUSHES
     the main content (body padding), never an overlay. ≤1024px the rail hides and
     the slim brand-only bar carries the logo (the 2026-09-08 owner rule) + the
     bottom-tab nav keeps all navigation.
     Wiring contract with hib-init.js (unchanged): [data-user], [data-logout],
     [data-theme-toggle], [data-lang-toggle], [data-admin-link], [data-sync-badge],
     [data-cmdk-open] — the rail buttons carry the same hooks. -->

    <img class="rail-logo" src="/logo-light.png" alt="" width="30" height="30" decoding="async">
