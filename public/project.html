  <!-- pd-page (S185): the Project Detail page's own body class — the warm canvas
       + card/field affordances of the batch-1 color round are scoped to it (see
       project-header.css's S185 section). No other shell page carries this class. -->
  <div id="hibana-page-loader" aria-hidden="true"><div class="hibana-page-loader-inner"><div class="hibana-loader-mark" aria-hidden="true"><span class="hibana-loader-glyph">H</span><span class="hibana-loader-orbit"><span class="hibana-loader-spark"></span></span></div><span class="hibana-page-loader-brand">Hibana</span><div class="hibana-loader-track" aria-hidden="true"><span class="hibana-loader-fill"></span></div></div></div>

  <main class="shell" id="main" tabindex="-1">
    <!-- hx-indicator omitted on purpose: after the first swap #loading is gone, and the
         default indicator (htmx-request on this element + .htmx-indicator child) behaves
         identically without the "selector returned no matches" console error on every
         later htmx call (links/hurdles/screenshots actions). -->
    <div id="project-body" hx-get="/api/projects/__ID__" hx-trigger="load" hx-swap="innerHTML">
      <div id="loading" class="skeleton-loading htmx-indicator" aria-label="Loading project" role="status">
        <div class="skeleton skeleton-line w-60" style="height:1.5rem"></div>
        <div class="skeleton skeleton-line w-40"></div>
        <div class="skeleton skeleton-box"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line w-60"></div>
        <div class="skeleton skeleton-line w-40"></div>
      </div>
    </div>
  </main>

     embedded board's LABEL MANAGER ([data-pd-labels] → HibanaBoard.openLabels) is

     it; the module only defines window.HibanaBoard. -->
<script src="/js/sync-state.js?v=2" defer></script>
