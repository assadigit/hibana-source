<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects — Hibana</title>
  <link rel="preload" as="font" type="font/woff2" href="/vendor/manrope/Manrope-400.woff2" crossorigin>
  <link rel="stylesheet" href="/css/variables.css?v=5">
  <link rel="stylesheet" href="/css/base.css?v=3">
  <link rel="stylesheet" href="/css/layout.css?v=9">
  <link rel="stylesheet" href="/css/dashboard.css?v=11">
  <link rel="stylesheet" href="/css/dashboard-todo.css?v=5">
  <link rel="stylesheet" href="/css/components.css?v=3">
  <link rel="stylesheet" href="/css/canvas.css?v=6">
  <link rel="stylesheet" href="/css/quicknotes.css?v=12">
  <link rel="stylesheet" href="/css/to-do-list.css?v=2">
  <link rel="stylesheet" href="/css/polish-ui.css?v=4">
  <link rel="stylesheet" href="/css/calendar.css?v=4">
  <link rel="stylesheet" href="/css/notifications.css?v=4">
  <link rel="stylesheet" href="/css/polish-batch.css?v=13">
  <link rel="stylesheet" href="/css/project-header.css?v=22">
  <link rel="stylesheet" href="/css/devboard.css?v=12">
  <link rel="stylesheet" href="/css/misc.css?v=9">
  <link rel="stylesheet" href="/css/themes.css?v=2">
  <link rel="stylesheet" href="/css/rtl.css?v=2">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
  <script src="/vendor/htmx.min.js" defer></script>
  <script src="/vendor/idiomorph-ext.min.js" defer></script>
  <script src="/js/boot.js?v=4"></script>
  <script src="/vendor/alpine.min.js" defer></script>
  <script src="/js/queue.js?v=2" defer></script>
  <script src="/js/app.js?v=178" defer></script>
  <script src="/js/hib-init.js?v=1" defer></script>
  <script src="/js/touch-drag.js?v=1" defer></script>
  <script src="/js/i18n-en.js?v=31" defer></script>
  <script src="/js/i18n.js?v=87" defer></script>
  <script src="/js/nav.js?v=3" defer></script>
  <script src="/js/command-palette.js?v=2" defer></script>
  <script src="/js/mobile-nav.js?v=5" defer></script>
  <script src="/js/zen-mode.js?v=1" defer></script>
  <script src="/js/micro-interactions.js?v=1" defer></script>
  <script src="/js/go-to.js?v=1" defer></script>
  <script src="/js/install-prompt.js?v=1" defer></script>
</head>
<body>
  <div data-nav></div>
  <main class="shell" id="main" tabindex="-1">
    <div class="row spread wrap">
      <h1 data-i18n="pages.projects">Projects</h1>
      <!-- wrap: at phone widths the Select / New project / view-switcher controls flow to a
           second line instead of overflowing the viewport sideways (390px fix 2026-08-30). -->
      <div class="row wrap">
        <!-- Phase 5 item 12 (2026-09-08): the create-project CTA matches the other pages'
             primary CTAs (sparks' «Capture an idea» — plain primary button + plus icon). -->
        <button type="button" data-projectquickadd title="New project" data-i18n-title="fab.project">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          <span data-i18n="fab.project">New project</span>
        </button>
        <!-- Phase 5 item 12: the five views live in ONE «نمایش:» dropdown (the old
             five-button segmented bar crowded the header). setView persists the choice
             (item 10) so the page always reopens in the user's preferred view. -->
        <div class="view-select" role="group" aria-label="View">
          <label class="small muted" for="view-select-sel" data-i18n="view.label">View</label>
          <select id="view-select-sel" onchange="setView(this.value)" aria-label="View">
            <option value="grid" data-i18n="view.grid">Stages</option>
            <option value="cards" data-i18n="view.cards">Cards</option>
            <option value="list" data-i18n="view.list">List</option>
            <option value="sticky" data-i18n="view.sticky">Sticky Notes</option>
            <option value="kanban" data-i18n="view.kanban">Kanban</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Shared filter bar (spec §5.3): tag, status, search — all refresh-less. -->
    <form class="row filters" hx-get="/api/projects" hx-target="#project-list" hx-swap="innerHTML" hx-trigger="change, submit, keyup changed delay:400ms from:input" x-data="{ tags: [] }" x-init="fetch('/api/tags').then(r => r.json()).then(d => tags = d.tags)">
      <input type="hidden" name="view" id="view" value="grid">
      <input type="search" name="q" placeholder="Search (exact match)…" aria-label="Search" data-i18n-placeholder="filter.search">
      <select name="status" aria-label="Status">
        <option value="" data-i18n="filter.allStatuses">All statuses</option>
        <!-- batch q: the projects page filters the six PROJECT stages only — sparks are
             ideas and live on the Ideas shelf (sparks.html). -->
        <option value="unreviewed" data-i18n="status.unreviewed">Unreviewed</option>
        <option value="investigating" data-i18n="status.investigating">Investigating</option>
        <option value="awaiting" data-i18n="status.awaiting">Awaiting Execution</option>
        <option value="doing" data-i18n="status.doing">In Progress</option>
        <option value="halted" data-i18n="status.halted">Development Stopped</option>
        <option value="operational" data-i18n="status.operational">Operational</option>
      </select>
      <select name="tag" aria-label="Tag">
        <option value="" data-i18n="filter.allTags">All tags</option>
        <template x-for="t in tags" :key="t.id">
          <option :value="t.id" x-text="t.name"></option>
        </template>
      </select>
      <!-- S45 (owner directive: projects functionality): user-facing sort. 'stage' =
           the historical order (status groups → recency); 'recent' = updated_at DESC —
           the "never lose your place" answer; 'title' = alphabetical. Rides the form so
           htmx serializes it with every filter request; the page mount syncs ?sort= /
           the localStorage pref. -->
      <select name="sort" aria-label="Sort" data-i18n-aria-label="sort.label" id="sort-select-sel">
        <option value="stage" data-i18n="sort.stage">By stage</option>
        <option value="recent" data-i18n="sort.recent">Recently updated</option>
        <option value="title" data-i18n="sort.title">Name</option>
      </select>
    </form>

    <!-- R2.3: Saved filters (localStorage-backed chips). Save the current filter combo as a
         named chip; click to re-apply. Zero server state — pure client convenience. -->
    <div id="saved-filters" class="saved-filters" hidden>
      <span class="saved-filters-label muted small" data-i18n="filters.saved">Saved:</span>
      <div id="saved-filters-list" class="saved-filters-list"></div>
      <button type="button" class="ghost small saved-filter-add" id="save-filter-btn" data-i18n-title="filters.saveCurrent" title="Save current filter" data-tooltip="Save current filter" data-i18n-tooltip="filters.saveCurrent">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <!-- hx-include="form.filters" (2026-08-30 (g)): the initial load now serializes the
         filter form itself, so ?view=kanban / ?status=… URL params — which the page mount
         writes into the form before this trigger fires (nav.js evals pre-DOMContentLoaded;
         soft nav runs page scripts before htmx.process) — reach the server on the FIRST
         request. Before, the load trigger sent a bare GET that overwrote the mount's
         param-carrying reload with the unfiltered cards view — the dashboard's
         “View all → /projects.html?status=…” links landed on an unfiltered list. -->
    <div id="project-list" hx-get="/api/projects" hx-trigger="load" hx-include="form.filters" hx-swap="innerHTML" hx-indicator="#list-loading">
      <div id="list-loading" class="skeleton-loading htmx-indicator" aria-label="Loading projects" role="status">
        <div class="skeleton-grid">
          <div class="skeleton skeleton-box"></div>
          <div class="skeleton skeleton-box"></div>
          <div class="skeleton skeleton-box"></div>
          <div class="skeleton skeleton-box"></div>
          <div class="skeleton skeleton-box"></div>
          <div class="skeleton skeleton-box"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- S46.2 (owner: "a unified + on every page, 3 options: new note / new idea /
       new project"). Replaces the S46 idea-only + (which the owner called "dead-wrong").
       This is the SAME chooser markup as the dashboard's .fab-stack[data-fab] — the
       handlers in app.js are document-delegated (data-quickadd-open / data-projectquickadd
       / data-notequickadd), so dropping this markup on any page that loads app.js Just
       Works. The header «New project» primary button (L55) stays as a page-chrome CTA. -->
  <div class="fab-stack" data-fab>
    <div class="fab-menu" data-fab-menu hidden role="menu">
      <button type="button" class="fab-item" data-quickadd-open role="menuitem" aria-label="New idea" data-i18n-title="fab.idea" title="New idea">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4.2 12.6c.9.7 1.2 1.6 1.2 2.4h6c0-.8.3-1.7 1.2-2.4A7 7 0 0 0 12 2Z"/></svg></span>
        <span data-i18n="fab.idea">New idea</span>
      </button>
      <button type="button" class="fab-item" data-projectquickadd role="menuitem" aria-label="New project" data-i18n-title="fab.project" title="New project">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M12 11v4M10 13h4"/></svg></span>
        <span data-i18n="fab.project">New project</span>
      </button>
      <button type="button" class="fab-item" data-notequickadd role="menuitem" aria-label="New quick note" data-i18n-title="fab.note" title="New quick note">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5h9l5 5v9a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 19V6.5A1.5 1.5 0 0 1 5.5 5Z"/><path d="M8 12h8M8 15.5h5"/></svg></span>
        <span data-i18n="fab.note">Quick note</span>
      </button>
    </div>
    <button class="fab" data-fab-toggle type="button" aria-expanded="false" aria-label="New" data-i18n-title="fab.new" title="New">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <script src="/js/projects-page.js?v=3" defer></script>
</body>
</html>
