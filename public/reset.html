<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Hibana</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preload" as="font" type="font/woff2" href="/vendor/manrope/Manrope-400.woff2" crossorigin>
  <link rel="stylesheet" href="/css/variables.css?v=5">
  <link rel="stylesheet" href="/css/base.css?v=3">
  <link rel="stylesheet" href="/css/layout.css?v=9">
  <link rel="stylesheet" href="/css/dashboard.css?v=11">
  <link rel="stylesheet" href="/css/dashboard-todo.css?v=5">
  <link rel="stylesheet" href="/css/components.css?v=3">
  <link rel="stylesheet" href="/css/canvas.css?v=6">
  <link rel="stylesheet" href="/css/quicknotes.css?v=6">
  <link rel="stylesheet" href="/css/to-do-list.css?v=2">
  <link rel="stylesheet" href="/css/polish-ui.css?v=4">
  <link rel="stylesheet" href="/css/calendar.css?v=4">
  <link rel="stylesheet" href="/css/notifications.css?v=4">
  <link rel="stylesheet" href="/css/polish-batch.css?v=10">
  <link rel="stylesheet" href="/css/project-header.css?v=16">
  <link rel="stylesheet" href="/css/devboard.css?v=10">
  <link rel="stylesheet" href="/css/misc.css?v=8">
  <link rel="stylesheet" href="/css/themes.css?v=2">
  <link rel="stylesheet" href="/css/rtl.css?v=2">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
  <script src="/js/app.js?v=174" defer></script>
  <script src="/js/hib-init.js?v=1" defer></script>
  <script src="/js/i18n-en.js?v=25" defer></script>
  <script src="/js/i18n.js?v=81" defer></script>

</head>
<body class="auth-page public-page">
  <button class="theme-floater" onclick="window.hibana?.toggleTheme()" title="Theme: light / dark / system" aria-label="Toggle theme" data-i18n-title="auth.themeHint" data-i18n-aria-label="auth.toggleTheme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <main id="main" tabindex="-1" class="auth-card">
    <h1>Hibana</h1>
    <!-- Two states: request a reset email, or land here with ?token= to choose a new password. -->
    <div id="confirm-section" style="display:none">
      <h3 data-i18n="auth.chooseNewPassword">Choose a new password</h3>
      <form method="post" action="/api/auth/reset/confirm" hx-post="/api/auth/reset/confirm" hx-target="#confirm-section" hx-swap="outerHTML">
        <input type="hidden" name="token" id="token">
        <label><span data-i18n="auth.newPassword">New password</span> <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <button type="submit" data-i18n="auth.setPassword">Set password</button>
      </form>
      <p id="reset-msg-conf"></p>
    </div>
    <div id="request-section">
      <h3 data-i18n="auth.resetYourPassword">Reset your password</h3>
      <form method="post" action="/api/auth/reset/request" hx-post="/api/auth/reset/request" hx-target="#request-section" hx-swap="outerHTML">
        <label><span data-i18n="auth.email">Email</span> <input type="email" name="email" required autocomplete="email"></label>
        <button type="submit" data-i18n="auth.emailResetLink">Email me a reset link</button>
      </form>
      <p class="muted small" data-i18n="auth.resetLinkHint">If the address exists, a link arrives within a minute.</p>
      <p id="reset-msg-req"></p>
    </div>
    <p class="small"><a href="/login.html" data-i18n="auth.backToSignin">← Back to sign in</a></p>
    <script>
      const t = new URLSearchParams(location.search).get('token')
      if (t) {
        document.getElementById('token').value = t
        document.getElementById('confirm-section').style.display = ''
        document.getElementById('request-section').style.display = 'none'
      }
    </script>
  </main>
</body>
</html>
