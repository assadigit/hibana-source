<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Hibana</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/css/app.css?v=185">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
  <script src="/js/app.js?v=158" defer></script>
  <script src="/js/touch-drag.js" defer></script>
  <script src="/vendor/htmx.min.js" defer></script>
</head>
<body class="auth-page public-page">
  <button class="theme-floater" onclick="window.hibana?.toggleTheme()" title="Theme: light / dark / system" aria-label="Toggle theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <main class="auth-card">
    <h1>Hibana</h1>
    <!-- Two states: request a reset email, or land here with ?token= to choose a new password. -->
    <div id="confirm-section" style="display:none">
      <h3>Choose a new password</h3>
      <form method="post" action="/api/auth/reset/confirm" hx-post="/api/auth/reset/confirm" hx-target="#confirm-section" hx-swap="outerHTML">
        <input type="hidden" name="token" id="token">
        <label>New password <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <button type="submit">Set password</button>
      </form>
      <p id="reset-msg-conf"></p>
    </div>
    <div id="request-section">
      <h3>Reset your password</h3>
      <form method="post" action="/api/auth/reset/request" hx-post="/api/auth/reset/request" hx-target="#request-section" hx-swap="outerHTML">
        <label>Email <input type="email" name="email" required autocomplete="email"></label>
        <button type="submit">Email me a reset link</button>
      </form>
      <p class="muted small">If the address exists, a link arrives within a minute.</p>
      <p id="reset-msg-req"></p>
    </div>
    <p class="small"><a href="/login.html">← Back to sign in</a></p>
    <script>
      const t = new URLSearchParams(location.search).get('token')
      if (t) {
        document.getElementById('token').value = t
        document.getElementById('confirm-section').style.display = ''
        document.getElementById('request-section').style.display = 'none'
      }
    </script>
  </main>
</body>
</html>
