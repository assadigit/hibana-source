<!doctype html>
<!-- Sadhana board — the quadrant to-do app, fully integrated into the Hibana shell
     (2026-08-29): unified topbar via [data-nav] + mobile bottom bar, no separate Sadhana
     header (user request) — language/theme/account live in the Hibana chrome. The board
     keeps its own scoped styles (.sadhana-wrap) and defines the app-wide design system:
     Hibana's app.css tokens follow this palette (warm sand, teal accent, 16px radii). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list — Hibana</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#EDE8DF">
  <link rel="preload" as="font" type="font/woff2" href="/vendor/manrope/Manrope-400.woff2" crossorigin>
  <link rel="stylesheet" href="/css/variables.css?v=11">
  <link rel="stylesheet" href="/css/base.css?v=8">
  <link rel="stylesheet" href="/css/layout.css?v=41">
  <link rel="stylesheet" href="/css/dashboard.css?v=23">
  <link rel="stylesheet" href="/css/dashboard-todo.css?v=18">
  <link rel="stylesheet" href="/css/components.css?v=8">
  <link rel="stylesheet" href="/css/canvas.css?v=8">
  <link rel="stylesheet" href="/css/quicknotes.css?v=28">
  <link rel="stylesheet" href="/css/to-do-list.css?v=9">
  <link rel="stylesheet" href="/css/polish-ui.css?v=29">
  <link rel="stylesheet" href="/css/calendar.css?v=6">
  <link rel="stylesheet" href="/css/notifications.css?v=7">
  <link rel="stylesheet" href="/css/polish-batch.css?v=20">
  <link rel="stylesheet" href="/css/project-header.css?v=38">
  <link rel="stylesheet" href="/css/devboard.css?v=23">
  <link rel="stylesheet" href="/css/misc.css?v=12">
  <link rel="stylesheet" href="/css/themes.css?v=5">
  <link rel="stylesheet" href="/css/claude-dark-theme.css?v=13">
  <link rel="stylesheet" href="/css/rtl.css?v=4">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
  <link rel="stylesheet" href="/vendor/vazir/font-face.css">
  <script>
  /* Pre-paint the saved theme (Hibana's app-wide key) before first render. */
  try{const t=localStorage.getItem('hibana-theme');if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}
  </script>
  <!-- Hibana shell chrome: offline queue, global app (nav partial fetch, theme, SW,
       auth guard), i18n (topbar + title translation), soft-nav, command palette,
       mobile bottom bar, PWA install prompt. No Alpine/htmx — the board is plain JS. -->
  <script src="/js/queue.js?v=2" defer></script>
  <!-- Phase 6 item 2: the full emoji library + the shared picker dialog -->
  <!-- M7: emoji-data.js lazy-loaded by emoji-picker.js on first open (saves 49KB on every page load) -->
  <script src="/js/emoji-picker.js?v=3" defer></script>
  <script src="/js/app.js?v=204" defer></script>
  <script src="/js/hib-init.js?v=9" defer></script>
  <script src="/js/touch-drag.js?v=1" defer></script>
  <script src="/js/i18n-en.js?v=78" defer></script>
  <script src="/js/i18n.js?v=132" defer></script>
  <script src="/js/nav.js?v=23" defer></script>
  <script src="/js/command-palette.js?v=16" defer></script>
  <script src="/js/mobile-nav.js?v=12" defer></script>
  <script src="/js/go-to.js?v=2" defer></script>
  <script src="/js/install-prompt.js?v=1" defer></script>
    <link rel="stylesheet" href="/css/sadhana-board.css?v=21">
</head>
<body class="sadhana-body">
  <div id="hibana-page-loader" aria-hidden="true"><div class="hibana-page-loader-inner"><div class="hibana-loader-mark" aria-hidden="true"><span class="hibana-loader-glyph">H</span><span class="hibana-loader-orbit"><span class="hibana-loader-spark"></span></span></div><span class="hibana-page-loader-brand">Hibana</span><div class="hibana-loader-track" aria-hidden="true"><span class="hibana-loader-fill"></span></div></div></div>
<!-- Unified Hibana chrome: the topbar partial (brand, nav links incl. To-do list,
     user menu, language, theme) injects here via app.js; ≤720px it is hidden and
     mobile-nav.js builds the bottom tab bar instead. -->
<div data-nav></div>

<!-- a11y (S51-A): main landmark — was a plain div; every class-based selector in
     sadhana-board.css / dashboard-todo.css / sadhana-page.js keeps matching (element
     name only changed). Fixes axe landmark-one-main + gives the skip link a target.
     The sr-only h1 (first real heading was an h2 in the quadrants — axe
     page-has-heading-one) lives INSIDE main so it sits in a landmark (axe region). -->
<main class="sadhana-wrap">
<h1 class="sr-only" data-i18n="nav.sadhana">To-do list</h1>
<div class="page-shell">

<div class="subbar-wrap">
  <div class="subbar-inner">
    <!-- Date pill (was in the old header; hidden on phones) -->
    <div id="hdrDate" class="hdr-date"></div>
    <!-- Calendar system (2026-08-29 user request): NO manual toggle — the board follows
         the locale automatically (fa → Jalali/shamsi, en → Gregorian). setLang re-derives. -->
    <!-- Telegram linking lives in Hibana Settings → Telegram (user request 2026-08-29). -->
    <!-- Archive (was in the old user menu) -->
    <button class="btn btn-primary" id="archiveBtn" onclick="openArchive()">
      <span class="umenu-ico">🗄️</span><span id="archiveLbl">Archive</span>
    </button>
    <!-- Filter tags — S46 (user request 2026-09-14): hidden behind a toggle so they
         don't crowd the header. The #filterCount span (below) stays visible so the
         active filter is still announced when the toggle is closed. -->
    <details class="filter-tags-toggle" id="filterTagsToggle">
      <summary class="filter-tags-summary" aria-label="Filter by tag"><span class="ftag-summary-ico" aria-hidden="true">🏷️</span><span data-i18n="tags.label">Tags</span><span class="ftag-summary-chev" aria-hidden="true">▾</span></summary>
      <div class="filter-tags" id="filterTags"></div>
    </details>
    <span style="font-size:10.5px;color:var(--text-dim);white-space:nowrap;margin-inline-start:8px" id="filterCount"></span>
    <!-- Primary action (was in the old header) -->
    <button class="btn btn-primary" id="addTaskBtn" onclick="openQA()">＋ Add Task</button>
  </div>
</div>

<div class="mat-outer">
  <div class="mat-grid" id="matGrid">
  <!-- S50: skeleton boot state — four quadrant-shaped placeholders in the same 2×2
       geometry the real board renders into (≤740px keeps ONE: the carousel shows a
       quadrant per view). Replaces the bare «Loading…» text, which read as a glitch
       flash before the board painted. #boardLoading keeps its id — the e2e contract
       (sadhana.spec.ts openSadhana) waits for this element to detach on healthy boot. -->
  <div class="sadhana-loading sadhana-sk" id="boardLoading" role="status">
    <span class="sr-only" data-i18n="common.loading">Loading…</span>
    <div class="sk-quad" aria-hidden="true">
      <div class="sk-quad-hero"><div class="skeleton sk-quad-ico"></div><div><div class="skeleton sk-quad-title"></div><div class="skeleton sk-quad-sub"></div></div></div>
      <div class="skeleton sk-task"></div><div class="skeleton sk-task"></div><div class="skeleton sk-task"></div>
    </div>
    <div class="sk-quad" aria-hidden="true">
      <div class="sk-quad-hero"><div class="skeleton sk-quad-ico"></div><div><div class="skeleton sk-quad-title"></div><div class="skeleton sk-quad-sub"></div></div></div>
      <div class="skeleton sk-task"></div><div class="skeleton sk-task"></div><div class="skeleton sk-task"></div>
    </div>
    <div class="sk-quad" aria-hidden="true">
      <div class="sk-quad-hero"><div class="skeleton sk-quad-ico"></div><div><div class="skeleton sk-quad-title"></div><div class="skeleton sk-quad-sub"></div></div></div>
      <div class="skeleton sk-task"></div><div class="skeleton sk-task"></div><div class="skeleton sk-task"></div>
    </div>
    <div class="sk-quad" aria-hidden="true">
      <div class="sk-quad-hero"><div class="skeleton sk-quad-ico"></div><div><div class="skeleton sk-quad-title"></div><div class="skeleton sk-quad-sub"></div></div></div>
      <div class="skeleton sk-task"></div><div class="skeleton sk-task"></div><div class="skeleton sk-task"></div>
    </div>
  </div>
  </div>
  <!-- Carousel guidance (≤740px only, hidden on desktop): dots + one-time swipe hint.
       Built by buildQuadDots() after the grid renders; siblings of #matGrid so they
       survive every re-render. -->
  <div class="quad-dots" id="quadDots" role="tablist" aria-label="Quadrants"></div>
  <div class="swipe-hint" id="swipeHint" aria-hidden="true"><span id="swipeHintTxt">Swipe</span><span aria-hidden="true">›</span></div>
</div>

</div><!-- page-shell -->

<!-- Undo toast -->
<div class="undo-toast" id="undoToast" role="status">
  <span id="undoMsg">Task deleted</span>
  <button class="undo-btn" id="undoBtn" onclick="undoDelete()">↩ Undo</button>
</div>

<!-- Zen overlay -->
<div class="zen-overlay" id="zenOv" onclick="closeZen()"></div>
<div class="zen-card" id="zenCard" role="dialog" aria-modal="true" aria-label="Focus">
  <div class="zen-header" id="zenHeader"></div>
  <div class="zen-body" id="zenBody"></div>
  <div class="zen-footer" id="zenFooter"></div>
</div>

<!-- Quick Add Modal -->
<div class="modal-bg" id="qaModal" onclick="if(event.target===this)this.classList.remove('open')" role="dialog" aria-modal="true" aria-label="Quick add task">
  <div class="modal">
    <div class="mtitle" id="mTitle">Quick Add Task</div>
    <div class="mfield">
      <label class="mlbl" id="mLblTask" for="mInp">Task</label>
      <div class="mrow">
        <div class="mep-btn" id="mep" onclick="openEP('modal',0)" role="button" tabindex="0">📌</div>
        <textarea class="ai" id="mInp" rows="2" style="flex:1" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.ctrlKey){event.preventDefault();addFromModal();}"></textarea>
      </div>
    </div>
    <div class="mfield">
      <label class="mlbl" id="mLblQ" for="mQ">Quadrant</label>
      <select class="sel-in" id="mQ"></select>
    </div>
    <div class="mfield">
      <textarea class="ai" id="mNote" rows="2" placeholder="Note (optional)…" style="font-size:12px;color:var(--text-muted)"></textarea>
    </div>
    <!-- Tags + Deadline + Recurring — always visible in modal -->
    <div id="mAdvanced">
      <div class="mfield">
        <label class="mlbl" id="mLblTags">Tags</label>
        <div class="tag-picker" id="mTags"></div>
      </div>
      <div class="mfield">
        <label class="mlbl" id="mLblDL">Deadline</label>
        <button class="dl-trigger" id="mDLTrigger" onclick="openDLP('m',this)">
          <span class="dl-trigger-ico">📅</span>
          <span id="mDLLabel">—</span>
        </button>
      </div>
      <div class="mfield">
        <label class="mlbl" id="mLblRecur">Recurring</label>
        <div id="mRecurUI"></div>
      </div>
    </div>
    <div class="m-acts">
      <button class="btn" onclick="document.getElementById('qaModal').classList.remove('open')" id="mCancel">Cancel</button>
      <button class="btn btn-primary" onclick="addFromModal()" id="mSubmit">Add Task</button>
    </div>
  </div>
</div>

<!-- Archive overlay (in-page view) -->
<div class="arch-ov" id="archOv" onclick="if(event.target===this)closeArchive()" role="dialog" aria-modal="true" aria-label="Archive">
  <div class="arch-modal">
    <div class="arch-head">
      <div class="arch-title" id="archTitle">🗄️ Archive</div>
      <button class="btn" onclick="closeArchive()" id="archClose">✕ Close</button>
    </div>
    <div class="arch-body" id="archBody"><div class="arch-empty">Loading…</div></div>
  </div>
</div>

<!-- Deadline Popup (single shared, repositioned on open) -->
<div class="ep-ov" id="dlpOv" onclick="closeDLP()" style="z-index:590"></div>
<div class="dl-popup" id="dlPopup" role="dialog" aria-label="Deadline picker">
  <div class="dl-popup-tabs">
    <button class="dl-ptab active" id="dlTabFuz" onclick="dlpTab('fuz')">Fuzzy</button>
    <button class="dl-ptab" id="dlTabStep" onclick="dlpTab('step')">📅 Pick date</button>
  </div>
  <div id="dlpFuzContent">
    <div class="dl-fuzzy-grid" id="dlpFuzGrid"></div>
  </div>
  <div id="dlpStepContent" style="display:none">
    <div class="step-picker" id="dlpStepPicker"></div>
  </div>
  <div class="dl-popup-foot">
    <button class="btn" style="font-size:11px;padding:4px 9px" onclick="clearDL()" id="dlClearBtn">Clear</button>
    <button class="btn btn-primary" style="font-size:11px;padding:4px 9px" onclick="closeDLP()">Done</button>
  </div>
</div>

<!-- Emoji Picker — Phase 6 item 2: the shared /js/emoji-picker.js dialog builds its own DOM -->

<!-- Quadrant rename + symbol popover (2026-09-02): opened by the ✎ pen that appears on
     hover over a quadrant name. Name + subheading + emoji save together via PATCH
     /api/sadhana/quadrants/:q (2026-08-29: subheading input added). -->
<div class="qe-ov" id="qeOv" onclick="closeQEdit()"></div>
<div class="qe-pop" id="qePop" role="dialog" aria-label="Rename quadrant">
  <div class="qe-row">
    <button type="button" class="qe-emo" id="qeEmo" onclick="openEP('quad',0)" title="Symbol">📌</button>
    <!-- S83 (owner request): the minimalist's choice — EMPTY, no icon and no emoji.
         aria-pressed reflects the saved state; picking any emoji turns it off. -->
    <button type="button" class="qe-empty" id="qeEmpty" onclick="clearQEmoji()" aria-pressed="false" title="No icon — minimalist">∅</button>
    <input class="qe-name" id="qeName" maxlength="60" autocomplete="off">
  </div>
  <input class="qe-name" id="qeSub" maxlength="120" autocomplete="off" style="font-size:12px;color:var(--text-muted);font-weight:400">
  <!-- S93 (owner round, item 6): the 16 pastel swatches + ∅ — picked here, saved with
       the rename (accent_color). sadhana-page.js builds the buttons. -->
  <div class="qe-swatch-lbl" id="qeSwatchLbl">Pastel color</div>
  <div class="qe-swatches" id="qeSwatches" role="group" aria-label="Pastel color"></div>
  <div class="qe-acts">
    <button type="button" class="qe-save" id="qeSave" onclick="saveQEdit()">Save</button>
    <button type="button" class="btn" onclick="closeQEdit()" id="qeCancel">Cancel</button>
  </div>
</div>

</main><!-- /.sadhana-wrap — everything the board styles lives in here; the Hibana
          chrome (topbar + bottom bar + cmdk + toasts) sits outside and keeps app.css -->

  <!-- S46.2: the unified + chooser (new note / new idea / new project) — same markup
       as the dashboard's. The header «＋ Add Task» button stays as a sadhana-specific
       quadrant composer; this FAB is the consistent cross-surface capture. -->
  <div class="fab-stack" data-fab>
    <div class="fab-menu" data-fab-menu hidden role="menu">
      <button type="button" class="fab-item" data-quickadd-open role="menuitem" aria-label="New idea" data-i18n-title="fab.idea" title="New idea">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4.2 12.6c.9.7 1.2 1.6 1.2 2.4h6c0-.8.3-1.7 1.2-2.4A7 7 0 0 0 12 2Z"/></svg></span>
        <span data-i18n="fab.idea">New idea</span>
      </button>
      <button type="button" class="fab-item" data-projectquickadd role="menuitem" aria-label="New project" data-i18n-title="fab.project" title="New project">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M12 11v4M10 13h4"/></svg></span>
        <span data-i18n="fab.project">New project</span>
      </button>
      <!-- S54: the vault joins the canonical capture set — idea / project / long note /
           quick note. Lands on /notes?new=1 (soft-nav), which boots a fresh note. -->
      <a class="fab-item" href="/notes.html?new=1" role="menuitem" aria-label="New note" data-i18n-title="fab.vault" title="New note">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5h9l5 5v9a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 19V6.5A1.5 1.5 0 0 1 5.5 5Z"/><path d="M8 12h8M8 15.5h5"/></svg></span>
        <span data-i18n="fab.vault">New note</span>
      </a>
      <button type="button" class="fab-item" data-notequickadd role="menuitem" aria-label="New quick note" data-i18n-title="fab.note" title="New quick note">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5h9l5 5v9a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 19V6.5A1.5 1.5 0 0 1 5.5 5Z"/><path d="M8 12h8M8 15.5h5"/></svg></span>
        <span data-i18n="fab.note">Quick note</span>
      </button>
    </div>
    <button class="fab" data-fab-toggle type="button" aria-expanded="false" aria-label="New" data-i18n-title="fab.new" title="New">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <script src="/js/jalali.js?v=2" defer></script>
  <script src="/js/sadhana-data.js?v=1" defer></script>
  <script src="/js/sadhana-page.js?v=10" defer></script>
</body>
</html>
