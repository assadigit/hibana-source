<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — Hibana</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preload" as="image" href="/Login.jpg">
  <link rel="stylesheet" href="/css/app.css?v=201">
  <link rel="stylesheet" href="/vendor/manrope/font-face.css">
  <script src="/js/app.js?v=159" defer></script>
  <script src="/js/i18n.js?v=32" defer></script>
  <script src="/js/touch-drag.js" defer></script>
  <script src="/vendor/htmx.min.js" defer></script>
  <!-- Human check (2026-08-30 (e)): a SELF-HOSTED math captcha — no third-party script,
       nothing to load from the internet except our own API, so it works on any connection
       (Cloudflare's challenge domains were unreachable for some users, which made signup
       impossible there — that is why Turnstile was retired). GET /api/auth/captcha mints a
       question plus an HMAC-signed token (10-minute expiry); both fly with the form.
       The native `required` attributes handle empty-field UX; this script only loads/
       refreshes challenges and guards the (rare) unloaded-token submit. -->
  <script>
    function showRegisterNote(text) {
      var err = document.getElementById('register-error')
      if (err) err.innerHTML = '<p class="error">' + text + '</p>'
    }
    var captchaBroken = false // load-failure note is the ONLY note loadCaptcha may clear
    function loadCaptcha() {
      var q = document.getElementById('captcha-q')
      var tok = document.getElementById('captcha-token')
      var ans = document.getElementById('captcha-answer')
      if (q) q.textContent = '…'
      if (tok) tok.value = ''
      fetch('/api/auth/captcha', { headers: { Accept: 'application/json' } })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() })
        .then(function (j) {
          if (q) q.textContent = j.q
          if (tok) tok.value = j.token
          if (ans) ans.value = ''
          // Only a load-FAILURE note is ours to clear — never wipe a server message
          // (the register response lands BEFORE this fetch resolves; clearing here
          // raced the fragment into invisibility — caught by the 2026-08-30 (e) sweep).
          if (captchaBroken) {
            captchaBroken = false
            var note = document.getElementById('register-error')
            if (note) note.innerHTML = ''
          }
        })
        .catch(function () {
          captchaBroken = true
          showRegisterNote('The human check could not load — check your connection and press ↻ to retry.')
        })
    }
    // Fresh challenge after EVERY refused attempt (wrong answer / expired / duplicate
    // email…): htmx swaps the server's fragment into #register-error, and unless the
    // response carried HX-Redirect (success → verification modal), the old question is
    // stale UX. This also auto-recovers an expired challenge for slow typists.
    // (Registered on `document` — this script lives in <head>, before <body> exists.)
    document.addEventListener('htmx:afterRequest', function (e) {
      var f = e.target
      if (!(f instanceof HTMLFormElement) || f.getAttribute('hx-post') !== '/api/auth/register') return
      var xhr = e.detail && e.detail.xhr
      var redirected = xhr && xhr.getResponseHeader && xhr.getResponseHeader('HX-Redirect')
      if (!redirected) loadCaptcha()
    })
    // Cancel the request (not the form) if the challenge never loaded: the server would
    // otherwise answer 400, which htmx deliberately does not display. An empty ANSWER
    // never reaches here — the input's `required` stops the submit natively.
    document.addEventListener('htmx:configRequest', function (e) {
      var f = e.target
      if (!(f instanceof HTMLFormElement) || f.getAttribute('hx-post') !== '/api/auth/register') return
      var tok = f.querySelector('[name=captcha_token]')
      if (!tok || !tok.value) {
        e.preventDefault()
        showRegisterNote('The human check is still loading — one moment, then try again.')
      }
    })
    document.addEventListener('DOMContentLoaded', loadCaptcha)
  </script>
</head>
<body class="auth-page auth-split-page public-page">
  <a href="#main" class="skip-link" data-i18n="a11y.skipToMain">Skip to main content</a>
  <button class="theme-floater" onclick="window.hibana?.toggleTheme()" title="Theme: light / dark / system" aria-label="Toggle theme" data-i18n-title="auth.themeHint" data-i18n-aria-label="auth.toggleTheme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

  <main id="main" tabindex="-1" class="auth-split">
    <!-- 60% — full-bleed photo (Login.jpg) with a small corner brand only -->
    <section class="auth-visual" aria-hidden="true">
      <span class="auth-brand"><img class="auth-logo" src="/logo-dark.png" alt="Hibana"></span>
    </section>

    <!-- 40% — sign-up form -->
    <section class="auth-form">
      <span class="auth-brand-inline" aria-hidden="true"><img class="auth-logo-inline" src="/logo-light.png" alt=""></span>
      <div>
        <h2 data-i18n="auth.createYourAccount">Create your account</h2>
      </div>
      <form
        method="post"
        action="/api/auth/register"
        hx-post="/api/auth/register"
        hx-target="#register-error"
        hx-swap="innerHTML"
        hx-indicator="#register-spinner"
      >
        <label><span data-i18n="auth.inviteCode">Invite code</span>
          <input type="text" name="inviteCode" required maxlength="100" autocomplete="off" placeholder="Ask an existing user for a code" data-i18n-placeholder="auth.inviteCodePlaceholder">
        </label>
        <label><span data-i18n="auth.username">Username</span>
          <input type="text" name="username" required minlength="3" maxlength="40" pattern="[a-z0-9_\-]{3,40}" autocomplete="username" placeholder="lowercase letters, numbers, _ or -" data-i18n-placeholder="auth.usernamePlaceholder">
        </label>
        <label><span data-i18n="auth.email">Email</span>
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label><span data-i18n="auth.password">Password</span>
          <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" data-i18n-placeholder="auth.passwordPlaceholder">
        </label>
        <!-- Human check: the math question + its signed token come from our own API.
             The answer input is required (native validation covers empty submits); the
             ↻ button mints a fresh question any time (expiry is server-side, 10 min). -->
        <label><span data-i18n="auth.captcha">Human check</span>
          <span class="row" style="gap:.5rem">
            <b id="captcha-q" style="white-space:nowrap">…</b>
            <input type="text" id="captcha-answer" name="captcha" inputmode="numeric" autocomplete="off" required placeholder="Answer" data-i18n-placeholder="auth.captchaPlaceholder" style="flex:1;min-inline-size:0" dir="ltr">
          </span>
        </label>
        <input type="hidden" name="captcha_token" id="captcha-token" value="">
        <div style="margin-top:-.7rem">
          <button type="button" class="ghost small" onclick="loadCaptcha()"><span aria-hidden="true">↻</span> <span data-i18n="auth.captchaRefresh">New question</span></button>
        </div>
        <div class="row">
          <button type="submit" id="register-submit" data-i18n="auth.createAccountBtn">Create account</button>
          <span id="register-spinner" class="spinner htmx-indicator"></span>
        </div>
        <p id="register-error" role="alert"></p>
      </form>
      <p class="small"><a href="/login.html" data-i18n="auth.alreadyHaveAccount">Already have an account? Sign in</a></p>
    </section>
  </main>

  <!-- Email-code verification modal: opens after a successful signup (?verify=1).
       Four boxes per Ali's spec; verifying sends the user straight to the dashboard. -->
  <dialog id="verify-dialog" class="dialog">
    <form class="modal" id="verify-form" method="post" novalidate>
      <h3 data-i18n="auth.checkInbox">Check your inbox</h3>
      <p class="muted small"><span data-i18n="auth.confirmDesc">We sent a 4-digit code to</span> <b id="verify-email-label" data-i18n="auth.yourInbox">your inbox</b>. <span data-i18n="auth.confirmDesc2">It expires in 15 minutes.</span></p>
      <div class="code-boxes" id="verify-boxes">
        <input type="text" inputmode="numeric" pattern="[0-9۰-۹]" maxlength="1" autocomplete="off" aria-label="First digit" data-i18n-aria-label="auth.codeDigit1">
        <input type="text" inputmode="numeric" pattern="[0-9۰-۹]" maxlength="1" autocomplete="off" aria-label="Second digit" data-i18n-aria-label="auth.codeDigit2">
        <input type="text" inputmode="numeric" pattern="[0-9۰-۹]" maxlength="1" autocomplete="off" aria-label="Third digit" data-i18n-aria-label="auth.codeDigit3">
        <input type="text" inputmode="numeric" pattern="[0-9۰-۹]" maxlength="1" autocomplete="off" aria-label="Fourth digit" data-i18n-aria-label="auth.codeDigit4">
      </div>
      <p id="verify-msg" role="alert"></p>
      <div class="row">
        <button type="submit" id="verify-submit" data-i18n="auth.verify">Verify</button>
        <button type="button" class="ghost" id="verify-resend" data-i18n="auth.resend">Resend code</button>
      </div>
    </form>
  </dialog>

  <script>
    // Verification modal logic — plain fetch (no htmx needed for a one-shot dialog).
    ;(function () {
      var params = new URLSearchParams(location.search)
      var email = params.get('email') || ''
      var dlg = document.getElementById('verify-dialog')
      var boxes = Array.from(document.querySelectorAll('#verify-boxes input'))
      var msg = document.getElementById('verify-msg')
      var submitting = false
      if (!dlg || !boxes.length) return

      function showMsg(html) { msg.innerHTML = html }
      function code() { return boxes.map(function (b) { return b.value }).join('') }

      document.getElementById('verify-boxes').addEventListener('input', function (e) {
        var t = e.target
        t.value = t.value.replace(/\D/g, '').slice(0, 1)
        var i = boxes.indexOf(t)
        if (t.value && i < boxes.length - 1) boxes[i + 1].focus()
      })
      document.getElementById('verify-boxes').addEventListener('keydown', function (e) {
        var t = e.target
        if (e.key === 'Backspace' && !t.value && t !== boxes[0]) {
          e.preventDefault()
          boxes[boxes.indexOf(t) - 1].focus()
        }
        if (e.key === 'Enter') e.preventDefault() // submit via the form handler
      })

      document.getElementById('verify-form').addEventListener('submit', async function (e) {
        e.preventDefault()
        if (submitting) return
        if (code().length < 4) { showMsg('<p class="error">Enter the 4-digit code from your email.</p>'); return }
        submitting = true
        var btn = document.getElementById('verify-submit')
        btn.disabled = true
        showMsg('<p class="muted small">Checking…</p>')
        try {
          var res = await fetch('/api/auth/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, code: code() }),
          })
          var j = await res.json().catch(function () { return {} })
          if (res.ok && j.ok) {
            showMsg('<p class="muted">Verified! Opening your dashboard…</p>')
            location.href = '/app'
            return
          }
          showMsg(
            { invalid_code: '<p class="error">That code doesn&#39;t match — check it and try again.</p>',
              invalid_or_expired_code: '<p class="error">That code expired — hit Resend for a fresh one.</p>',
              code_invalidated: '<p class="error">Too many wrong attempts — hit Resend for a new code.</p>',
              already_verified: '<p class="error">This account is already verified — sign in instead.</p>' }[j.error] ||
            '<p class="error">Could not verify — try again.</p>')
          boxes.forEach(function (b) { b.value = '' })
          boxes[0].focus()
        } catch {
          showMsg('<p class="error">Could not reach the server — check your connection.</p>')
        } finally {
          submitting = false
          btn.disabled = false
        }
      })

      document.getElementById('verify-resend').addEventListener('click', async function () {
        var btn = this
        btn.disabled = true
        try {
          var res = await fetch('/api/auth/verify/resend', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email }),
          })
          var j = await res.json().catch(function () { return {} })
          showMsg(j.error === 'resend_cooldown'
            ? '<p class="muted small">Wait a minute between resends.</p>'
            : j.error
              ? '<p class="error">Could not resend — try again in a minute.</p>'
              : '<p class="muted small">Code sent — check your inbox.</p>')
        } catch {
          showMsg('<p class="error">Could not reach the server.</p>')
        } finally {
          btn.disabled = false
        }
      })

      if (params.get('verify') === '1') {
        document.getElementById('verify-email-label').textContent = email || (window.hibanaI18n?.t('auth.yourInbox') ?? 'your inbox')
        dlg.showModal()
        boxes[0].focus()
      }
    })()
  </script>
</body>
</html>
