<body>
  <div id="hibana-page-loader" aria-hidden="true"><div class="hibana-page-loader-inner"><div class="hibana-loader-mark" aria-hidden="true"><span class="hibana-loader-glyph">H</span><span class="hibana-loader-orbit"><span class="hibana-loader-spark"></span></span></div><span class="hibana-page-loader-brand">Hibana</span><div class="hibana-loader-track" aria-hidden="true"><span class="hibana-loader-fill"></span></div></div></div>
  <div data-nav></div>
  <!-- S161 (spec #6): the LEAN idea detail page — title/description/tags/folder/links/
       images only. The Kanban board, Sprints, Categories, Notes/Problems/Plans tabs and
       the Latest Activity bar stay EXCLUSIVE to the heavy project template; a spark
       opens here (POST /api/projects HX-Redirect + project.html's HX hand-off). -->
  <main class="shell" id="main" tabindex="-1">
    <div id="spark-notfound" class="empty-state empty" hidden>
      <span class="empty-state-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4.2 12.6c.9.7 1.2 1.6 1.2 2.4h6c0-.8.3-1.7 1.2-2.4A7 7 0 0 0 12 2Z"/></svg></span>
      <p class="empty-state-title" data-i18n="spark.notFound">This idea doesn't exist or was deleted.</p>
      <a class="empty-state-cta btn ghost" href="/sparks.html" data-i18n="spark.backToIdeas">Back to Ideas</a>
    </div>
    <div id="spark-loading" class="skeleton-loading" role="status" aria-label="Loading idea" data-i18n-aria-label="spark.loadingAria">
      <div class="skeleton skeleton-line w-60" style="height:1.5rem"></div>
      <div class="skeleton skeleton-line w-40"></div>
      <div class="skeleton skeleton-box"></div>
      <div class="skeleton skeleton-line"></div>
    </div>
    <div id="spark-detail" hidden>
      <div class="row spread spark-top">
        <a class="ghost small spark-back" href="/sparks.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> <span data-i18n="spark.backToIdeas">Back to Ideas</span></a>
        <div class="row spark-top-actions">
          <button type="button" id="spark-pin" class="spark-pin" data-nav-local aria-pressed="false" data-i18n-title="sparks.pin" title="Pin idea"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v4M8.5 3.5h7l-.8 7.2 2.8 2.8v1.5H6.5v-1.5l2.8-2.8-.8-7.2Z"/></svg></button>
          <button type="button" id="spark-delete" class="ghost small danger" data-i18n="spark.deleteIdea">Delete idea</button>
        </div>
      </div>
      <!-- S171: the WHEN line — Created · Updated, relative units, FA digits on the
           Persian locale. Hidden until the idea loads (renderMeta owns it). -->
      <p class="spark-meta-line muted small" id="spark-meta" hidden></p>
      <div class="spark-layout">
        <div class="spark-main card">
          <label class="spark-field">
            <span class="spark-lbl" data-i18n="spark.title">Title</span>
            <input id="spark-title" maxlength="200" autocomplete="off" data-magic="" data-i18n-aria-label="spark.titleAria" aria-label="Idea title">
          </label>
          <label class="spark-field">
            <span class="spark-lbl" data-i18n="spark.description">Description</span>
            <textarea id="spark-desc" rows="4" maxlength="2000" data-magic="" data-i18n-aria-label="spark.descAria" aria-label="Idea description"></textarea>
          </label>
          <div class="spark-field">
            <span class="spark-lbl" data-i18n="spark.tags">Tags</span>
            <div class="row wrap spark-tags" id="spark-tags"></div>
          </div>
          <label class="spark-field">
            <span class="spark-lbl" data-i18n="spark.folder">Folder</span>
            <select id="spark-folder-sel"></select>
          </label>
          <div class="spark-field">
            <span class="spark-lbl" data-i18n="spark.links">Links</span>
            <ul id="links" class="links spark-links" aria-live="polite"></ul>
            <form class="row spark-link-form" id="spark-link-form">
              <input name="label" placeholder="Label (Repo, Live…)" data-magic="" data-i18n-placeholder="spark.linkLabelPh" maxlength="100" data-i18n-aria-label="spark.linkLabelAria" aria-label="Link label">
              <input name="url" placeholder="https://…" required data-i18n-aria-label="spark.urlAria" aria-label="Link URL">
              <button type="submit" data-i18n="spark.addLink">Add link</button>
            </form>
          </div>
          <div class="row spread spark-save-row">
            <div class="row">
              <button type="button" id="spark-save" data-i18n="spark.save">Save</button>
              <span id="spark-status" class="muted small" role="status" aria-live="polite"></span>
            </div>
          </div>
        </div>
        <div class="spark-side card">
          <h3 class="spark-images-h" data-i18n="spark.images">Images</h3>
          <div id="spark-gallery" class="spark-gallery"></div>
          <div id="spark-drop" class="spark-drop" data-i18n-title="spark.dropHint" title="Drop, paste, or browse to upload">
            <span class="muted small" data-i18n="spark.dropHint">Drop, paste, or browse to upload</span>
            <button type="button" class="ghost small" id="spark-pick" data-i18n="spark.browse">Browse</button>
          </div>
          <input type="file" id="spark-file" accept="image/*" multiple hidden>
        </div>
      </div>
    </div>
    <!-- The lightbox lives INSIDE main.shell: nav.js soft-nav swaps the shell only, so
         anything this page's script binds to must survive… no — anything OUTSIDE the
         shell is never swapped but ALSO never re-created; the S167 lesson is the
         inverse: the shell IS what nav replaces, and page scripts re-run per swap, so
         page-owned overlays must live inside the shell they're torn down with. -->
    <div id="spark-lightbox" class="shot-lightbox" hidden></div>
  </main>

  <script src="/js/resume.js?v=11" defer></script>
  <script src="/js/image-resize.js?v=1" defer></script>
  <script src="/js/image-crop.js?v=2" defer></script>
  <script src="/js/spark-page.js?v=5" defer></script>
</body>
