<body>
  <div data-nav></div>
  <main class="shell" id="main" tabindex="-1">
    <div class="row spread">
      <h1 data-i18n="sparks.heading">Ideas</h1>
      <!-- Phase 6 item 3: the ideas get the projects page's «نمایش:» dropdown (same
           component, remembered preference). KANBAN here files ideas into folders:
           each column is a پوشه, dragging a card moves it. -->
      <div class="row wrap">
        <div class="view-select" role="group" aria-label="View">
          <label class="small muted" for="sparks-view-sel" data-i18n="view.label">View</label>
          <select id="sparks-view-sel" aria-label="View">
            <option value="cards" data-i18n="view.cards">Cards</option>
            <option value="list" data-i18n="view.list">List</option>
            <option value="sticky" data-i18n="view.sticky">Sticky Notes</option>
            <option value="kanban" data-i18n="view.kanban">Kanban</option>
          </select>
        </div>
        <button data-quickadd-open><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> <span data-i18n="sparks.capture">Capture an idea</span></button>
      </div>
    </div>
    <p class="muted" data-i18n="sparks.hint">The whiteboard replacement — capture in seconds, promote later.</p>

    <!-- Task 24: the indicator lives OUTSIDE the shelf — an innerHTML swap of #spark-shelf
         used to delete #shelf-loading, leaving every later poll/reload logging
         "hx-indicator returned no matches". -->
    <div id="shelf-loading" class="loading htmx-indicator hibana-loading-row"><span class="hibana-spinner" role="status" aria-hidden="true"></span><span data-i18n="common.loading">Loading…</span></div>
    <!-- batch (s): the ACTIVE folder selection lives in this hidden input OUTSIDE the swap
         target — hx-include serializes it into the 30s poll and the load trigger, so the
         poll never resets the filter. The folder BAR itself rides inside the fragment. -->
    <input type="hidden" id="spark-folder" name="folder" value="">
    <!-- Phase 6 item 3: the view rides the poll exactly like the folder selection —
         hx-include serializes BOTH hidden inputs (outside the swap target) so the 30s
         poll never resets the view or the folder filter. -->
    <input type="hidden" id="spark-view" name="view" value="cards">
    <div id="spark-shelf" hx-get="/api/projects?status=spark" hx-trigger="load, every 30s" hx-include="#spark-folder,#spark-view" hx-swap="innerHTML" hx-indicator="#shelf-loading"></div>
  </main>

  <script src="/dist/sparks-page.031b8a79.js" defer></script>
</body>
