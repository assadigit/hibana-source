  <!-- S41: the folder dialog's emoji icon picker (shared /js/emoji-picker.js —
       emoji-data.js lazy-loads on first open; docks as a bottom sheet under 640px). -->
  <script src="/js/emoji-picker.js?v=3" defer></script>

<body>
  <div id="hibana-page-loader" aria-hidden="true"><div class="hibana-page-loader-inner"><div class="hibana-page-loader-spinner"></div><span class="hibana-page-loader-brand">Hibana</span></div></div>
  <div data-nav></div>
  <main class="shell" id="main" tabindex="-1">
    <!-- S41: sparks-head — the mobile CSS target. At ≤640px the row stacks: h1, then
         capture (flex-1, the primary action) + the compact view select side by side,
         the «نمایش:» label goes screen-reader-only to reclaim the width. -->
    <div class="row spread sparks-head">
      <h1 data-i18n="sparks.heading">Ideas</h1>
      <!-- Phase 6 item 3: the ideas get the projects page's «نمایش:» dropdown (same
           component, remembered preference). KANBAN here files ideas into folders:
           each column is a پوشه, dragging a card moves it. -->
      <div class="row wrap">
        <div class="view-select" role="group" aria-label="View">
          <label class="small muted" for="sparks-view-sel" data-i18n="view.label">View</label>
          <select id="sparks-view-sel" aria-label="View">
            <option value="cards" data-i18n="view.cards">Cards</option>
            <option value="list" data-i18n="view.list">List</option>
            <option value="sticky" data-i18n="view.sticky">Sticky Notes</option>
            <option value="kanban" data-i18n="view.kanban">Kanban</option>
          </select>
        </div>
        <button data-quickadd-open><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> <span data-i18n="sparks.capture">Capture an idea</span></button>
      </div>
    </div>
    <p class="muted" data-i18n="sparks.hint">The whiteboard replacement — capture in seconds, promote later.</p>

    <!-- Task 24: the indicator lives OUTSIDE the shelf — an innerHTML swap of #spark-shelf
         used to delete #shelf-loading, leaving every later poll/reload logging
         "hx-indicator returned no matches". S50: the spinner row became a SKELETON grid
         matching the shelf's card layout (the projects-page pattern, polish-ui.css) —
         the load reads as "content is coming" instead of a bare spinner flash. -->
    <div id="shelf-loading" class="skeleton-loading htmx-indicator" role="status" aria-label="Loading ideas">
      <div class="skeleton-grid" aria-hidden="true">
        <div class="sk-card"><div class="skeleton sk-card-ico"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line w-60"></div></div>
        <div class="sk-card"><div class="skeleton sk-card-ico"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line w-60"></div></div>
        <div class="sk-card"><div class="skeleton sk-card-ico"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line w-60"></div></div>
        <div class="sk-card"><div class="skeleton sk-card-ico"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line w-60"></div></div>
        <div class="sk-card"><div class="skeleton sk-card-ico"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line w-60"></div></div>
        <div class="sk-card"><div class="skeleton sk-card-ico"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line w-60"></div></div>
      </div>
      <span class="sr-only" data-i18n="common.loading">Loading…</span>
    </div>
    <!-- batch (s): the ACTIVE folder selection lives in this hidden input OUTSIDE the swap
         target — hx-include serializes it into the 30s poll and the load trigger, so the
         poll never resets the filter. The folder BAR itself rides inside the fragment. -->
    <input type="hidden" id="spark-folder" name="folder" value="">
    <!-- S40: restore the remembered folder SYNCHRONOUSLY, before htmx's deferred init
         fires the #spark-shelf load trigger — otherwise the first fetch boots folder-less
         (the folder grid) and only a later refetch would land in the folder (a visible
         grid→folder flash on every reload). Runs during parse; CSP allows inline. -->
    <script>
      try {
        var __sf = JSON.parse(localStorage.getItem('hibana-sparks-folder') || 'null')
        if (__sf && typeof __sf.id === 'string' && __sf.id && __sf.id !== 'all') {
          var __inp = document.getElementById('spark-folder')
          if (__inp) {
            __inp.value = __sf.id
            __inp.dataset.folderName = __sf.name || ''
          }
        }
      } catch (e) { /* storage unavailable — boot folder-less, the grid home */ }
    </script>
    <!-- Phase 6 item 3: the view rides the poll exactly like the folder selection —
         hx-include serializes BOTH hidden inputs (outside the swap target) so the 30s
         poll never resets the view or the folder filter. -->
    <input type="hidden" id="spark-view" name="view" value="cards">
    <div id="spark-shelf" hx-get="/api/projects?status=spark" hx-trigger="load, every 30s" hx-include="#spark-folder,#spark-view" hx-swap="innerHTML" hx-indicator="#shelf-loading"></div>
  </main>

  <!-- S46.2: the unified + chooser (new note / new idea / new project) — same markup
       as the dashboard's. The header «Capture an idea» primary button stays as a
       page-chrome CTA; this FAB is the consistent cross-surface capture. -->
  <div class="fab-stack" data-fab>
    <div class="fab-menu" data-fab-menu hidden role="menu">
      <button type="button" class="fab-item" data-quickadd-open role="menuitem" aria-label="New idea" data-i18n-title="fab.idea" title="New idea">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4.2 12.6c.9.7 1.2 1.6 1.2 2.4h6c0-.8.3-1.7 1.2-2.4A7 7 0 0 0 12 2Z"/></svg></span>
        <span data-i18n="fab.idea">New idea</span>
      </button>
      <button type="button" class="fab-item" data-projectquickadd role="menuitem" aria-label="New project" data-i18n-title="fab.project" title="New project">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M12 11v4M10 13h4"/></svg></span>
        <span data-i18n="fab.project">New project</span>
      </button>
      <!-- S54: the vault joins the canonical capture set — idea / project / long note /
           quick note. Lands on /notes?new=1 (soft-nav), which boots a fresh note. -->
      <a class="fab-item" href="/notes.html?new=1" role="menuitem" aria-label="New note" data-i18n-title="fab.vault" title="New note">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5h9l5 5v9a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 19V6.5A1.5 1.5 0 0 1 5.5 5Z"/><path d="M8 12h8M8 15.5h5"/></svg></span>
        <span data-i18n="fab.vault">New note</span>
      </a>
      <button type="button" class="fab-item" data-notequickadd role="menuitem" aria-label="New quick note" data-i18n-title="fab.note" title="New quick note">
        <span class="fab-item-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5h9l5 5v9a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 19V6.5A1.5 1.5 0 0 1 5.5 5Z"/><path d="M8 12h8M8 15.5h5"/></svg></span>
        <span data-i18n="fab.note">Quick note</span>
      </button>
    </div>
    <button class="fab" data-fab-toggle type="button" aria-expanded="false" aria-label="New" data-i18n-title="fab.new" title="New">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <script src="/js/sparks-page.js?v=6" defer></script>
</body>
</html>
