<body>
  <div data-nav></div>
  <!-- sp-shell: full-bleed flat board (user "flat" reference 2026-08-30: zero shadows,
       hairline grid, zebra sprint columns, solid pastel clips, dashed boundary lines). -->
  <main class="shell sp-shell">
    <div class="sp-toolbar" id="sp-toolbar">
      <a class="btn ghost small" href="/project.html" data-back-link>← <span data-i18n="db.backToProject">Back to project</span></a>
      <h2 id="sp-title" class="db-title">…</h2>
      <span class="db-flex-gap"></span>
      <!-- Phase 5 item 8 (2026-09-08): time PAGING instead of a constant horizontal
           scroll — ‹ steps the visible window one window back in time (older sprints/
           tasks), › steps forward (capped at today). The label shows the window range. -->
      <div class="sp-timenav" id="sp-timenav">
        <button type="button" class="btn ghost small sp-arrow" id="sp-time-prev" aria-label="Older" data-i18n-aria="sp.older" title="Older" data-i18n-title="sp.older"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
        <span class="sp-timerange small muted" id="sp-timerange">…</span>
        <button type="button" class="btn ghost small sp-arrow" id="sp-time-next" aria-label="Newer" data-i18n-aria="sp.newer" title="Newer" data-i18n-title="sp.newer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
      </div>
      <label class="sp-zoom small">
        <span class="sr-only" data-i18n="db.zoom">Zoom</span>
        <select id="sp-zoom-sel" aria-label="Zoom">
          <option value="d" data-i18n="db.zoomDays">Days</option>
          <option value="w1" data-i18n="db.zoom1w">1 week</option>
          <option value="m1" selected data-i18n="db.zoom1m">1 month</option>
          <option value="m3" data-i18n="db.zoom3m">3 months</option>
          <option value="m6" data-i18n="db.zoom6m">6 months</option>
          <option value="y1" data-i18n="db.zoom12m">12 months</option>
        </select>
      </label>
      <a class="btn ghost small" id="sp-board-link" href="#"><span data-i18n="db.board">Board</span></a>
      <!-- Phase 5 item 7: the lifecycle is DEFINE → add items/categories → START →
           continue → FINISH. The ◆ button opens the define dialog (name); the running
           sprint carries a prominent Finish button in the toolbar. -->
      <button type="button" class="btn small" id="sp-new-sprint">◆ <span data-i18n="db.defineSprint">Sprint</span></button>
      <button type="button" class="btn danger small sp-finish-btn" id="sp-finish-btn" hidden>⏹ <span id="sp-finish-lbl">Finish sprint</span></button>
    </div>
    <!-- Phase 5 item 7: the DRAFT sprint panel — a defined-but-not-started sprint lives
         here (name + item count + Start/Delete + a drop target that assigns tasks to it)
         until the user starts it, at which point it moves onto the timeline. -->
    <div class="sp-draft" id="sp-draft" hidden></div>
    <div class="db-loading" id="sp-loading" role="status"><span class="hibana-spinner" aria-hidden="true"></span><span data-i18n="db.loading">Loading…</span></div>
    <div class="sp-wrap" id="sp-wrap" hidden>
      <aside class="sp-side" id="sp-side"></aside>
      <div class="sp-scroll" id="sp-scroll">
        <div class="sp-timeline" id="sp-timeline"></div>
      </div>
    </div>
  </main>
  <script src="/dist/sprint-page.29676a15.js" defer></script>
</body>
</html>
