<body>
  <div data-nav></div>
  <main class="shell" id="main" tabindex="-1">
    <!-- S126: the View all destination for the overview status cards
         (dashboard Plans/Problems/In Progress + the projects home's four).
         The shell is a static htmx container; the server fragment
         (GET /api/ov-tasks?status=…) carries the localized heading, the
         status switcher and the full list. The inline script copies the
         page's ?status= onto the hx-get BEFORE htmx boots (deferred scripts
         run after parsing), defaulting to planned — the unknown-status case
         is rejected by the route's allowlist and the fragment says so. -->
    <div id="tasks-body" hx-get="/api/ov-tasks?status=planned" hx-trigger="load" hx-swap="innerHTML">
      <div class="skeleton-loading" role="status">
        <div class="card sk-stat" aria-hidden="true">
          <div class="skeleton skeleton-line w-60"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line w-40"></div>
        </div>
        <span class="sr-only" data-i18n="common.loading">Loading…</span>
      </div>
    </div>
    <script>
      (function () {
        try {
          var s = new URLSearchParams(location.search).get('status')
          if (s && ['idea', 'planned', 'in_progress', 'bug'].indexOf(s) !== -1) {
            document.getElementById('tasks-body').setAttribute('hx-get', '/api/ov-tasks?status=' + s)
          }
        } catch (e) { /* default planned stands */ }
      })()
    </script>
  </main>

</body>
