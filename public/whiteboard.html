<body class="canvas-page notebook-scroll">
  <div id="hibana-page-loader" aria-hidden="true"><div class="hibana-page-loader-inner"><div class="hibana-loader-mark" aria-hidden="true"><span class="hibana-loader-glyph">H</span><span class="hibana-loader-orbit"><span class="hibana-loader-spark"></span></span></div><span class="hibana-page-loader-brand">Hibana</span><div class="hibana-loader-track" aria-hidden="true"><span class="hibana-loader-fill"></span></div></div></div>
  <div data-nav></div>
  <h1 class="sr-only" data-i18n="nav.whiteboard">Notebook</h1>

  <!-- a11y (S51-A): main landmark wrapping toolbar + popovers + the sheet —
       display:contents (.landmark-ghost) keeps body.canvas-page's flex column layout
       byte-identical while providing the one <main> (axe landmark-one-main). -->
  <main class="landmark-ghost">
  <!-- A notebook sheet, not a boundless board: pale grid, black/blue pens, eraser, text. -->
  <div class="canvas-toolbar" id="nb-toolbar">
    <button data-tool="move" class="active" title="Move / select" data-i18n-title="wb.move" aria-label="Move / select" data-i18n-aria-label="wb.move"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3m3-3l3 3M12 21l-3-3m3 3l3-3M3 12l3-3m-3 3l3 3M21 12l-3-3m3 3l-3 3"/></svg></button>
    <button data-tool="black" title="Black pen" data-i18n-title="wb.black" aria-label="Black pen" data-i18n-aria-label="wb.black"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20l7-7 2.5 2.5-7 7-2.5-.5-.5-2.5zM14 14l-9 9-2.5-.5-.5-2.5 9-9 3 3z"/></svg></button>
    <button data-tool="blue" class="pen-blue" title="Blue pen" data-i18n-title="wb.blue" aria-label="Blue pen" data-i18n-aria-label="wb.blue"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20l7-7 2.5 2.5-7 7-2.5-.5-.5-2.5zM14 14l-9 9-2.5-.5-.5-2.5 9-9 3 3z"/></svg></button>
    <button data-tool="eraser" title="Eraser" data-i18n-title="wb.eraser" aria-label="Eraser" data-i18n-aria-label="wb.eraser"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l7-7 9 9-7 7-3-3M4 9l6 6M20 21H10"/></svg></button>
    <button data-tool="text" title="Text — click anywhere and type" data-i18n-title="wb.text" aria-label="Text — click anywhere and type" data-i18n-aria-label="wb.text"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6V4h16v2M12 4v16M9 20h6"/></svg></button>
    <button data-tool="note" title="Sticky note — drag to size (click for default)" data-i18n-title="wb.sticky" aria-label="Sticky note — drag to size (click for default)" data-i18n-aria-label="wb.sticky"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5V14l-6 6H5.5A1.5 1.5 0 0 1 4 18.5Z"/><path d="M14 20v-4.5A1.5 1.5 0 0 1 15.5 14H20"/></svg></button>
    <span class="font-pick">
      <label class="small muted" for="nb-font" data-i18n="canvas.fontLabel">Font</label>
      <select id="nb-font" data-font-pick>
        <option value="bebas" data-i18n="font.bebas">Bebas</option>
        <option value="classic" data-i18n="font.classic">Classic</option>
      </select>
    </span>
    <!-- S40 (user request): text alignment — default for new text, live on the selected
         one. Mirrors the canvas toolbar; persisted (0055). -->
    <button data-text-align="left" class="active" title="Align left" data-i18n-title="canvas.alignLeft" aria-label="Align left" data-i18n-aria-label="canvas.alignLeft"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
    <button data-text-align="center" title="Align center" data-i18n-title="canvas.alignCenter" aria-label="Align center" data-i18n-aria-label="canvas.alignCenter"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
    <button data-text-align="right" title="Align right" data-i18n-title="canvas.alignRight" aria-label="Align right" data-i18n-aria-label="canvas.alignRight"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
    <button data-action="addimage" title="Add an image from a link (URL)" data-i18n-title="canvas.addImage" aria-label="Add an image from a link (URL)" data-i18n-aria-label="canvas.addImage"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M5 19l5-6 3 3 4-4 3 3"/></svg></button>
    <button data-action="export" title="Export as PNG" data-i18n-title="canvas.exportPng" aria-label="Export as PNG" data-i18n-aria-label="canvas.exportPng"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0-4-4m4 4 4-4"/><path d="M4 17v1.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg></button>
    <span class="td"></span>
    <button data-action="delete" class="danger" title="Delete selected" data-i18n-title="canvas.deleteSel" aria-label="Delete selected" data-i18n-aria-label="canvas.deleteSel"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    <button data-action="undo" title="Undo" data-i18n-title="wb.undo" aria-label="Undo" data-i18n-aria-label="wb.undo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-4"/></svg></button>
    <button data-action="redo" title="Redo" data-i18n-title="wb.redo" aria-label="Redo" data-i18n-aria-label="wb.redo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h4"/></svg></button>
    <span class="grow"></span>
  </div>

  <!-- P4.3 (F-M17): styled image-from-link popover (replaces the native prompt()). Markup
       mirrors canvas.html's data-image-pop so it inherits the board-popover + image-form CSS. -->
  <div class="board-popover image-pop nb-image-pop" data-image-pop hidden>
    <div class="pop-title" data-i18n="canvas.addImage">Add an image from a link</div>
    <div class="pop-hint" data-i18n="canvas.imageHint">Paste a direct picture link (https://…)</div>
    <form class="image-form" data-image-form novalidate>
      <input type="url" data-image-url dir="ltr" inputmode="url" autocomplete="off" spellcheck="false" required placeholder="https://…" aria-label="Image URL" data-i18n-label="canvas.imagePrompt">
      <button type="submit" data-image-add data-i18n="canvas.imageAdd">Add</button>
    </form>
    <p class="image-error" data-image-error hidden></p>
  </div>

  <!-- Session 28: PNG export popover (parity with the Canvas board's data-export-pop —
       whole page / selection downloads + clipboard copy; 2× resolution, canonical light
       paper background in both themes). Reuses the board-popover + export-row CSS from
       canvas.css and the nb-image-pop fixed top-center placement. -->
  <div class="board-popover export-pop nb-export-pop" data-export-pop hidden>
    <div class="pop-title" data-i18n="canvas.exportPng">Export as PNG</div>
    <div class="pop-hint" data-i18n="canvas.exportHint">2× resolution · paper background</div>
    <div data-export-rows></div>
  </div>

  <div id="nb-page" class="notebook-page">
    <canvas id="nb-board"></canvas>
    <!-- Session 28: sticky recolor palette (parity with the Canvas board's
         data-sticky-palette) — floats under a selected sticky note; 7 pastels. -->
    <div class="sticky-palette" data-sticky-palette hidden></div>
    <!-- S52: skeleton boot state — ghost sticky notes on the paper while the sheet
         loads (the same .skeleton shimmer base the other list pages adopted in S50;
         this page was the last spinner+text pill). data-board-loading is kept verbatim:
         whiteboard.js removes this node when init resolves, and the notebook e2e waits
         for exactly that detachment. -->
    <div class="nb-sk" data-board-loading role="status" aria-label="Loading sheet…" data-i18n-aria-label="wb.loading">
      <div class="nb-sk-note" aria-hidden="true"><div class="skeleton nb-sk-line"></div><div class="skeleton nb-sk-line w-60"></div><div class="skeleton nb-sk-line w-40"></div></div>
      <div class="nb-sk-note" aria-hidden="true"><div class="skeleton nb-sk-line w-60"></div><div class="skeleton nb-sk-line"></div><div class="skeleton nb-sk-line w-40"></div></div>
      <div class="nb-sk-note" aria-hidden="true"><div class="skeleton nb-sk-line"></div><div class="skeleton nb-sk-line w-40"></div></div>
      <div class="nb-sk-note" aria-hidden="true"><div class="skeleton nb-sk-line w-60"></div><div class="skeleton nb-sk-line"></div></div>
      <span class="sr-only" data-i18n="wb.loading">Loading sheet…</span>
    </div>
  </div>
  </main><!-- /.landmark-ghost (S51-A main wrapper) -->

  <script>
    document.addEventListener('DOMContentLoaded', () => window.dispatchEvent(new Event('hibana-nb-init')))
  </script>
</body>
</html>
