# Hibana — Cloudflare Workers config.
# Default config = DEV database. Production lives under [env.prod] (rule: dev first, prod only by deliberate deploy).

name = "hibana"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Scheduled backup: exports the D1 database to the GitHub assets repo.
# Only fires on a deployed Worker; locally it's triggered via POST /api/admin/backup.
# RECOVERED (hotfix window, 2026-08-31): the 03:17 daily backup was widened to
# 4× daily (03:17 / 09:17 / 15:17 / 21:17 UTC) — matches the live deployment's
# schedule exactly. Keep both crons.
[triggers]
crons = ["17 3,9,15,21 * * *", "*/30 * * * *"]

# Static frontend served by the same Worker (single origin, decision Q1-A).
# html_handling/not_found_handling mirror the live deployment's asset settings:
# /404.html is served for missing assets (the app also renders its own branded
# 404 for page routes via notFoundPage in src/app.ts).
#
# P2.5b (live 404 on /app fix, 2026-09-02): not_found_handling was "404-page",
# which made the Cloudflare assets binding serve /404.html (HTTP 404) for ANY
# path it couldn't resolve to a file — INCLUDING Worker-served routes like /app,
# /register, /signup, /to-do-list, /timeline. Those routes never reached the
# Worker, so /app (the authenticated dashboard shell) returned 404 instead of
# redirecting to /login.html. Switched to "none": the assets binding passes
# unresolved paths to the Worker, whose app.get('*') fallback (app.ts:254)
# serves the branded /404.html itself. Static files (.html/.css/.js/.png/etc.)
# are still served directly by the assets binding (they exist on disk).
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[vars]
ENVIRONMENT = "dev"
GITHUB_OWNER = "assadigit"
GITHUB_REPO = "hibana-safe"

# Dev database — created via: npx wrangler d1 create pm-app-dev
[[d1_databases]]
binding = "DB"
database_name = "pm-app-dev"
database_id = "80e02ce2-ca0a-4ccc-beda-8b6cb9c3a984"

# -----------------------------------------------------------------------------------
# Production environment — only touched by `wrangler deploy --env prod`.
# -----------------------------------------------------------------------------------
[env.prod.vars]
ENVIRONMENT = "prod"
GITHUB_OWNER = "assadigit"
GITHUB_REPO = "hibana-safe"
# Mirror origin allowed through the CSRF gate for the ArvanCloud front (docs/edge-mirror.md).
# Inert while the hostname is NXDOMAIN — no page can legitimately originate there until the
# Arvan zone is delegated. The apex NS stay on Cloudflare; only the SUBDOMAIN is delegated.
MIRROR_ORIGIN = "https://fast.hibana.ir"

# Custom domain (hibana.ir): wrangler 4 no longer supports the `custom_domains`
# toml key (it warns "Unexpected fields found ... custom_domains"). Attach it via the
# Cloudflare dashboard (Worker -> hibana-prod -> Settings -> Domains & Routes) or with a
# write-scoped API token + `node scripts/custom-domain.mjs add hibana.ir`. Zone is active.

# Created via: npx wrangler d1 create pm-app-prod
[[env.prod.d1_databases]]
binding = "DB"
database_name = "pm-app-prod"
database_id = "d842fcb5-44f6-4bbd-a772-3699ccadb496"
